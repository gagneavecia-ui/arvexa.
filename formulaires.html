<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- KaTeX -->

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script src="register-sw.js" defer></script>

  <script src="katex-utils.js" defer></script>



  <link rel="stylesheet" href="arvexa-ui.css">
  <style>

    /* ============================================================

       ROOT

       ============================================================ */

    :root{

      --accent:#B8860B;--accent-bright:#E0B84A;--accent-dim:rgba(184,134,11,.08);

      --success:#2D7D5A;--success-light:#3AB67E;--danger:#B85C3A;--danger-light:#f87171;

      --warning:#D4A017;--info:#4AAFE0;

      --bg-dark:#0A0A0A;--bg-surface:#141414;--bg-card:rgba(20,20,20,.7);

      --text-light:#F5F0E8;--text-dim:#8A8A7A;--text-muted:#5A5A4A;--text-body:#cfd0cc;

      --card-border: rgba(184, 134, 11, 0.06);--border-soft:rgba(255,255,255,.05);

      --transition:all .3s cubic-bezier(.25,1,.5,1);--transition-fast:all .15s ease;

      --shadow:0 8px 32px rgba(0,0,0,.4);--radius:16px;

      --font-body:'Inter','Segoe UI',Arial,sans-serif;

      --font-serif:'Playfair Display',Georgia,serif;

      --safe-top:env(safe-area-inset-top,0px);

      --safe-bottom:env(safe-area-inset-bottom,0px);

    }

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html{scroll-behavior:smooth;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}

    body{font-family:var(--font-body);background:var(--bg-dark);color:var(--text-light);

      font-size:14px;line-height:1.6;min-height:100vh;width:100%;overflow-x:hidden;

      -webkit-overflow-scrolling:touch;display:flex;flex-direction:column;

      -webkit-font-smoothing:antialiased;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}

    .gradient-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;

      background:radial-gradient(ellipse 40% 30% at 30% 15%,rgba(184, 134, 11, .16) 0%,transparent 70%),

                  radial-gradient(ellipse 35% 25% at 75% 85%,rgba(184,134,11,.05) 0%,transparent 60%),

                  linear-gradient(180deg,var(--bg-dark) 0%,var(--bg-deep) 100%)}

    .glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:-1;

      opacity:.15;animation:glowMove 10s ease-in-out infinite alternate}

    .glow-1{width:300px;height:300px;background:rgba(184, 134, 11, .18);top:-80px;right:-80px}

    .glow-2{width:180px;height:180px;background:rgba(184,134,11,.05);bottom:0;left:0;animation-delay:-4s}

    @keyframes glowMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.1)}}



    /* HEADER */

    .header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;

      padding:calc(10px + var(--safe-top)) 16px 10px;background:rgba(var(--rgb-veil), .92);

      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);

      border-bottom:1px solid rgba(184,134,11,.06);gap:12px;min-height:56px}

    .header-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}

    .back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;

      border:1px solid rgba(var(--rgb-soft), .05);background:transparent;color:var(--text-dim);cursor:pointer;

      transition:var(--transition);font-size:16px;text-decoration:none;flex-shrink:0}

    .back-btn:hover{border-color:rgba(184,134,11,.14);color:var(--text-light)}

    .page-title{font-size:clamp(13px,1.6vw,15px);font-weight:600;color:var(--text-light);

      font-family:var(--font-serif);display:flex;align-items:center;gap:8px;min-width:0}

    .page-title i{color:var(--accent-bright);font-size:14px}

    .fav-count{font-size:11px;color:var(--accent-bright);background:rgba(184,134,11,.12);

      padding:2px 9px;border-radius:10px;font-weight:700;display:none;

      border:1px solid rgba(184,134,11,.15)}

    .fav-count.visible{display:inline-block}



    /* CONTAINER */

    .container{max-width:720px;margin:0 auto;padding:12px 12px 32px;width:100%;display:flex;flex-direction:column;gap:10px;flex:1}



    /* SEARCH */

    .search-wrap{position:relative}

    .search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}

    .search-input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--card-border);

      background:var(--bg-card);backdrop-filter:blur(10px);color:var(--text-light);font-size:13px;

      font-family:var(--font-body);outline:none;transition:var(--transition)}

    .search-input:focus{border-color:rgba(184,134,11,.25);background:rgba(184,134,11,.02)}

    .search-input::placeholder{color:var(--text-muted)}



    /* TABS */

    .tabs{display:flex;gap:4px;background:rgba(var(--rgb-soft), .02);border-radius:12px;padding:4px;border:1px solid rgba(var(--rgb-soft), .04);overflow-x:auto}

    .tab-btn{flex:1;min-width:70px;padding:9px 6px;border:none;border-radius:10px;background:transparent;color:var(--text-muted);

      font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font-body);

      display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}

    .tab-btn i{font-size:11px}

    .tab-btn.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border:1px solid rgba(184,134,11,.12)}

    .tab-btn:not(.active){border:1px solid transparent}

    .tab-btn:hover:not(.active){color:var(--text-dim)}



    /* THEME FILTERS */

    .filters{display:flex;gap:6px;flex-wrap:wrap}

    .filter-btn{padding:6px 12px;border-radius:20px;border:1px solid rgba(var(--rgb-soft), .05);background:transparent;

      color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition);

      font-family:var(--font-body)}

    .filter-btn.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border-color:rgba(184,134,11,.12)}

    .filter-btn:hover:not(.active){color:var(--text-dim);border-color:rgba(var(--rgb-soft), .08)}



    /* CONTENT */

    .content{display:flex;flex-direction:column;gap:16px}



    /* CATEGORY */

    .category-label{font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;

      letter-spacing:1px;padding:4px 0 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(184,134,11,.06)}

    .category-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(184,134,11,.15),transparent)}

    .category-label .cat-count{font-size:10px;color:var(--text-muted);font-weight:500;text-transform:none;letter-spacing:0}



    /* FORMULA CARD */

    .f-card{background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--card-border);

      border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;transition:var(--transition);

      animation:fadeInUp .4s cubic-bezier(.25,1,.5,1) backwards}

    .f-card:nth-child(1){animation-delay:.02s}

    .f-card:nth-child(2){animation-delay:.04s}

    .f-card:nth-child(3){animation-delay:.06s}

    .f-card:nth-child(4){animation-delay:.08s}

    .f-card:nth-child(5){animation-delay:.1s}

    @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .f-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;

      background:linear-gradient(90deg,var(--accent),var(--success))}

    .f-card:hover{border-color:rgba(184,134,11,.2);transform:translateY(-2px);

      box-shadow:0 8px 24px rgba(0,0,0,.2)}



    .f-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}

    .f-card-title{font-size:14px;font-weight:700;color:var(--text-light);line-height:1.4;cursor:pointer;

      flex:1;min-width:0}

    .f-card-title:hover{color:var(--accent-bright)}

    .f-card-actions{display:flex;gap:4px;flex-shrink:0}

    .icon-action{background:none;border:1px solid transparent;color:var(--text-muted);font-size:14px;

      cursor:pointer;transition:var(--transition);padding:5px 7px;border-radius:10px;line-height:1;

      display:flex;align-items:center;justify-content:center;min-width:32px;height:32px}

    .icon-action:hover{color:var(--text-light);background:rgba(var(--rgb-soft), .05);border-color:rgba(var(--rgb-soft), .05)}

    .icon-action.fav:hover{color:var(--accent-bright);background:rgba(184,134,11,.1)}

    .icon-action.fav.active{color:var(--accent-bright)}

    .icon-action.fav.active i{font-weight:900}

    .icon-action.fav.pop i{animation:favPop .4s cubic-bezier(.34,1.56,.64,1)}

    @keyframes favPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}



    /* FORMULE DANS LA CARTE */

    .f-card-formula{

      padding:12px 0;

      border-top:1px solid rgba(var(--rgb-soft), .03);

      border-bottom:1px solid rgba(var(--rgb-soft), .03);

      margin:4px 0;

      cursor:pointer;

      transition:var(--transition);

      overflow-x:auto;

      overflow-y:hidden;

      -webkit-overflow-scrolling:touch;

      min-height:44px;

      display:flex;

      align-items:center;

      justify-content:center;

    }

    .f-card-formula:hover{

      background:rgba(184,134,11,.03);

    }

    .f-card-formula .katex{

      color:var(--accent-bright);

      font-size:1.15em;

    }

    .f-card-formula .katex-display{

      margin:0;

    }

    .f-card-formula .katex-display > .katex{

      font-size:1.2em;

    }



    .f-card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

    .f-tag{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600}

    .f-tag.units{background:rgba(184, 134, 11, .12);color:var(--success-light)}

    .f-tag.condition{background:rgba(184,134,11,.06);color:var(--accent-bright)}

    .f-card-note{font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5;font-style:italic}

    .f-card-more{font-size:11px;color:var(--accent-bright);margin-top:8px;font-weight:600;

      display:flex;align-items:center;gap:5px;cursor:pointer;opacity:.85}

    .f-card-more:hover{opacity:1}



    /* EMPTY */

    .empty-state{text-align:center;padding:40px 20px}

    .empty-state i{font-size:32px;color:var(--text-muted);margin-bottom:10px}

    .empty-state h4{font-size:15px;color:var(--text-light);margin-bottom:4px}

    .empty-state p{font-size:12px;color:var(--text-dim)}



    /* SKELETON */

    .skeleton-card{background:var(--bg-card);border:1px solid var(--card-border);border-radius:16px;

      padding:14px 16px;position:relative;overflow:hidden;margin-bottom:8px}

    .skeleton-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;

      background:linear-gradient(90deg,rgba(184,134,11,.1) 0%,rgba(184,134,11,.4) 50%,rgba(184,134,11,.1) 100%);

      background-size:200% 100%;animation:skeletonShimmer 1.6s ease-in-out infinite}

    @keyframes skeletonShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    .skeleton-line{background:linear-gradient(90deg,rgba(var(--rgb-soft), .03) 0%,rgba(var(--rgb-soft), .08) 50%,rgba(var(--rgb-soft), .03) 100%);

      background-size:200% 100%;animation:skeletonShimmer 1.6s ease-in-out infinite;border-radius:8px;height:14px;margin-bottom:10px}

    .skeleton-line.title{width:70%;height:16px}

    .skeleton-line.formula{width:100%;height:22px;margin:12px 0;border-radius:10px}

    .skeleton-line.meta{width:40%;height:10px;margin-bottom:0}

    .skeleton-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}

    .skeleton-header .skeleton-line.title{margin-bottom:0}

    .skeleton-icon{width:32px;height:32px;border-radius:10px;

      background:linear-gradient(90deg,rgba(var(--rgb-soft), .03) 0%,rgba(var(--rgb-soft), .08) 50%,rgba(var(--rgb-soft), .03) 100%);

      background-size:200% 100%;animation:skeletonShimmer 1.6s ease-in-out infinite;flex-shrink:0}

    .skeleton-category{height:12px;width:120px;border-radius:8px;

      background:linear-gradient(90deg,rgba(184,134,11,.05) 0%,rgba(184,134,11,.15) 50%,rgba(184,134,11,.05) 100%);

      background-size:200% 100%;animation:skeletonShimmer 1.6s ease-in-out infinite;margin:8px 0 12px}

    .content-fade-in{animation:contentFadeIn .4s cubic-bezier(.25,1,.5,1)}

    @keyframes contentFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}



    /* MODAL */

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);

      -webkit-backdrop-filter:blur(12px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;

      padding:0;opacity:0;visibility:hidden;transition:all .3s cubic-bezier(.25,1,.5,1)}

    .modal-overlay.show{opacity:1;visibility:visible}

    .modal{background:var(--bg-surface);border:1px solid rgba(184,134,11,.15);

      border-radius:20px 20px 0 0;padding:24px 20px;padding-bottom:calc(24px + var(--safe-bottom));

      max-width:600px;width:100%;max-height:92vh;overflow-y:auto;

      transform:translateY(100%);transition:transform .4s cubic-bezier(.25,1,.5,1);position:relative}

    .modal-overlay.show .modal{transform:translateY(0)}

    .modal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:20px 20px 0 0;

      background:linear-gradient(90deg,var(--accent),var(--accent-bright),var(--accent))}

    .modal-handle{width:40px;height:4px;border-radius:8px;background:rgba(var(--rgb-soft), .15);

      margin:0 auto 16px;cursor:grab;transition:background .2s ease}

    .modal-handle:hover{background:rgba(224,184,74,.4)}

    .modal-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;

      border:1px solid rgba(var(--rgb-soft), .05);background:rgba(var(--rgb-soft), .03);color:var(--text-muted);

      cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;

      transition:var(--transition);z-index:5}

    .modal-close:hover{border-color:rgba(184,134,11,.25);color:var(--text-light);background:rgba(184,134,11,.1)}



    .modal-category{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;

      letter-spacing:1.5px;margin-bottom:8px;padding-right:50px}

    .modal-title{font-size:20px;font-weight:700;color:var(--text-light);font-family:var(--font-serif);

      line-height:1.3;margin-bottom:16px;padding-right:50px}



    .modal-formula-box{

      background:linear-gradient(135deg,rgba(184,134,11,.08),rgba(184,134,11,.04));

      border:1px solid rgba(184,134,11,.15);

      border-radius:16px;

      padding:24px 20px;

      margin:14px 0;

      text-align:center;

      position:relative;

      box-shadow:0 4px 20px rgba(184,134,11,.06);

      overflow-x:auto;

      overflow-y:hidden;

      -webkit-overflow-scrolling:touch;

      min-height:80px;

      display:flex;

      align-items:center;

      justify-content:center;

    }

    .modal-formula-box::before{

      content:'';position:absolute;top:0;left:0;right:0;height:2px;

      border-radius:16px 16px 0 0;

      background:linear-gradient(90deg,transparent,var(--accent-bright),transparent)

    }

    .modal-formula-box .katex{

      color:var(--accent-bright);

      font-size:1.4em;

    }

    .modal-formula-box .katex-display{

      margin:0;

    }

    .modal-formula-box .katex-display > .katex{

      font-size:1.5em;

    }



    .modal-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}

    .modal-meta .f-tag{font-size:11px;padding:5px 10px}



    .modal-section{margin-top:20px}

    .modal-section-title{font-size:12px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;

      letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}

    .modal-section-title i{font-size:14px}



    .modal-explanation{font-size:14px;color:var(--text-body);line-height:1.7;padding:14px 16px;

      background:rgba(var(--rgb-soft), .02);border-radius:12px;border-left:3px solid var(--accent)}



    .modal-use-cases{display:flex;flex-direction:column;gap:8px}

    .modal-use-case{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;

      background:rgba(74,175,224,.04);border-radius:10px;border-left:3px solid var(--info)}

    .modal-use-case i{color:var(--info);font-size:14px;margin-top:3px;flex-shrink:0}

    .modal-use-case span{font-size:13.5px;color:var(--text-body);line-height:1.6}



    .modal-example{background:rgba(45,125,90,.04);border:1px solid rgba(45,125,90,.15);border-radius:12px;

      padding:14px 16px}

    .modal-example-title{font-size:13px;font-weight:600;color:var(--success-light);margin-bottom:8px;

      display:flex;align-items:center;gap:6px}

    .modal-example-content{font-size:14px;color:var(--text-body);line-height:1.8}

    .modal-example-content .katex{color:var(--text-light)}



    .modal-warning{background:rgba(184,92,58,.06);border:1px solid rgba(184,92,58,.15);border-radius:12px;

      padding:14px 16px;display:flex;gap:12px;align-items:flex-start}

    .modal-warning i{color:var(--danger-light);font-size:16px;margin-top:2px;flex-shrink:0}

    .modal-warning-content{font-size:13.5px;color:var(--text-body);line-height:1.6}

    .modal-warning-content ul{list-style:none;padding:0}

    .modal-warning-content li{margin-bottom:6px}



    .modal-note{font-size:13px;color:var(--text-body);line-height:1.6;margin:12px 0;padding:12px 14px;

      background:rgba(184,134,11,.04);border-radius:10px;border-left:3px solid var(--accent)}

    .modal-note i{color:var(--accent-bright);margin-right:6px}



    .modal-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}

    .modal-btn{flex:1;min-width:120px;padding:12px 16px;border-radius:12px;border:none;

      font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);

      font-family:var(--font-body);display:flex;align-items:center;justify-content:center;gap:6px}

    .modal-btn.primary{background:linear-gradient(135deg,var(--accent-bright),var(--accent));color:var(--bg-dark)}

    .modal-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(184,134,11,.25)}

    .modal-btn.secondary{background:rgba(var(--rgb-soft), .04);color:var(--text-light);border:1px solid rgba(var(--rgb-soft), .06)}

    .modal-btn.secondary:hover{background:rgba(var(--rgb-soft), .08)}

    .modal-btn.secondary.fav-active{background:rgba(184,134,11,.12);color:var(--accent-bright);border-color:rgba(184,134,11,.2)}



    .modal-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;

      padding-top:16px;border-top:1px solid rgba(var(--rgb-soft), .05)}

    .modal-nav-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;

      border:1px solid rgba(var(--rgb-soft), .06);background:rgba(var(--rgb-soft), .03);color:var(--text-dim);

      font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font-body)}

    .modal-nav-btn:hover:not(:disabled){background:rgba(184,134,11,.08);color:var(--text-light);border-color:rgba(184,134,11,.15)}

    .modal-nav-btn:disabled{opacity:.35;cursor:not-allowed}

    .modal-nav-btn i{font-size:11px}

    .modal-nav-position{font-size:11px;color:var(--text-muted);font-weight:600}



    /* TOAST */

    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);

      padding:12px 20px;border-radius:12px;background:var(--bg-card);backdrop-filter:blur(16px);

      border:1px solid var(--card-border);color:var(--text-light);font-size:13px;z-index:3000;

      opacity:0;transition:all .5s cubic-bezier(.25,1,.5,1);max-width:90%;text-align:center;

const SESSION_KEY = 'arvexa_session';

function saveSession(user) {

  if (!user) return;

  try {

    const data = {

      uid: user.uid,

      email: user.email,

      lastActive: Date.now()

    };

    localStorage.setItem(SESSION_KEY, JSON.stringify(data));

    sessionStorage.setItem(SESSION_KEY, JSON.stringify(data)); // ✅ C2

  } catch (e) {}

}



function clearSession() {

  try {

function escapeHtml(text) {

  const div = document.createElement('div');

  div.textContent = String(text || '');

  return div.innerHTML;

}



function vibrate(ms) {

  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }

}



// ✅ C10 — boucle renderKaTeX limitée à 5 tentatives

let katexRetries = 0;

function renderKaTeX(element) {

  if (typeof renderMathInElement !== 'function') {

    katexRetries++;

    if (katexRetries <= 5) {

      setTimeout(() => renderKaTeX(element), 200);

    } else {

      console.warn('[Formulaires] KaTeX non chargé après 5 tentatives — abandon');

    }

    return;

  }

  katexRetries = 0;

  try {

    renderMathInElement(element || document.body, {

      delimiters: [

        { left: '$$', right: '$$', display: true },

        { left: '\\[', right: '\\]', display: true },

        { left: '$', right: '$', display: false },

        { left: '\\(', right: '\\)', display: false }

      ],

      throwOnError: false,

      errorColor: '#f87171',

      strict: false,

      trust: false

    });

  } catch (e) {}

}



let toastTimer = null;

function showToast(message, type = 'success') {

  const icons = {

    success: 'fas fa-check-circle',

    info: 'fas fa-info-circle',

    error: 'fas fa-exclamation-circle',

    limit: 'fas fa-lock'

  };

  toastMessage.textContent = message;

  toast.className = `toast ${type}`;

  toastIcon.className = icons[type] || icons.info;

  toast.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);

}

}

async function loadFavoritesFromFirestore(uid) {

  return null;

      renderFilters();

      renderContent();

    });

  });

function getFiltered() {

  let list = FORMULAS;



  if (activeTab === 'favs') {

    list = list.filter(f => favorites.includes(f.id));

  } else {

    list = list.filter(f => f.subj === activeTab);

  }



  if (activeTheme !== 'all' && activeTab !== 'favs') {

    list = list.filter(f => f.theme === activeTheme);

  }



  if (searchQuery) {

    const q = searchQuery.toLowerCase();

    list = list.filter(f =>

      (f.name || '').toLowerCase().includes(q) ||

      (f.formula || '').toLowerCase().includes(q) ||

      (f.theme || '').toLowerCase().includes(q) ||

      (f.note && f.note.toLowerCase().includes(q)) ||

      (f.units && f.units.toLowerCase().includes(q)) ||

      (f.explication && f.explication.toLowerCase().includes(q))

    );

  }



  return list;

}

function setupModalSwipe(sheet) {

  let startY = 0, currentY = 0, isDragging = false;

  sheet.addEventListener('touchstart', (e) => {

    const rect = sheet.getBoundingClientRect();

    const touchY = e.touches[0].clientY;

    if (touchY - rect.top < 80) {

      startY = touchY;

      currentY = touchY;

      isDragging = true;

      sheet.style.transition = 'none';

    }

  }, { passive: true });

  sheet.addEventListener('touchmove', (e) => {

    if (!isDragging) return;

    currentY = e.touches[0].clientY;

    const diff = currentY - startY;

    if (diff > 0) {

      sheet.style.transform = `translateY(${diff}px)`;

      e.preventDefault();

    }

  }, { passive: false });

  sheet.addEventListener('touchend', () => {

    if (!isDragging) return;

    isDragging = false;

    sheet.style.transition = '';

    const diff = currentY - startY;

    if (diff > 100) {

      sheet.style.transform = `translateY(100%)`;

      setTimeout(() => {

        modal.classList.remove('show');

        sheet.style.transform = '';

      }, 300);

    } else {

      sheet.style.transform = '';

    }

    startY = 0;

    currentY = 0;

  }, { passive: true });

}



function closeFormulaModal() {

modal.addEventListener('click', (e) => {

async function copyFormula(id) {

  const f = FORMULAS.find(x => x.id === id);

  if (!f) return;

  let text = `${f.name}\n\n${f.formula}`;

  if (f.note) text += `\n\n${f.note}`;

  try {

    if (navigator.clipboard && window.isSecureContext) {

      await navigator.clipboard.writeText(text);

    } else {

      const ta = document.createElement('textarea');

      ta.value = text;

      ta.style.position = 'fixed';

      ta.style.opacity = '0';

      document.body.appendChild(ta);

      ta.focus();

      ta.select();

      document.execCommand('copy');

      ta.remove();

    }

    showToast('Formule copiée', 'success');

    vibrate(10);

  } catch (e) {

    showToast('Impossible de copier', 'error');

  }

}

// AUTH ROBUSTE — ✅ C1/C5/C8

// ================================================================

let isRedirecting = false;

let isAuthResolved = false;

let graceTimer = null;

let maxTimer = null;



// ✅ C1 — préserver les clés existantes + URL complète

function redirectToLogin() {

  if (isRedirecting) return;

  isRedirecting = true;



  if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }

  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

  if (authUnsubscribe) {

    try { authUnsubscribe(); } catch (e) {}

    authUnsubscribe = null;

  }



  try {

    const existing = sessionStorage.getItem('redirectAfterLogin')

                  || sessionStorage.getItem('redirectAfterAuth');

    if (!existing) {

      sessionStorage.setItem('redirectAfterLogin',

        window.location.pathname + window.location.search + window.location.hash);

    }

  } catch (e) {}



  window.location.replace('login.html');

}



function initAuthGuard(onAuthenticated) {

  if (authUnsubscribe) return;  // garde anti-double



  authUnsubscribe = onAuthStateChanged(auth, (user) => {

    if (isAuthResolved) {

      if (user && user.uid !== currentUid) {

        currentUid = user.uid;

        saveSession(user);

        onAuthenticated(user);

      } else if (!user && currentUid) {

        currentUid = null;

        clearSession();

        redirectToLogin();

      }

      return;

    }



    if (!user) {

      if (graceTimer) return;

      graceTimer = setTimeout(() => {

        graceTimer = null;

        if (isAuthResolved) return;

        if (auth.currentUser) return;



        const hasSession = localStorage.getItem(SESSION_KEY);

        const hasUserData = localStorage.getItem(USER_DATA_KEY);



        if ((hasSession || hasUserData) && !navigator.onLine) {

          setTimeout(() => {

            if (auth.currentUser) return;

            if (!isAuthResolved) redirectToLogin();

          }, 1500);

          return;

        }



        if (hasSession && hasUserData) {

          setTimeout(() => {

            if (auth.currentUser) return;

            if (!isAuthResolved) redirectToLogin();

          }, 1500);

          return;

        }



        redirectToLogin();

      }, 600);

      return;

    }



    if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }

    if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }



    isAuthResolved = true;

    currentUid = user.uid;

    saveSession(user);

    onAuthenticated(user);

  });



  maxTimer = setTimeout(() => {

    if (isAuthResolved) return;

    if (auth.currentUser) {

      isAuthResolved = true;

      currentUid = auth.currentUser.uid;

      saveSession(auth.currentUser);

      onAuthenticated(auth.currentUser);

    } else {

      redirectToLogin();

    }

  }, 5000);

}



// ================================================================

// LANCER LA PROTECTION — ✅ C8 (blocked/paused) + sync favoris

// ================================================================

initAuthGuard(async (user) => {

  // ✅ C8 — vérification blocked/paused

  try {

    // ⚡ Cache-first : statut vérifié depuis le cache Firestore local,

    // revalidé silencieusement en arrière-plan.

    const applyStatus = (snap) => {

      const userData = snap.data();



      if (userData.accountStatus === 'blocked') {

        try { sessionStorage.setItem('arvexa_account_blocked', '1'); } catch (e) {}

        signOut(auth).catch(() => {});

        window.location.replace('auth-choice.html');

        return;

      }



      if (userData.accountStatus === 'paused') {

        // Message discret via toast existant

        showToast('Ton compte est temporairement en pause. Contacte le support.', 'error');

        // On laisse la consultation fonctionner (contenu statique), mais on

        // désactive les écritures Firestore pour ne pas aggraver la situation.

      }



      // Cache du profil pour les autres pages

      try {

        localStorage.setItem(USER_DATA_KEY, JSON.stringify({

          ...userData,

          _uid: user.uid,

          _cachedAt: Date.now()

        }));

      } catch (e) {}

    };

    await docSWR(doc(db, 'users', user.uid), applyStatus,

      (a, b) => a.accountStatus !== b.accountStatus);

  } catch (e) {

    console.warn('[Formulaires] Impossible de vérifier le statut :', e.code || e.message);

  }



  // ✅ C7 — recharge les favoris avec la bonne clé (UID)

  const localFavs = loadFavoritesFromLocal();

  if (JSON.stringify(localFavs) !== JSON.stringify(favorites)) {

    favorites = localFavs;

    updateFavCount();

    renderTabs();

    renderContent();  // ✅ C11 — re-render uniquement si différents

  }



  // Synchronisation Firestore en arrière-plan

  if (!isSyncing) {

    isSyncing = true;

    try {

      const remote = await loadFavoritesFromFirestore(user.uid);

      if (remote && Array.isArray(remote)) {

        const merged = [...new Set([...favorites, ...remote])].slice(0, MAX_FAVORITES);

        if (JSON.stringify(merged) !== JSON.stringify(favorites)) {

          favorites = merged;

          saveFavoritesToLocal();

          saveFavoritesToFirestore(user.uid);

          updateFavCount();

          renderTabs();

          renderContent();

        }

      } else {

        if (favorites.length > 0) saveFavoritesToFirestore(user.uid);

      }

    } catch (e) {}

    isSyncing = false;

  }

});



// ✅ C5 — cleanup global

window.addEventListener('beforeunload', () => {

  if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }

  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

  if (authUnsubscribe) { try { authUnsubscribe(); } catch (e) {} authUnsubscribe = null; }

});



console.log('🚀 ARVEXA — Formulaires (version corrigée C1-C11)');

</script>
