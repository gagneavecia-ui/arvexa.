  // concurrence plus les Range requests de la 1ʳᵉ page sur réseau lent.
  // La bibliothèque pdf.js, elle, reste précachée immédiatement.
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'CACHE_URL', url: pdfPath, delay: 6000 });
      navigator.serviceWorker.controller.postMessage({ type: 'CACHE_URL', url: 'assets/pdfjs/pdf.min.js' });
      navigator.serviceWorker.controller.postMessage({ type: 'CACHE_URL', url: 'assets/pdfjs/pdf.worker.min.js' });
    }
  } catch (e) {}

  openArvPdf(pdfPath, pdfPath);
}

// ================================================================
// ✅ v5.5 — ZOOM 100 % STABLE (fini les « coupures » au zoom) :
// Avant, chaque zoom/pinch/rotation VIDAIT les canvases affichés avant de
// re-rendre → la page lue disparaissait 1 à 3 s (rendu haute résolution)
// puis réapparaissait. MAINTENANT (double-buffer) : l'ancien bitmap RESTE
// AFFICHÉ (étiré en CSS), le nouveau se dessine dans un tampon hors écran,
// bascule instantanée par drawImage. + anti-rebond zoom (taps rapides
// fusionnés), file 2 rendus max, plafond 10 Mpx, pages hors écran libérées.
// ✅ v5.3 — VISIONNEUSE PDF ARVEXA (canvas pdf.js, maison)
// v5.3 : OUVERTURE < 5 s + FINI LES PAGES BLANCHES (« crash d'images ») :
// (1) pdf.js préchargé en parallèle de la sonde HEAD ; (2) métrage des pages
// non plus séquentiel (44 aller-retours !) : page 1 mesurée seule, placeholders
// posés, page 1 RENDUE IMMÉDIATEMENT, les autres formats mesurés en fond
// (8 en parallèle) ; (3) file de rendu (3 canvas max en vol) + annulation des
// rendus obsolètes + re-rendu de TOUTES les pages visibles après un
// recadrage — les canvases vidés pendant le scroll/zoom/rotation sont
// repeints au lieu de rester blancs.
// Zéro lecteur système : les pages A4 sont rendues en canvas,
// empilées dans le flux (la barre de progression de l'app suit le
// scroll normalement). Rendu paresseux ±1 écran, nettoyage mémoire
// des pages lointaines, zoom 60–300 %, navigation clavier/boutons.
// v5.2 : NETTETÉ — rendu au minimum 2× la densité d'écran (plancher
// dpr, fini le flou sur les écrans dpr 1), garde-fou mémoire canvas
// (≤ ~12 Mpx, ≤ 4096 px par côté — au-delà les navigateurs mobiles
// brident le canvas en silence et tout devient flou), et RE-RENDU
// automatique au pinch-zoom (visualViewport.scale) : zoomer avec
// les doigts reste net. Affichage 100 % PDF : plus aucun bouton de
// retour vers la version HTML (consigne propriétaire).
// ================================================================
const ARV_PDF_ZOOMS = [0.6, 0.8, 1, 1.25, 1.5, 2, 2.5, 3];
const ARV_PDF_JS = 'assets/pdfjs/pdf.min.js';
const ARV_PDF_WORKER = 'assets/pdfjs/pdf.worker.min.js';
const ARV_PDF_MAX_CANVAS_PX = 10 * 1024 * 1024;   // ~10 Mpx (v5.5 : marge mémoire — un zoom garde 2 bitmaps par page active)
const ARV_PDF_MAX_CANVAS_DIM = 4096;              // largeur max par canvas
let arvPdfState = null;   // état de la visionneuse courante
let arvPdfSeq = 0;        // anti-course (changement rapide de partie)

function destroyArvPdf() {
  if (!arvPdfState) { window.__arvPdfLoading = false; return; }
  window.__arvPdfLoading = false;
  try { if (arvPdfState.observer) arvPdfState.observer.disconnect(); } catch (e) {}
  // ✅ v5.3 — annule tout rendu en vol : un task pdf.js qui survit au
  // démontage repeignait un canvas déjà libéré
  try {
    (arvPdfState.renderTasks || []).forEach((t) => {
      try { if (t) t.cancel(); } catch (e) {}
    });
  } catch (e) {}
  try { if (arvPdfState.doc) arvPdfState.doc.destroy(); } catch (e) {}
  try { if (arvPdfState.zoomTimer) clearTimeout(arvPdfState.zoomTimer); } catch (e) {}
  try {
    if (arvPdfState.vvHook && window.visualViewport) {
      window.visualViewport.removeEventListener('resize', arvPdfState.vvHook);
      window.visualViewport.removeEventListener('scroll', arvPdfState.vvHook);
    }
  } catch (e) {}
  // ✅ v6.5 — retire aussi les hooks window (scroll/resize) posés par
  // wireArvPdf : sans ça, chaque changement de partie en RAJOUTAIT un
  // (10 parties lues = 10 listeners → updateArvPdfCurrent 10× par tick
  // de scroll → lectures offsetTop répétées → jank sur mobiles modestes).
  try {
    if (arvPdfState.scrollHook) window.removeEventListener('scroll', arvPdfState.scrollHook);
    if (arvPdfState.resizeHook) window.removeEventListener('resize', arvPdfState.resizeHook);
  } catch (e) {}
  arvPdfState = null;
}

let arvPdfJsPromise = null; // ✅ v5.3 — promesse mémoïsée : jamais 2 <script>
function loadArvPdfJs() {   // pdf.min.js injectés en parallèle
  if (window.pdfjsLib) return Promise.resolve();
  if (!arvPdfJsPromise) {
    arvPdfJsPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = ARV_PDF_JS;
      s.onload = () => resolve();
      s.onerror = () => { arvPdfJsPromise = null; reject(new Error('pdf.js indisponible')); };
      document.head.appendChild(s);
    });
  }
  return arvPdfJsPromise;
}

// ── Netteté (v5.2, plafond ajusté v5.5) ──────────────────────
// Échelle interne visée = cssScale × max(dpr, 2) × pinch-zoom,
// PLAFONNÉE à 3,5× au total (v5.5) : au-delà, le gain visuel est
// imperceptible sur les écrans ≤ dpr 3 mais le temps de rendu et la
// mémoire explosent (c'est ça qui rendait le zoom lent et figeait
// l'écran). Garde-fous mémoire : canvas ≤ ~10 Mpx et ≤ 4096 px par
// côté (au-delà, les navigateurs mobiles brident le canvas EN
// SILENCE → flou).
const ARV_PDF_MAX_TOTAL_SCALE = 3.5;

function arvVvScale() {
  try {
    const s = (window.visualViewport && window.visualViewport.scale) || 1;
    return Math.min(Math.max(s, 1), 4);
  } catch (e) { return 1; }
}

function arvPdfDpr(cssScale, pageW, pageH) {
  if (!(cssScale > 0) || !(pageW > 0) || !(pageH > 0)) return 2;
  const base = Math.max(window.devicePixelRatio || 1, 2);
  // ✅ v5.5 — plafond de résolution TOTALE (css × dpr) : rendus de zoom
  // ~40 % plus rapides et ~40 % plus légers, netteté inchangée à l'écran
  const want = Math.min(cssScale * base * arvVvScale(), ARV_PDF_MAX_TOTAL_SCALE);
  const maxTotal = Math.sqrt(ARV_PDF_MAX_CANVAS_PX / (pageW * pageH));
  const maxDim = ARV_PDF_MAX_CANVAS_DIM / pageW;
  const s = Math.max(1, Math.min(want, maxTotal, maxDim));
  return s / cssScale;
}

// Pinch-zoom : re-rend les pages visibles à la nouvelle résolution.
function wireArvVvZoom(state) {
  if (!window.visualViewport || state.vvHook) return;
  let timer = null;
  let lastScale = 1;
  state.vvHook = () => {
    const s = arvVvScale();
    if (Math.abs(s - lastScale) < 0.05) return;
    lastScale = s;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const st = arvPdfState;
      if (!st || !st.pageCount) return;
      const cur = Math.max(0, (st.currentPage || 1) - 1);
      for (let k = Math.max(0, cur - 1); k <= Math.min(st.pageCount - 1, cur + 1); k++) {
        // ✅ v5.5 — pinch SANS coupure : l'ancien bitmap reste affiché
        // (double-buffer) pendant le re-rendu à la nouvelle résolution
        if (st.rendered[k] || st.rendering[k]) invalidateArvPdf(st, k, true);
        queueArvPdfRender(k);
      }
    }, 240);
  };
  window.visualViewport.addEventListener('resize', state.vvHook);
  window.visualViewport.addEventListener('scroll', state.vvHook, { passive: true });
}

function openArvPdf(pdfPath, downloadRef) {
  destroyArvPdf();
  // ✅ v5.8 — signal « une lecture est en cours » : le préchauffage des
  // autres parties se met en pause pour laisser toute la bande passante
  // au PDF que l'élève ouvre.
  window.__arvPdfLoading = true;
  const token = ++arvPdfSeq;
  arvPdfState = { token, doc: null, pagesMeta: [], wraps: [], canvases: [],
                  rendered: [], rendering: [], renderTasks: [], dirty: [],
                  queue: [], queued: [], active: 0, visible: new Set(),
                  zoomIdx: 2, observer: null, zoomTimer: null,
                  pageCount: 0, path: pdfPath, vvHook: null,
                  tStart: (window.performance && performance.now()) || 0 };
  // défini AVANT toute utilisation (buildArvPdfPages s'en sert)
  arvPdfState.zoomFactor = () => ARV_PDF_ZOOMS[arvPdfState.zoomIdx] || 1;

  loadArvPdfJs()
    .then(() => {
      if (token !== arvPdfSeq) return;
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = ARV_PDF_WORKER;
      // ✅ v5.3 — disableAutoFetch : sur réseau lent, pdf.js ne récupère que
      // les morceaux (Range) utiles aux pages affichées → 1ʳᵉ page en ~2 s au
      // lieu d'attendre le PDF entier (~7 s à 200 Ko/s). Le téléchargement
      // complet pour le hors-ligne est assuré côté SW (CACHE_URL différé).
      const task = window.pdfjsLib.getDocument({ url: pdfPath, disableAutoFetch: true });
      task.onProgress = (d) => {
        if (token !== arvPdfSeq || !d || !d.total) return;
        const pct = Math.round((d.loaded / d.total) * 100);
        const st = document.getElementById('arvPdfStatus');
        if (st && pct > 4) {
          const p = st.querySelector('p');
          if (p) p.textContent = `Chargement du cours… ${Math.min(99, pct)} %`;
        }
      };
      return task.promise;
    })
    .then((doc) => {
      if (token !== arvPdfSeq) return;
      arvPdfState.doc = doc;
      arvPdfState.pageCount = doc.numPages;
      // ✅ v5.8 — à ce stade le PDF est ENTIÈREMENT téléchargé et déjà en
      // cache (la passerelle SW ne résout qu'après cache.put) : on lève le
      // signal pour que le préchauffage des autres parties puisse démarrer
      // SANS concurrence sur la bande passante.
      window.__arvPdfLoading = false;
      try { window.dispatchEvent(new Event('arvexa-pdf-ready')); } catch (e) {}
      return buildArvPdfPages(doc, token);
    })
    .then(() => { if (token === arvPdfSeq) wireArvPdf(pdfPath); })
    .catch((err) => {
      if (token !== arvPdfSeq) return;
      window.__arvPdfLoading = false;
      try { window.dispatchEvent(new Event('arvexa-pdf-ready')); } catch (e) {}
      console.warn('[ARV-PDF] échec :', err);
      showArvPdfError(pdfPath);
    });
}

async function buildArvPdfPages(doc, token) {
  const state = arvPdfState;
  const pagesWrap = document.getElementById('arvPdfPages');
  if (!state || !pagesWrap) return;
  pagesWrap.innerHTML = '';

  // ✅ v5.3 — AVANT : await doc.getPage(i+1) SÉQUENTIELLEMENT pour les ~44
  // pages avant d'afficher quoi que ce soit (1 à 2 s perdues).
  // MAINTENANT : la page 1 est mesurée seule (toutes les feuilles du cours
  // partagent le format A4), les placeholders sont posés à la bonne hauteur
  // (zéro saut de scroll), la page 1 se PEINT IMMÉDIATEMENT, et les rares
  // formats différents sont mesurés en arrière-plan (8 en parallèle).
  const first = await doc.getPage(1);
  if (token !== arvPdfSeq) return;
  const vp0 = first.getViewport({ scale: 1 });

  const viewport = document.getElementById('arvPdfViewport');
  state.containerW = Math.max(240, (viewport ? viewport.clientWidth : 320));

  const n = doc.numPages;
  state.pagesMeta = new Array(n);
  for (let i = 0; i < n; i++) state.pagesMeta[i] = { w: vp0.width, h: vp0.height };

  for (let i = 0; i < n; i++) {
    const meta = state.pagesMeta[i];
    const cssW = state.containerW * state.zoomFactor();
    const cssH = cssW * (meta.h / meta.w);
    const wrap = document.createElement('div');
    wrap.className = 'arv-pdf-page';
    wrap.style.width = Math.round(cssW) + 'px';
    wrap.style.height = Math.round(cssH) + 'px';
    wrap.innerHTML = `<div class="arv-pdf-ph"><i class="fas fa-file-lines"></i> Page ${i + 1}</div>`;
    const canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    pagesWrap.appendChild(wrap);
    state.wraps.push(wrap);
    state.canvases.push(canvas);
    state.rendered.push(false);
    state.rendering.push(false);
  }

  // Rendu paresseux : ±1,5 écran autour du viewport.
  // ✅ v5.3 — les index visibles sont tracés : après un recadrage (rotation,
  // scrollbar, zoom, pinch), TOUTES les pages visibles sont repeintes et non
  // plus seulement la courante → fini les pages blanches qui restaient vides
  // jusqu'à sortir de l'écran (« crash d'images »).
  state.observer = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      const idx = state.wraps.indexOf(en.target);
      if (idx < 0) return;
      if (en.isIntersecting) {
        state.visible.add(idx);
        queueArvPdfRender(idx);
      } else {
        state.visible.delete(idx);
        scheduleArvPdfCleanup(idx);
      }
    });
  }, { rootMargin: '160% 0px 160% 0px' });
  state.wraps.forEach((w) => state.observer.observe(w));
  updateArvPdfCurrent();

  // Resynchronisation après pose des pages : la barre de défilement
  // verticale qui vient d'apparaître réduit la largeur utile (desktop,
  // rotation…). Sans recadrage, les feuilles A4 débordent de l'écran.
  syncArvPdfWidth();
  requestAnimationFrame(() => requestAnimationFrame(syncArvPdfWidth));

  // ✅ v5.3 — la 1ʳᵉ page (et la suivante) se peignent TOUT DE SUITE,
  // sans attendre le premier tick de l'observer : c'est ça qui fait
  // passer l'ouverture sous les 5 secondes.
  queueArvPdfRender(0);
  if (n > 1) queueArvPdfRender(1);

  // ✅ v5.3 — mesure des pages restantes en arrière-plan (8 en parallèle) :
  // seules celles dont le format diffère de la page 1 sont recadrées.
  for (let start = 1; start < n; start += 8) {
    const batch = [];
    for (let i = start; i < Math.min(n, start + 8); i++) batch.push(i);
    const metas = await Promise.all(batch.map(async (i) => {
      try {
        const pg = await doc.getPage(i + 1);
        const vp = pg.getViewport({ scale: 1 });
        return { i, w: vp.width, h: vp.height };
      } catch (e) { return null; }
    }));
    if (token !== arvPdfSeq) return;
    const changed = [];
    metas.forEach((m) => {
      if (!m) return;
      const prev = state.pagesMeta[m.i];
      if (prev && Math.abs(prev.w - m.w) < 0.5 && Math.abs(prev.h - m.h) < 0.5) return;
      state.pagesMeta[m.i] = { w: m.w, h: m.h };
      changed.push(m.i);
    });
    if (!changed.length) continue;
    const z = state.zoomFactor();
    changed.forEach((i) => {
      const meta = state.pagesMeta[i];
      const cssW = Math.round(state.containerW * z);
      const cssH = Math.round(cssW * (meta.h / meta.w));
      state.wraps[i].style.width = cssW + 'px';
      state.wraps[i].style.height = cssH + 'px';
      if (state.rendered[i] || state.rendering[i]) clearArvPdfCanvas(state, i);
    });
    changed.forEach((i) => { if (state.visible.has(i)) queueArvPdfRender(i); });
  }
}

// ── ✅ v5.5 — FILE DE RENDU + DOUBLE-BUFFER (zoom SANS coupure) ──
// Avant v5.5, chaque zoom/pinch/rotation VIDAIT les canvases affichés
// (clearArvPdfCanvas) AVANT de re-rendre → la page lue devenait blanche
// 1 à 3 s (le temps du rendu haute résolution) puis réapparaissait :
// les « coupures » signalées par l'utilisateur.
// DÉSORMAIS : invalidateArvPdf(i, true) garde l'ancien bitmap AFFICHÉ
// (étiré en CSS pendant un instant) ; le nouveau rendu se prépare dans un
// tampon hors écran et la bascule ancien→nouveau est instantanée.
// Seules les pages HORS ÉCRAN sont vidées (libération mémoire).
// File avec priorité (la page lue d'abord), 2 rendus max en vol.
const ARV_PDF_MAX_ACTIVE = 2;

// Invalide une page pour re-rendu.
// keepOld=true  → l'ancien bitmap reste affiché (double-buffer, page à l'écran)
// keepOld=false → canvas libéré immédiatement (page hors écran)
function invalidateArvPdf(state, i, keepOld) {
  const t = state.renderTasks[i];
  if (t) {
    state.renderTasks[i] = null;
    try { t.cancel(); } catch (e) {}
  }
  if (keepOld) {
    state.dirty[i] = true;   // le canvas garde son bitmap visible
  } else {
    const c = state.canvases[i];
    c.width = 0; c.height = 0;
    state.rendered[i] = false;
    state.wraps[i].classList.remove('rendered');
  }
  // le catch du rendu annulé est idempotent ; on remet déjà le drapeau ici
  // pour que la file puisse relancer un rendu immédiatement
  state.rendering[i] = false;
}

function clearArvPdfCanvas(state, i) { invalidateArvPdf(state, i, false); }

function queueArvPdfRender(i) {
  const state = arvPdfState;
  if (!state || !state.doc) return;
  if (state.queued[i] || state.rendering[i]) return;
  if (state.rendered[i] && !state.dirty[i]) return;
  state.queued[i] = true;
  state.queue.push(i);
  pumpArvPdfQueue();
}

function pumpArvPdfQueue() {
  const state = arvPdfState;
  if (!state) return;
  while (state.active < ARV_PDF_MAX_ACTIVE && state.queue.length) {
    // priorité : page la plus proche de celle en cours de lecture
    let best = 0, bd = Infinity;
    for (let k = 0; k < state.queue.length; k++) {
      const d = Math.abs(state.queue[k] - ((state.currentPage || 1) - 1));
      if (d < bd) { bd = d; best = k; }
    }
    const i = state.queue.splice(best, 1)[0];
    state.queued[i] = false;
    if (state.rendering[i] || (state.rendered[i] && !state.dirty[i])) continue;
    state.active++;
    Promise.resolve(renderArvPdfPage(i))
      .catch(() => {})
      .finally(() => {
        state.active--;
        pumpArvPdfQueue();
      });
  }
}

// ✅ v5.5 — recadrage COMMUN (zoom, rotation, scrollbar) SANS vider les
// pages affichées : pages à l'écran (±40 % de marge) → double-buffer,
// pages hors écran → libérées (mémoire). Priorité de file : page lue.
function resizeArvPdfPages(state) {
  const vh = window.innerHeight || 800;
  const z = state.zoomFactor();
  const onscreen = new Array(state.pageCount);
  for (let i = 0; i < state.pageCount; i++) {
    const r = state.wraps[i].getBoundingClientRect();
    onscreen[i] = r.bottom > -vh * 0.4 && r.top < vh * 1.4;
  }
  for (let i = 0; i < state.pageCount; i++) {
    const meta = state.pagesMeta[i];
    const cssW = Math.round(state.containerW * z);
    const cssH = Math.round(cssW * (meta.h / meta.w));
    state.wraps[i].style.width = cssW + 'px';
    state.wraps[i].style.height = cssH + 'px';
    if (state.rendered[i] || state.rendering[i]) {
      // ✅ v5.5 — à l'écran : l'ancien bitmap RESTE affiché (aucune coupure)
      invalidateArvPdf(state, i, onscreen[i]);
    }
  }
  // re-rendu : toutes les pages visibles (observer ±160 %) + courante +
  // suivante ; la priorité de file peint d'abord la page en cours de lecture
  state.visible.forEach((i) => queueArvPdfRender(i));
  const cur = Math.max(0, (state.currentPage || 1) - 1);
  queueArvPdfRender(cur);
  queueArvPdfRender(Math.min(state.pageCount - 1, cur + 1));
}

// Recadre toutes les pages sur la largeur réelle du conteneur.
// Retourne true si une resynchronisation a eu lieu.
function syncArvPdfWidth() {
  const state = arvPdfState;
  if (!state || !state.pageCount || !state.wraps.length) return false;
  const vp = document.getElementById('arvPdfViewport');
  if (!vp) return false;
  const w = Math.max(240, vp.clientWidth);
  if (Math.abs(w - state.containerW) <= 2) return false;
  state.containerW = w;
  resizeArvPdfPages(state);
  return true;
}

function renderArvPdfPage(i) {
  const state = arvPdfState;
  if (!state || !state.doc || state.rendering[i]) return Promise.resolve();
  if (state.rendered[i] && !state.dirty[i]) return Promise.resolve();
  state.rendering[i] = true;
  state.dirty[i] = false;
  const token = state.token;
  const canvas = state.canvases[i];
  const meta = state.pagesMeta[i];
  const cssW = Math.round(state.containerW * state.zoomFactor());
  const cssH = Math.round(cssW * (meta.h / meta.w));
  // ✅ v5.5 — DOUBLE-BUFFER : si la page affiche déjà un bitmap, il reste
  // VISIBLE (étiré à la nouvelle taille CSS) pendant tout le re-rendu ;
  // le nouveau se dessine dans un tampon hors écran. Aucune coupure blanche,
  // la bascule ancien→nouveau est un simple drawImage (< 30 ms).
  const hasOld = !!(state.rendered[i] || canvas.width > 0);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const target = hasOld ? document.createElement('canvas') : canvas;
  let myTask = null;
  return state.doc.getPage(i + 1).then((page) => {
    if (token !== arvPdfSeq) return;
    const cssScale = cssW / meta.w;
    const dpr = arvPdfDpr(cssScale, meta.w, meta.h);
    const viewport = page.getViewport({ scale: cssScale * dpr });
    // ✅ v5.5 — le plafond 3,5× est déjà atteint et le bitmap affiché a la
    // MÊME résolution que la cible (ex. zoom 150→200 % sur écran dpr 3) :
    // seul la taille CSS a changé (déjà appliquée) → AUCUN re-rendu, zéro
    // CPU/GPU, le zoom est instantané. Avant, on re-rendait quand même
    // 6-10 Mpx pour produire EXACTEMENT le même bitmap.
    if (hasOld && canvas.width === Math.floor(viewport.width) &&
        canvas.height === Math.floor(viewport.height)) {
      state.rendered[i] = true;
      state.rendering[i] = false;
      state.wraps[i].classList.add('rendered');
      return;
    }
    target.width = Math.floor(viewport.width);
    target.height = Math.floor(viewport.height);
    const ctx = target.getContext('2d', { alpha: false });
    const task = page.render({ canvasContext: ctx, viewport });
    myTask = task;
    state.renderTasks[i] = task;
    return task.promise.then(() => {
      // un rendu plus récent a pris le relais (zoom rapide) : on s'efface
      if (state.renderTasks[i] !== myTask) return;
      state.renderTasks[i] = null;
      if (token !== arvPdfSeq) {
        if (hasOld) { target.width = 0; target.height = 0; }
        return;
      }
      // ✅ v5.3 — le canvas visible a été vidé entre-temps (nettoyage hors
      // écran) : on abandonne le tampon, la file repeindra la page.
      if (!canvas.width) {
        if (hasOld) { target.width = 0; target.height = 0; }
        state.rendering[i] = false;
        return;
      }
      // ✅ v5.5 — bascule instantanée ancien → nouveau bitmap
      if (hasOld) {
        canvas.width = target.width;
        canvas.height = target.height;
        canvas.getContext('2d', { alpha: false }).drawImage(target, 0, 0);
        target.width = 0; target.height = 0;   // tampon libéré immédiatement
      }
      state.rendered[i] = true;
      state.rendering[i] = false;
      state.wraps[i].classList.add('rendered');
      if (i === 0 && !state.firstPageDone) {
        state.firstPageDone = true;
        try {
          console.info(`[ARV-PDF] 1re page affichée en ${Math.round(performance.now() - state.tStart)} ms`);
        } catch (e) {}
      }
    });
  }).catch((err) => {
    if (myTask && state.renderTasks[i] === myTask) state.renderTasks[i] = null;
    if (!state.renderTasks[i] && state.rendering[i]) state.rendering[i] = false;
    // ✅ v5.3 — annulation volontaire (clear/canvas 0) : silencieux
    if (err && (err.name === 'RenderingCancelledException' || /cancel/i.test(String(err.message || '')))) return;
    console.warn('[ARV-PDF] rendu page', i + 1, err);
  });
}

// Libère la mémoire des pages trop loin du viewport (mobiles modestes)
function scheduleArvPdfCleanup(idx) {
  const state = arvPdfState;
  if (!state || state.cleanupTimer) return;
  state.cleanupTimer = setTimeout(() => {
    state.cleanupTimer = null;
    if (!arvPdfState) return;
    const cur = arvPdfState.currentPage || 0;
    if (Math.abs(idx - cur) > 4 && (arvPdfState.rendered[idx] || arvPdfState.rendering[idx])) {
      // ✅ v5.3 — clearArvPdfCanvas annule aussi le rendu en vol
      clearArvPdfCanvas(arvPdfState, idx);
    }
  }, 400);
}

// ✅ v5.5 — ZOOM SANS COUPURE : plus aucun clear des pages affichées.
// L'ancien bitmap reste visible (étiré en CSS) pendant le re-rendu en
// double-buffer ; bascule instantanée dès que la nouvelle résolution est
// prête. Anti-rebond : des taps rapides sur zoom +/− fusionnent en UN
// re-rendu (avant : 1 re-rendu complet par tap → écran figé).
function rerenderArvPdf() {
  const state = arvPdfState;
  if (!state) return;
  const viewport = document.getElementById('arvPdfViewport');
  if (viewport) state.containerW = Math.max(240, viewport.clientWidth);
  resizeArvPdfPages(state);
  updateArvPdfZoomLabel();
}

function scheduleArvZoomRerender() {
  const state = arvPdfState;
  if (!state) return;
  clearTimeout(state.zoomTimer);
  state.zoomTimer = setTimeout(() => {
    if (arvPdfState) { arvPdfState.zoomTimer = null; rerenderArvPdf(); }
  }, 160);
}

// suivi continu du conteneur (rotation, barres latérales, split-screen)
if (typeof ResizeObserver !== 'undefined') {
  const arvPdfRO = new ResizeObserver(() => {
    if (arvPdfState && arvPdfState.pageCount) syncArvPdfWidth();
  });
  const roWatch = setInterval(() => {
    const vp = document.getElementById('arvPdfViewport');
    if (vp) { arvPdfRO.observe(vp); clearInterval(roWatch); }
  }, 1000);
  setTimeout(() => clearInterval(roWatch), 30000);
}

function updateArvPdfZoomLabel() {
  const el = document.getElementById('arvPdfZoom');
  if (el && arvPdfState) el.textContent = Math.round(arvPdfState.zoomFactor() * 100) + ' %';
}

function updateArvPdfCurrent() {
  const state = arvPdfState;
  if (!state || !state.pageCount) return;
  const wraps = state.wraps;
  const ref = window.scrollY + window.innerHeight * 0.35;
  let cur = 0;
  for (let i = 0; i < wraps.length; i++) {
    if (wraps[i].offsetTop <= ref) cur = i; else break;
  }
  state.currentPage = cur + 1;
  const count = document.getElementById('arvPdfCount');
  if (count) count.textContent = `${cur + 1} / ${state.pageCount}`;
  const prev = document.getElementById('arvPdfPrev');
  const next = document.getElementById('arvPdfNext');
  if (prev) prev.disabled = cur <= 0;
  if (next) next.disabled = cur >= state.pageCount - 1;
}

function scrollToArvPdfPage(i) {
  const state = arvPdfState;
  if (!state || !state.wraps[i]) return;
  const y = state.wraps[i].offsetTop - 8;
  window.scrollTo({ top: y, behavior: 'smooth' });
}

function wireArvPdf(pdfPath) {
  const state = arvPdfState;
  if (!state) return;
  updateArvPdfZoomLabel();
  updateArvPdfCurrent();
  wireArvVvZoom(state);

  const on = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', fn);
  };
  on('arvPdfPrev', () => scrollToArvPdfPage(Math.max(0, (state.currentPage || 1) - 2)));
  on('arvPdfNext', () => scrollToArvPdfPage(Math.min(state.pageCount - 1, (state.currentPage || 1))));
  on('arvPdfZoomIn', () => {
    if (state.zoomIdx < ARV_PDF_ZOOMS.length - 1) {
      state.zoomIdx++;
      updateArvPdfZoomLabel();     // retour visuel immédiat
      scheduleArvZoomRerender();   // ✅ v5.5 — fusion des taps rapides
    }
  });
  on('arvPdfZoomOut', () => {
    if (state.zoomIdx > 0) {
      state.zoomIdx--;
      updateArvPdfZoomLabel();
      scheduleArvZoomRerender();
    }
  });

  if (!state.scrollHook) {
    state.scrollHook = () => updateArvPdfCurrent();
    window.addEventListener('scroll', state.scrollHook, { passive: true });
  }

  // redimensionnement : largeur recalculée (zoom « ajusté » conservé)
  if (!state.resizeHook) {
    let rt = null;
    state.resizeHook = () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        if (!arvPdfState) return;
        const vp = document.getElementById('arvPdfViewport');
        if (vp && Math.abs(vp.clientWidth - arvPdfState.containerW) > 24) rerenderArvPdf();
      }, 220);
    };
    window.addEventListener('resize', state.resizeHook);
  }

  // cache SW du worker si chargé à la volée
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'CACHE_URL', url: ARV_PDF_WORKER });
      navigator.serviceWorker.controller.postMessage({ type: 'CACHE_URL', url: ARV_PDF_JS });
    }
  } catch (e) {}
}

function showArvPdfError(pdfPath) {
  const status = document.getElementById('arvPdfStatus');
  if (!status) return;
  status.innerHTML = `
    <i class="fas fa-triangle-exclamation" style="font-size:30px;color:var(--warning-bright,#E0B84A);"></i>
    <h3>PDF indisponible</h3>
    <p>Le PDF n'a pas pu être chargé (connexion ou mémoire). Vérifie ta connexion puis réessaie.</p>
    <div class="arv-pdf-status-actions">
      <button class="arv-pdf-status-btn" id="arvPdfRetry"><i class="fas fa-rotate-right"></i> Réessayer</button>
    </div>
  `;
  const retry = document.getElementById('arvPdfRetry');
  if (retry) retry.addEventListener('click', () => {
    // ✅ v5.3 — skeleton + libellé « cours » (plus de spinner « PDF »)
    status.innerHTML = `
      <div class="arv-pdf-skel" aria-hidden="true">
        <div class="arv-pdf-skel-page"><span class="arv-pdf-skel-line t"></span><span class="arv-pdf-skel-line l1"></span><span class="arv-pdf-skel-line l3"></span><span class="arv-pdf-skel-line l5"></span></div>
        <div class="arv-pdf-skel-page"><span class="arv-pdf-skel-line t"></span><span class="arv-pdf-skel-line l1"></span><span class="arv-pdf-skel-line l2"></span><span class="arv-pdf-skel-line l4"></span><span class="arv-pdf-skel-line l5"></span></div>
        <div class="arv-pdf-skel-page"><span class="arv-pdf-skel-line t"></span><span class="arv-pdf-skel-line l2"></span><span class="arv-pdf-skel-line l3"></span><span class="arv-pdf-skel-line l5"></span></div>
      </div>
      <p>Chargement du cours…</p>
    `;
    openArvPdf(pdfPath, pdfPath);
  });
}

function loadPartHtml(filePath) {
  // retour depuis le lecteur PDF : visionneuse démontée + bouton écouter rendu
  destroyArvPdf();
  if (ttsBtn) ttsBtn.style.display = '';
  fetch(filePath)
    .then(r => {
      if (!r.ok) {
        const err = new Error(r.status === 504 ? 'offline' : 'not found');
        err.isOffline = (r.status === 504) || navigator.onLine === false;
        err.isMissing = !err.isOffline;
        throw err;
      }
      return r.text();
    })
    .then(html => {
      const cleaned = preprocessContent(html);
      contentBody.innerHTML = cleaned;
      markPartAsRead();
      loadNotes();
      renderKaTeX();
      enhanceContent();
      updateReadProgress();
      resetStudyTimer();
    })
    .catch((err) => {
      // ✅ v4.30 — plus de faux « bientôt disponible » : si c'est le réseau
      // (hors ligne, 504 du SW, requête avortée) on affiche le panneau
      // hors-ligne avec Réessayer ; « bientôt disponible » = vrai 404.
      const offline = !err || err.isOffline || err instanceof TypeError || navigator.onLine === false;
      if (offline) showOfflinePanel();
      else showContentUnavailable();
    });
}

// ================================================================
// TTS
// ================================================================
const TTS_SUPPORTED = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

const tts = {
  synth: TTS_SUPPORTED ? window.speechSynthesis : null,
  chunks: [],
  currentChunk: 0,
  utterance: null,
  voice: null,
  isSpeaking: false,
  isPaused: false,
  isActive: false,
  rate: 0.92,
  pitch: 1,
  volume: 1,
  stopRequested: false
};

function loadTTSVoices() {
  if (!TTS_SUPPORTED) return;
  const voices = tts.synth.getVoices();
  if (!voices || voices.length === 0) return;
  tts.voice =
    voices.find(v => v.lang && v.lang.toLowerCase() === 'fr-fr' && v.localService) ||
    voices.find(v => v.lang && v.lang.toLowerCase() === 'fr-fr') ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) ||
    null;
}

loadTTSVoices();
if (TTS_SUPPORTED && 'onvoiceschanged' in window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadTTSVoices;
}

function cleanTTS(text) {
  if (!text) return '';
  let result = String(text);
  result = result.replace(/\$\$([^$]+)\$\$/g, (m, f) => convertMathToSpeech(f));
  result = result.replace(/\$([^$]+)\$/g, (m, f) => convertMathToSpeech(f));
  result = result.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ');
  result = result.replace(/⟺/g, ' si et seulement si ');
  result = result.replace(/⟹/g, ' implique ');
  result = result.replace(/→/g, ' vers ');
  result = result.replace(/←/g, ' de ');
  result = result.replace(/∈/g, ' appartient à ');
  result = result.replace(/≤/g, ' inférieur ou égal à ');
  result = result.replace(/≥/g, ' supérieur ou égal à ');
  result = result.replace(/≠/g, ' différent de ');
  result = result.replace(/√/g, ' racine carrée de ');
  result = result.replace(/([A-Za-z0-9])²/g, '$1 au carré');
  result = result.replace(/([A-Za-z0-9])³/g, '$1 au cube');
  result = result.replace(/×/g, ' fois ');
  result = result.replace(/÷/g, ' divisé par ');
  result = result.replace(/∞/g, ' infini ');
  result = result.replace(/π/g, ' pi ');
  result = result.replace(/−/g, ' moins ');
  return result.replace(/\s+/g, ' ').trim();
}

function convertMathToSpeech(latex) {
  let s = String(latex);
  s = s.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, ' $1 sur $2 ');
  s = s.replace(/\\sqrt\{([^}]+)\}/g, ' racine de $1 ');
  s = s.replace(/([a-zA-Z0-9])\^\{([^}]+)\}/g, ' $1 puissance $2 ');
  s = s.replace(/([a-zA-Z0-9])\^([a-zA-Z0-9])/g, ' $1 puissance $2 ');
  s = s.replace(/([a-zA-Z0-9])_\{([^}]+)\}/g, ' $1 indice $2 ');
  s = s.replace(/([a-zA-Z0-9])_([a-zA-Z0-9])/g, ' $1 indice $2 ');
  s = s.replace(/\\cos/g, ' cosinus ');
  s = s.replace(/\\sin/g, ' sinus ');
  s = s.replace(/\\tan/g, ' tangente ');
  s = s.replace(/\\ln/g, ' logarithme népérien ');
  s = s.replace(/\\pi/g, ' pi ');
  s = s.replace(/\\times/g, ' fois ');
  s = s.replace(/\\div/g, ' divisé par ');
  s = s.replace(/\\infty/g, ' infini ');
  s = s.replace(/\\/g, ' ');
  s = s.replace(/[{}]/g, ' ');
  return s.replace(/\s+/g, ' ').trim();
}

function extractReadableContent() {
  const container = document.querySelector('#contentBody .lecture-container') ||
                    document.querySelector('.lecture-container') ||
                    document.querySelector('#contentBody');
  if (!container) return [];

  const parts = [];
  const selectors = [
    '.lecture-hero h1', '.lecture-hero p',
    '.lecture-section h2', '.lecture-section h3', '.lecture-section p',
    '.lecture-callout', '.lecture-aside',
    '.lecture-example p', '.lecture-formula-main',
    '.lecture-step p', '.lecture-container > p'
  ];

  const elements = container.querySelectorAll(selectors.join(','));
  const seen = new Set();

  elements.forEach(el => {
    if (seen.has(el)) return;
    if (el.closest('button') || el.matches('button')) return;
    let text = el.innerText || el.textContent || '';
    text = cleanTTS(text);
    if (!text) return;
    if (parts.some(p => p.toLowerCase() === text.toLowerCase())) return;
    seen.add(el);
    parts.push(text);
  });

  if (parts.length === 0) {
    let fallback = container.innerText || container.textContent || '';
    fallback = cleanTTS(fallback);
    if (fallback) parts.push(fallback);
  }

  const chunks = [];
  parts.forEach(text => {
    const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
    let current = '';
    sentences.forEach(s => {
      s = s.trim();
      if (!s) return;
      if ((current + ' ' + s).length <= 200) {
        current += (current ? ' ' : '') + s;
      } else {
        if (current) chunks.push(current.trim());
        current = s;
      }
    });
    if (current) chunks.push(current.trim());
  });

  return chunks.filter(c => c.length > 1);
}

function updateTTSButton(state) {
  if (!ttsBtn) return;
  const icon = ttsBtn.querySelector('i');
  const text = ttsBtn.querySelector('span');
  if (state === 'speaking') {
    ttsBtn.classList.add('speaking');
    ttsBtn.classList.remove('paused');
    if (icon) icon.className = 'fas fa-pause';
    if (text) text.textContent = 'Pause';
  } else if (state === 'paused') {
    ttsBtn.classList.remove('speaking');
    ttsBtn.classList.add('paused');
    if (icon) icon.className = 'fas fa-play';
    if (text) text.textContent = 'Reprendre';
  } else {
    ttsBtn.classList.remove('speaking', 'paused');
    if (icon) icon.className = 'fas fa-volume-up';
    if (text) text.textContent = 'Écouter';
  }
}

function updateTTSProgress() {
  if (!ttsProgressFill || !tts.chunks.length) return;
  const p = ((tts.currentChunk + 1) / tts.chunks.length) * 100;
  ttsProgressFill.style.width = Math.min(100, p) + '%';
}

function resetTTSProgress() {
  if (ttsProgressFill) ttsProgressFill.style.width = '0%';
}

function speakChunk(index) {
  if (!TTS_SUPPORTED) return;
  if (index >= tts.chunks.length) { finishTTS(); return; }
  if (tts.stopRequested) return;

  tts.currentChunk = index;
  const text = tts.chunks[index];
  if (!text) { speakChunk(index + 1); return; }

  try { tts.synth.cancel(); } catch (e) {}

  const utterance = new SpeechSynthesisUtterance(text);
  tts.utterance = utterance;
  utterance.lang = 'fr-FR';
  utterance.rate = tts.rate;
  utterance.pitch = tts.pitch;
  utterance.volume = tts.volume;
  if (tts.voice) utterance.voice = tts.voice;

  utterance.onstart = () => {
    tts.isSpeaking = true;
    tts.isPaused = false;
    updateTTSButton('speaking');
    updateTTSProgress();
  };

  utterance.onend = () => {
    if (tts.stopRequested) return;
    const next = index + 1;
    if (next < tts.chunks.length) {
      setTimeout(() => {
        if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) speakChunk(next);
      }, 80);
    } else finishTTS();
  };

  utterance.onerror = (e) => {
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    finishTTS();
  };

  tts.synth.speak(utterance);
  setTimeout(() => {
    if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) {
      try { tts.synth.resume(); } catch (e) {}
    }
  }, 100);
}

function startTTS() {
  if (!TTS_SUPPORTED) return;
  try { tts.synth.cancel(); } catch (e) {}
  tts.stopRequested = false;
  tts.chunks = extractReadableContent();
  if (!tts.chunks.length) return;
  loadTTSVoices();
  tts.currentChunk = 0;
  tts.isSpeaking = true;
  tts.isPaused = false;
  tts.isActive = true;
  ttsProgress.classList.add('active');
  resetTTSProgress();
  updateTTSButton('speaking');
  speakChunk(0);
}

function pauseTTS() {
  if (!TTS_SUPPORTED || !tts.synth || !tts.isSpeaking) return;
  try { tts.synth.cancel(); } catch (e) {}
  tts.isPaused = true;
  tts.isSpeaking = false;
  updateTTSButton('paused');
}

function resumeTTS() {
  if (!TTS_SUPPORTED || !tts.synth || !tts.isPaused) return;
  tts.isPaused = false;
  tts.isSpeaking = true;
  tts.stopRequested = false;
  updateTTSButton('speaking');
  setTimeout(() => {
    if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) speakChunk(tts.currentChunk);
  }, 150);
}

function stopTTS() {
  if (!TTS_SUPPORTED || !tts.synth) return;
  tts.stopRequested = true;
  try { tts.synth.cancel(); } catch (e) {}
  tts.isSpeaking = false;
  tts.isPaused = false;
  tts.isActive = false;
  tts.utterance = null;
  tts.currentChunk = 0;
  updateTTSButton('stopped');
  resetTTSProgress();
  ttsProgress.classList.remove('active');
}

function finishTTS() {
  tts.isSpeaking = false;
  tts.isPaused = false;
  tts.isActive = false;
  tts.stopRequested = false;
  tts.utterance = null;
  updateTTSButton('stopped');
  if (ttsProgressFill) {
    ttsProgressFill.style.width = '100%';
    setTimeout(() => {
      if (!tts.isSpeaking) {
        ttsProgressFill.style.width = '0%';
        ttsProgress.classList.remove('active');
      }
    }, 1000);
  }
}

if (ttsBtn) {
  ttsBtn.addEventListener('click', () => {
    if (!TTS_SUPPORTED) return;
    if (tts.isSpeaking) pauseTTS();
    else if (tts.isPaused) resumeTTS();
    else startTTS();
  });
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && tts.isSpeaking) {
    try { tts.synth.pause(); } catch (e) {}
  }
});

window.addEventListener('beforeunload', () => {
  try { if (tts.synth) tts.synth.cancel(); } catch (e) {}
});

// ================================================================
// SUIVI DU TEMPS D'ÉTUDE — ✅ C11 : increment() atomique
// ================================================================
let studyStartTime = Date.now();
let studyTimeActive = true;
let studySaveInFlight = false;

document.addEventListener('visibilitychange', () => {

function pauseStudyTime() {
  if (!studyTimeActive) return;
  const duration = Math.floor((Date.now() - studyStartTime) / 1000);
  if (duration >= 5) {
    saveStudyTime(duration);
  }
  studyTimeActive = false;
}

function resumeStudyTime() {
  studyStartTime = Date.now();
  studyTimeActive = true;
}

window.addEventListener('beforeunload', () => {
  pauseStudyTime();
});

function saveStudyTimeBeforeChange() {
  const duration = Math.floor((Date.now() - studyStartTime) / 1000);
  if (duration >= 5) {
    saveStudyTime(duration);
  }
  studyStartTime = Date.now();
}

// ✅ C11 — updateDoc avec increment(seconds) : atomique, pas de read-then-write
async function saveStudyTime(seconds) {
  const user = auth.currentUser;
  if (!user) return;

  try {
    await updateDoc(doc(db, 'users', user.uid), {
      totalStudyTime: increment(seconds),
      lastStudyUpdate: serverTimestamp()
    });
  } catch (e) {
    // Silencieux : le temps d'étude n'est pas critique
    console.warn('[Lecture] saveStudyTime:', e.code || e.message);
  }
}

function resetStudyTimer() {
  studyStartTime = Date.now();
  studyTimeActive = true;
}

// ================================================================
// ✅ C3 — Retry doux si doc users/{uid} absent
// ================================================================
async function handleMissingUserDoc(uid) {
  if (missingDocInFlight) return;
  missingDocInFlight = true;
  try {
    await new Promise((r) => setTimeout(r, 900));
    if (!auth.currentUser || auth.currentUser.uid !== uid) return;
    const retry = await getDoc(doc(db, 'users', uid));
    if (retry.exists()) {
      const data = retry.data();
      try {
        localStorage.setItem(USER_DATA_KEY, JSON.stringify({
          ...data,
          _uid: uid,
          _cachedAt: Date.now()
        }));
      } catch (e) {}
      const newPremium = isUserPremium(data);
      setPremium(newPremium);
      return;
    }
    console.warn('[Lecture] Profil utilisateur introuvable pour', uid);
  } catch (e) {
    console.warn('[Lecture] handleMissingUserDoc:', e.code || e.message);
  } finally {
    missingDocInFlight = false;
  }
}

// ================================================================
// CHARGEMENT UTILISATEUR — ✅ C2 + C3 + C8
// ================================================================
function loadUserData(user) {
  if (unsubscribeUser) {
    unsubscribeUser();
    unsubscribeUser = null;
  }
  const userRef = doc(db, 'users', user.uid);
  unsubscribeUser = onSnapshot(userRef,
    (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();

        // ✅ C2 — blocked : signOut tolérant + auth-choice.html
        if (data.accountStatus === 'blocked') {
          if (unsubscribeUser) { unsubscribeUser(); unsubscribeUser = null; }
          stopTTS();
          clearSession();
          try { sessionStorage.setItem('arvexa_account_blocked', '1'); } catch (e) {}
          signOut(auth)
            .catch((err) => console.warn('[Lecture] signOut bloqué :', err.code || err.message))
            .finally(() => { window.location.replace('auth-choice.html'); });
          return;
        }

        // ✅ C2 — paused : ne pas déconnecter
        if (data.accountStatus === 'paused') {
          try {
            localStorage.setItem(USER_DATA_KEY, JSON.stringify({
              ...data,
              _uid: user.uid,
              _cachedAt: Date.now()
            }));
          } catch (e) {}
          return;
        }

        // Cas normal
        const newPremium = isUserPremium(data);
        setPremium(newPremium);

        try {
          localStorage.setItem(USER_DATA_KEY, JSON.stringify({
            ...data,
            _uid: user.uid,
            _cachedAt: Date.now()
          }));
        } catch (e) {}
      } else {
        const cached = getCachedUserData(user.uid);
        if (cached) {
          const newPremium = isUserPremium(cached);
          setPremium(newPremium);
        } else {
          // ✅ C3 — retry doux
          handleMissingUserDoc(user.uid);
        }
      }
    },
    (error) => {
      // ✅ C8 — warn au lieu du silence
      console.warn('[Lecture] onSnapshot users:', error.code || error.message);
      const cached = getCachedUserData(user.uid);
      if (cached) {
        const newPremium = isUserPremium(cached);
        setPremium(newPremium);
      }
    }
  );
}

// ================================================================
// AUTH ROBUSTE — ✅ C1/C7/C9
// ================================================================
let isRedirecting = false;
let isAuthResolved = false;
let graceTimer = null;
let maxTimer = null;

// ✅ C1 — préserver les clés existantes
function redirectToLogin() {
  if (isRedirecting) return;
  isRedirecting = true;

  if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
  if (authUnsubscribe) {
    try { authUnsubscribe(); } catch (e) {}
    authUnsubscribe = null;
  }

  try {
    const existing = sessionStorage.getItem('redirectAfterLogin')
                  || sessionStorage.getItem('redirectAfterAuth');
    if (!existing) {
      sessionStorage.setItem('redirectAfterLogin',
        window.location.pathname + window.location.search);
    }
  } catch (e) {}

  window.location.replace('login.html');
}

function initAuthGuard(onAuthenticated) {
  if (authUnsubscribe) return; // garde anti-double

  authUnsubscribe = onAuthStateChanged(auth, (user) => {
    if (isAuthResolved) {
      if (user && user.uid !== currentUid) {
        currentUid = user.uid;
        saveSession(user);
        onAuthenticated(user);
      } else if (!user && currentUid) {
        currentUid = null;
        clearSession();
        stopTTS();
        redirectToLogin();
      }
      return;
    }

    if (!user) {
      if (graceTimer) return;
      // ✅ C9 — aligné à 600 ms
      graceTimer = setTimeout(() => {
        graceTimer = null;
        if (isAuthResolved) return;
        if (auth.currentUser) return;

        const hasSession = localStorage.getItem(SESSION_KEY);
        const hasUserData = localStorage.getItem(USER_DATA_KEY);

        if ((hasSession || hasUserData) && !navigator.onLine) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        if (hasSession && hasUserData) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        redirectToLogin();
      }, 600);
      return;
    }

    if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
    if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

    isAuthResolved = true;
    currentUid = user.uid;
    saveSession(user);
    onAuthenticated(user);
  });

  maxTimer = setTimeout(() => {
    if (isAuthResolved) return;
    if (auth.currentUser) {
      isAuthResolved = true;
      currentUid = auth.currentUser.uid;
      saveSession(auth.currentUser);
      onAuthenticated(auth.currentUser);
    } else {
      redirectToLogin();
    }
  }, 5000);
}

// ================================================================
// LANCER LA PROTECTION
// ================================================================
initAuthGuard(async (user) => {
  const cached = getCachedUserData(user.uid);
  isPremium = cached ? isUserPremium(cached) : false;

  loadContent();
  loadUserData(user);
});

// ✅ C7 — cleanup global
window.addEventListener('beforeunload', () => {
  if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
  if (authUnsubscribe) { try { authUnsubscribe(); } catch (e) {} authUnsubscribe = null; }
  if (unsubscribeUser) { try { unsubscribeUser(); } catch (e) {} unsubscribeUser = null; }
});
