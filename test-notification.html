<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0A0A0A"
  >

  <title>Notifications | ARVEXA Admin</title>

  <link
    rel="icon"
    href="./icon.png"
    type="image/png"
  >

  <style>
    :root {
      --bg: #0A0A0A;
      --card: #111313;
      --card2: #151817;
      --border: rgba(255,255,255,.08);
      --text: #f5f5f5;
      --muted: #929292;
      --green: #1A3A2A;
      --gold: #E0B84A;
      --gold-dark: #B8860B;
      --success: #38c77b;
      --danger: #ef5350;
      --warning: #f0ad4e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      min-height: 100vh;
    }

    .container {
      width: min(100% - 28px, 900px);
      margin: 0 auto;
      padding: 24px 0 50px;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(224,184,74,.25);
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 800;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .admin-status {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(56,199,123,.08);
      border: 1px solid rgba(56,199,123,.2);
      color: var(--success);
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    /* CARD */

    .card {
      background: linear-gradient(
        145deg,
        var(--card),
        var(--card2)
      );

      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.18);
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    /* FORM */

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #cfcfcf;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0c0e0d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      transition: .2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(224,184,74,.65);
      box-shadow: 0 0 0 3px rgba(224,184,74,.08);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .counter {
      text-align: right;
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    /* BUTTONS */

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    button:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: linear-gradient(
        135deg,
        var(--gold-dark),
        var(--gold)
      );
      color: #080808;
    }

    .btn-secondary {
      background: var(--green);
      color: white;
      border: 1px solid rgba(255,255,255,.06);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    /* PREVIEW */

    .preview {
      background: #0b0d0c;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px;
    }

    .preview-notification {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .preview-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .preview-content {
      min-width: 0;
    }

    .preview-title {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .preview-message {
      font-size: 13px;
      color: #c1c1c1;
      line-height: 1.45;
      word-break: break-word;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: #0c0e0d;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      text-align: center;
    }

    .stat-value {
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
    }

    /* LOG */

    .log {
      background: #080909;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 300px;
      overflow: auto;
    }

    .message-box {
      display: none;
      padding: 13px 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.45;
    }

    .message-box.success {
      display: block;
      background: rgba(56,199,123,.08);
      border: 1px solid rgba(56,199,123,.2);
      color: var(--success);
    }

    .message-box.error {
      display: block;
      background: rgba(239,83,80,.08);
      border: 1px solid rgba(239,83,80,.2);
      color: #ff7774;
    }

    .message-box.info {
      display: block;
      background: rgba(224,184,74,.08);
      border: 1px solid rgba(224,184,74,.2);
      color: var(--gold);
    }

    /* RESPONSIVE */

    @media (max-width: 650px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-status {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header>

    <div class="brand">

      <img
        src="./icon.png"
        class="logo"
        alt="ARVEXA"
      >

      <div>
        <h1>ARVEXA School</h1>
        <p>Centre de notifications administrateur</p>
      </div>

    </div>

    <div class="admin-status">
      <span class="status-dot"></span>
      <span id="authStatus">
        Vérification...
      </span>
    </div>

  </header>


  <!-- MESSAGE GLOBAL -->
  <div
    id="messageBox"
    class="message-box"
  ></div>


  <!-- FORMULAIRE -->
  <section class="card">

    <div class="card-title">
      📢 Nouvelle notification
    </div>

    <div class="field">

      <label for="title">
        Titre
      </label>

      <input
        id="title"
        type="text"
        maxlength="100"
        placeholder="Ex : Nouveau cours disponible"
      >

    </div>


    <div class="field">

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        maxlength="300"
        placeholder="Écris le message qui sera envoyé aux utilisateurs..."
      ></textarea>

      <div
        class="counter"
        id="counter"
      >
        0 / 300
      </div>

    </div>


    <div class="field">

      <label for="type">
        Type
      </label>

      <select id="type">

        <option value="info">
          🔵 Information
        </option>

        <option value="success">
          🟢 Succès
        </option>

        <option value="warning">
          🟠 Avertissement
        </option>

        <option value="danger">
          🔴 Important
        </option>

      </select>

    </div>


    <div class="field">

      <label for="clickAction">
        Page à ouvrir après le clic
      </label>

      <input
        id="clickAction"
        type="text"
        value="./notifications.html"
        placeholder="./notifications.html"
      >

    </div>


    <div class="buttons">

      <button
        id="sendButton"
        class="btn-primary"
      >
        📢 Envoyer à tout le monde
      </button>

      <button
        id="testButton"
        class="btn-secondary"
      >
        🧪 Tester sur cet ordinateur
      </button>

    </div>

  </section>


  <!-- APERÇU -->
  <section class="card">

    <div class="card-title">
      👀 Aperçu
    </div>

    <div class="preview">

      <div class="preview-notification">

        <img
          src="./icon.png"
          class="preview-icon"
          alt=""
        >

        <div class="preview-content">

          <div
            id="previewTitle"
            class="preview-title"
          >
            Nouveau message
          </div>

          <div
            id="previewMessage"
            class="preview-message"
          >
            Le message apparaîtra ici.
          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- STATISTIQUES -->
  <section class="card">

    <div class="card-title">
      📊 Résultat du dernier envoi
    </div>

    <div class="stats">

      <div class="stat">

        <div
          id="targeted"
          class="stat-value"
        >
          0
        </div>

        <div class="stat-label">
          Utilisateurs ciblés
        </div>

      </div>


      <div class="stat">

        <div
          id="sent"
          class="stat-value"
        >
          0
        </div>

        <div class="stat-label">
          Envoyées
        </div>

      </div>


      <div class="stat">

        <div
          id="failed"
          class="stat-value"
        >
          0
        </div>

        <div class="stat-label">
          Échecs
        </div>

      </div>

    </div>

  </section>


  <!-- LOG -->
  <section class="card">

    <div class="card-title">
      🛠 Journal
    </div>

    <div
      id="log"
      class="log"
    >ARVEXA Admin — prêt.</div>

  </section>

</div>


<!-- =====================================================
     FIREBASE AUTH
===================================================== -->

<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",

    authDomain:
      "arvexa-fbf10.firebaseapp.com",

    projectId:
      "arvexa-fbf10",

    storageBucket:
      "arvexa-fbf10.firebasestorage.app",

    messagingSenderId:
      "920108330053",

    appId:
      "1:920108330053:web:f532d71cbc2c824bc7472c"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);


  /*
   * Rend Firebase Auth accessible
   * au reste du fichier.
   */

  window.arvexaAuth = auth;


  /*
   * Permet d'attendre que Firebase
   * ait terminé de vérifier la session.
   */

  let currentAdminUser = null;

  let authReadyResolve;

  const authReady =
    new Promise((resolve) => {

      authReadyResolve = resolve;

    });


  onAuthStateChanged(
    auth,
    (user) => {

      currentAdminUser = user;

      authReadyResolve(user);


      const status =
        document.getElementById(
          "authStatus"
        );


      if (user) {

        status.textContent =
          "Admin connecté";

        addLog(
          "✅ Administrateur connecté : " +
          user.email
        );

      } else {

        status.textContent =
          "Non connecté";

        addLog(
          "❌ Aucun utilisateur Firebase connecté."
        );

      }

    }
  );


  /*
   * Rend la session disponible
   * au script principal.
   */

  window.arvexaAuthReady =
    authReady;

  window.getArvexaAdminUser =
    () => currentAdminUser;

</script>


<!-- =====================================================
     SCRIPT PRINCIPAL
===================================================== -->

<script>

  /*
   * IMPORTANT :
   * Mets ici ton URL /exec Google Apps Script.
   *
   * Exemple :
   *
   * const APPS_SCRIPT_URL =
   *   "https://script.google.com/macros/s/XXXXXXXX/exec";
   */

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxnUzrIW1NdUbj37MiJ53fZEK7zBS15mFPzMDrHzaUaffcKw_t6iuFLBUvvIw8FfGbK/exec";


  /* =========================
     ELEMENTS
  ========================= */

  const titleInput =
    document.getElementById(
      "title"
    );

  const messageInput =
    document.getElementById(
      "message"
    );

  const typeInput =
    document.getElementById(
      "type"
    );

  const clickActionInput =
    document.getElementById(
      "clickAction"
    );

  const sendButton =
    document.getElementById(
      "sendButton"
    );

  const testButton =
    document.getElementById(
      "testButton"
    );

  const counter =
    document.getElementById(
      "counter"
    );

  const previewTitle =
    document.getElementById(
      "previewTitle"
    );

  const previewMessage =
    document.getElementById(
      "previewMessage"
    );

  const messageBox =
    document.getElementById(
      "messageBox"
    );

  const logElement =
    document.getElementById(
      "log"
    );


  /* =========================
     LOG
  ========================= */

  function addLog(text) {

    const now =
      new Date().toLocaleTimeString(
        "fr-FR"
      );

    logElement.textContent +=
      "\n[" +
      now +
      "] " +
      text;

    logElement.scrollTop =
      logElement.scrollHeight;

  }


  /* =========================
     MESSAGE UI
  ========================= */

  function showMessage(
    text,
    type = "info"
  ) {

    messageBox.className =
      "message-box " + type;

    messageBox.textContent =
      text;

  }


  function hideMessage() {

    messageBox.className =
      "message-box";

    messageBox.textContent =
      "";

  }


  /* =========================
     APERCU
  ========================= */

  function updatePreview() {

    const title =
      titleInput.value.trim();

    const message =
      messageInput.value.trim();


    previewTitle.textContent =
      title ||
      "Nouveau message";


    previewMessage.textContent =
      message ||
      "Le message apparaîtra ici.";


    counter.textContent =
      messageInput.value.length +
      " / 300";

  }


  titleInput.addEventListener(
    "input",
    updatePreview
  );

  messageInput.addEventListener(
    "input",
    updatePreview
  );


  /* =========================
     VALIDATION
  ========================= */

  function validateForm() {

    const title =
      titleInput.value.trim();

    const message =
      messageInput.value.trim();

    const clickAction =
      clickActionInput.value.trim();


    if (!title) {

      showMessage(
        "❌ Le titre est obligatoire.",
        "error"
      );

      titleInput.focus();

      return null;

    }


    if (!message) {

      showMessage(
        "❌ Le message est obligatoire.",
        "error"
      );

      messageInput.focus();

      return null;

    }


    if (message.length > 300) {

      showMessage(
        "❌ Le message ne doit pas dépasser 300 caractères.",
        "error"
      );

      return null;

    }


    return {

      title,
      message,

      type:
        typeInput.value,

      clickAction:
        clickAction ||
        "./notifications.html"

    };

  }


  /* =========================
     TEST LOCAL
  ========================= */

  testButton.addEventListener(
    "click",
    async () => {

      hideMessage();

      try {

        if (
          !("Notification" in window)
        ) {

          throw new Error(
            "Les notifications ne sont pas supportées par ce navigateur."
          );

        }


        /*
         * Demande l'autorisation.
         */

        const permission =
          await Notification.requestPermission();


        if (
          permission !== "granted"
        ) {

          throw new Error(
            "Permission de notification refusée."
          );

        }


        const data =
          validateForm();


        if (!data) return;


        /*
         * Récupération du Service Worker.
         */

        const registration =
          await navigator.serviceWorker.ready;


        const notificationOptions = {

          body:
            data.message,

          icon:
            "./icon.png",

          badge:
            "./icon.png",

          tag:
            "arvexa-test-" +
            Date.now(),

          data: {

            clickAction:
              data.clickAction,

            type:
              data.type

          }

        };


        await registration.showNotification(
          data.title,
          notificationOptions
        );


        showMessage(
          "✅ Notification de test envoyée sur cet appareil.",
          "success"
        );


        addLog(
          "🧪 Notification locale envoyée."
        );

      }

      catch (error) {

        console.error(error);

        showMessage(
          "❌ " +
          error.message,
          "error"
        );

        addLog(
          "❌ Test local : " +
          error.message
        );

      }

    }
  );


  /* =========================
     ENVOI GLOBAL
  ========================= */

  sendButton.addEventListener(
    "click",
    async () => {

      hideMessage();


      const data =
        validateForm();


      if (!data) return;


      /*
       * Protection contre double clic.
       */

      sendButton.disabled =
        true;

      sendButton.textContent =
        "⏳ Envoi en cours...";


      try {

        addLog(
          "🔐 Vérification de la session administrateur..."
        );


        /*
         * Attend Firebase Auth.
         */

        const user =
          await window.arvexaAuthReady;


        if (!user) {

          throw new Error(
            "Aucun administrateur connecté à Firebase."
          );

        }


        /*
         * Vérification supplémentaire côté client.
         * La vraie sécurité est effectuée côté Apps Script.
         */

        const email =
          (
            user.email ||
            ""
          ).toLowerCase();


        if (
          email !==
          "gagneavecia@gmail.com"
        ) {

          throw new Error(
            "Ce compte n'est pas autorisé à envoyer des notifications."
          );

        }


        addLog(
          "✅ Administrateur reconnu : " +
          user.email
        );


        /*
         * Récupération du Firebase ID Token.
         *
         * Le token sera vérifié par Apps Script.
         */

        const idToken =
          await user.getIdToken(
            true
          );


        if (!idToken) {

          throw new Error(
            "Impossible de récupérer le token Firebase."
          );

        }


        addLog(
          "🔑 Token Firebase obtenu."
        );


        /*
         * Vérification de l'URL.
         */

        if (
          !APPS_SCRIPT_URL ||
          APPS_SCRIPT_URL ===
            "TON_URL_APPS_SCRIPT"
        ) {

          throw new Error(
            "Tu dois renseigner l'URL de ton Apps Script dans APPS_SCRIPT_URL."
          );

        }


        addLog(
          "📡 Connexion au serveur Apps Script..."
        );


        /*
         * IMPORTANT :
         *
         * text/plain évite le preflight CORS
         * qu'un Content-Type application/json
         * pourrait provoquer avec Apps Script.
         *
         * Le serveur récupère quand même
         * e.postData.contents comme JSON.
         */

        const response =
          await fetch(
            APPS_SCRIPT_URL,
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  idToken:
                    idToken,

                  title:
                    data.title,

                  message:
                    data.message,

                  type:
                    data.type,

                  clickAction:
                    data.clickAction

                })

            }
          );


        /*
         * Récupération de la réponse.
         */

        const raw =
          await response.text();


        addLog(
          "📥 Réponse serveur reçue."
        );


        let result;


        try {

          result =
            JSON.parse(raw);

        }

        catch {

          console.error(
            "Réponse brute :",
            raw
          );

          throw new Error(
            "Réponse serveur invalide."
          );

        }


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Le serveur a refusé l'envoi."
          );

        }


        /*
         * Statistiques.
         */

        document.getElementById(
          "targeted"
        ).textContent =
          result.total ??
          0;


        document.getElementById(
          "sent"
        ).textContent =
          result.sent ??
          0;


        document.getElementById(
          "failed"
        ).textContent =
          result.failed ??
          0;


        /*
         * Message de succès.
         */

        showMessage(
          "✅ Notification envoyée à " +
          (result.sent ?? 0) +
          " utilisateur(s).",
          "success"
        );


        addLog(
          "✅ ENVOI TERMINÉ."
        );

        addLog(
          "👥 Ciblés : " +
          (result.total ?? 0)
        );

        addLog(
          "📲 Envoyées : " +
          (result.sent ?? 0)
        );

        addLog(
          "❌ Échecs : " +
          (result.failed ?? 0)
        );


        /*
         * Nettoyage du formulaire.
         */

        titleInput.value =
          "";

        messageInput.value =
          "";

        updatePreview();

      }

      catch (error) {

        console.error(
          "Erreur envoi :",
          error
        );


        showMessage(
          "❌ " +
          error.message,
          "error"
        );


        addLog(
          "❌ ERREUR : " +
          error.message
        );

      }

      finally {

        sendButton.disabled =
          false;

        sendButton.textContent =
          "📢 Envoyer à tout le monde";

      }

    }
  );


  /* =========================
     INITIALISATION
  ========================= */

  updatePreview();


  /*
   * Vérifie que le Service Worker
   * est disponible.
   */

  if (
    "serviceWorker" in navigator
  ) {

    navigator.serviceWorker.ready
      .then(() => {

        addLog(
          "✅ Service Worker disponible."
        );

      })
      .catch((error) => {

        addLog(
          "⚠️ Service Worker indisponible : " +
          error.message
        );

      });

  } else {

    addLog(
      "⚠️ Service Worker non supporté."
    );

  }

</script>

</body>
</html>
