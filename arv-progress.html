<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>ARVEXA — Mon cahier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="katex-utils.js" defer></script>

<style>
:root {
  --accent: #B8860B;
  --accent-bright: #E0B84A;
  --success: #3AB67E;
  --success-soft: rgba(58, 182, 126, 0.12);
  --danger: #B85C3A;
  --danger-soft: rgba(184, 92, 58, 0.12);
  --info: #4AAFE0;
  --info-soft: rgba(74, 175, 224, 0.1);
  --purple: #9B59B6;
  --purple-soft: rgba(155, 89, 182, 0.12);
  --bg-dark: #0A0A0A;
  --bg-surface: #141414;
  --bg-card: rgba(20, 20, 20, 0.7);
  --bg-block: rgba(0, 0, 0, 0.28);
  --bg-input: rgba(0, 0, 0, 0.35);
  --text-light: #F5F0E8;
  --text-body: #cfd0cc;
  --text-dim: #8A8A7A;
  --text-muted: #5A5A4A;
  --border-soft: rgba(255, 255, 255, 0.05);
  --border-strong: rgba(255, 255, 255, 0.09);
  --border-gold: rgba(224, 184, 74, 0.22);
  --radius-sm: 10px;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
  --font-body: 'Inter', system-ui, sans-serif;
  --font-serif: 'Playfair Display', Georgia, serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html {
  background: var(--bg-dark);
  color-scheme: dark;
  min-width: 320px;
  width: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.14) 0%, transparent 70%),
    radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
    linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
  color: var(--text-light);
  font: 15px/1.6 var(--font-body);
  padding-top: var(--safe-top);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
button:disabled { cursor: not-allowed; opacity: 0.5; }

/* HEADER */
.header {
  position: sticky; top: 0; flex-shrink: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: rgba(10, 10, 10, 0.94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
  min-height: 60px;
}
.header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border-soft); background: transparent;
  color: var(--text-dim); transition: var(--transition); font-size: 14px; flex-shrink: 0;
}
.back-btn:hover { border-color: var(--border-gold); color: var(--accent-bright); }
.back-btn.hidden { display: none; }

.page-title {
  display: flex; align-items: center; gap: 9px;
  font-size: 15px; font-weight: 700; font-family: var(--font-serif);
  color: var(--text-light); letter-spacing: -0.01em;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.page-title i { color: var(--accent-bright); font-size: 14px; }
.page-title .emoji { font-size: 16px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border-soft); background: transparent;
  color: var(--text-dim); transition: var(--transition); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { border-color: var(--border-gold); color: var(--accent-bright); }

main {
  flex: 1 1 auto; width: 100%; max-width: 820px;
  margin: 0 auto; padding: 20px 16px 60px; position: relative;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.35s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* VUE 1 — MES CAHIERS */
.greeting { margin-bottom: 20px; }
.greeting h1 {
  font-family: var(--font-serif);
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 700; color: var(--text-light);
  line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 6px;
}
.greeting h1 em { color: var(--accent-bright); font-style: italic; }
.greeting p { color: var(--text-dim); font-size: 14px; }

.streak-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px; border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.08), rgba(26, 58, 42, 0.05));
  border: 1px solid var(--border-gold); margin-bottom: 26px;
  position: relative; overflow: hidden;
}
.streak-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
}
.streak-icon { font-size: 32px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(224, 184, 74, 0.3)); }
.streak-content { flex: 1; min-width: 0; }
.streak-value {
  font-family: var(--font-serif); font-size: 22px;
  font-weight: 700; color: var(--accent-bright); line-height: 1.1;
}
.streak-label { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

.section-title {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-serif); font-size: 17px; font-weight: 700;
  color: var(--text-light); margin: 24px 0 14px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border-soft);
  position: relative;
}
.section-title::after {
  content: ''; position: absolute; bottom: -1px; left: 0;
  width: 40px; height: 2px; background: var(--accent-bright);
}
.section-title i { color: var(--accent-bright); font-size: 14px; }
.section-title .count {
  margin-left: auto; font-family: var(--font-body);
  font-size: 11px; color: var(--text-muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
}

.subjects-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
}
@media (min-width: 620px) { .subjects-grid { grid-template-columns: repeat(3, 1fr); } }

.subject-card {
  padding: 18px 16px; border-radius: var(--radius);
  background: var(--bg-card); border: 1px solid var(--border-soft);
  cursor: pointer; transition: var(--transition);
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  position: relative; overflow: hidden;
}
.subject-card:hover { border-color: var(--border-gold); transform: translateY(-3px); box-shadow: var(--shadow); }
.subject-card .subject-emoji { font-size: 28px; line-height: 1; }
.subject-card .subject-name { font-size: 14.5px; font-weight: 700; color: var(--text-light); letter-spacing: -0.01em; }
.subject-card .subject-meta { font-size: 11.5px; color: var(--text-muted); }
.subject-bar { height: 4px; background: rgba(255, 255, 255, 0.05); border-radius: 4px; overflow: hidden; margin-top: 2px; }
.subject-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; width: 0%; }

.activity-list { display: flex; flex-direction: column; gap: 10px; }
.activity-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: var(--radius);
  background: var(--bg-card); border: 1px solid var(--border-soft);
  cursor: pointer; transition: var(--transition); text-align: left;
}
.activity-item:hover { border-color: var(--border-gold); transform: translateX(3px); }
.activity-emoji {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; background: rgba(224, 184, 74, 0.1); flex-shrink: 0;
}
.activity-body { flex: 1; min-width: 0; }
.activity-title {
  font-size: 14px; font-weight: 700; color: var(--text-light); margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.activity-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.activity-arrow { color: var(--text-muted); font-size: 14px; flex-shrink: 0; transition: var(--transition); }
.activity-item:hover .activity-arrow { color: var(--accent-bright); transform: translateX(3px); }

/* VUE 2 & 3 — LISTES */
.page-hero {
  padding: 20px 22px; border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.06), rgba(26, 58, 42, 0.04));
  border: 1px solid var(--border-soft); margin-bottom: 22px;
}
.page-hero h1 {
  font-family: var(--font-serif); font-size: clamp(22px, 4.5vw, 28px);
  font-weight: 700; color: var(--text-light); line-height: 1.15;
  margin-bottom: 6px; letter-spacing: -0.02em;
}
.page-hero .hero-sub { color: var(--text-dim); font-size: 13.5px; margin-bottom: 12px; }
.page-hero .hero-progress { display: flex; align-items: center; gap: 12px; }
.page-hero .hero-progress-bar {
  flex: 1; height: 5px; background: rgba(255, 255, 255, 0.06);
  border-radius: 5px; overflow: hidden;
}
.page-hero .hero-progress-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  transition: width 1s ease; width: 0%;
}
.page-hero .hero-progress-value {
  font-family: var(--font-serif); font-size: 16px;
  font-weight: 700; color: var(--accent-bright); flex-shrink: 0;
}

.cta-card {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 16px 20px; border-radius: var(--radius);
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A; font-weight: 800; font-size: 14.5px;
  transition: var(--transition);
  box-shadow: 0 6px 20px rgba(184, 134, 11, 0.2);
  margin-bottom: 22px; font-family: inherit; border: none;
}
.cta-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(184, 134, 11, 0.35); }
.cta-card i { font-size: 14px; }
.cta-card.secondary {
  background: transparent; border: 1px solid var(--border-gold);
  color: var(--accent-bright); box-shadow: none;
}

.list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; border-radius: var(--radius);
  background: var(--bg-card); border: 1px solid var(--border-soft);
  cursor: pointer; transition: var(--transition);
  position: relative; text-align: left; width: 100%;
}
.list-item:hover { border-color: var(--border-gold); transform: translateX(3px); }

.list-item-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
  background: rgba(224, 184, 74, 0.1);
  border: 1px solid rgba(224, 184, 74, 0.15);
}
.list-item-body { flex: 1; min-width: 0; }
.list-item-title {
  font-size: 14.5px; font-weight: 700; color: var(--text-light);
  margin-bottom: 4px; line-height: 1.3;
}
.list-item-meta {
  font-size: 12px; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.list-item-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
.list-item-arrow {
  color: var(--text-muted); font-size: 14px;
  flex-shrink: 0; transition: var(--transition);
}
.list-item:hover .list-item-arrow { color: var(--accent-bright); transform: translateX(3px); }

.list-item.new {
  background: transparent;
  border: 1px dashed rgba(224, 184, 74, 0.3);
  justify-content: center; color: var(--accent-bright);
  font-weight: 700; font-size: 14px;
}
.list-item.new:hover { background: rgba(224, 184, 74, 0.05); border-style: solid; }
.list-item.new .list-item-icon {
  background: transparent; border: none;
  width: 32px; height: 32px; font-size: 18px;
}

/* VUE 4 — SECTION */
.section-hero { margin-bottom: 22px; }
.section-hero .breadcrumb {
  font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.section-hero .breadcrumb .sep { opacity: 0.5; }
.section-hero h1 {
  font-family: var(--font-serif); font-size: clamp(20px, 4vw, 26px);
  font-weight: 700; color: var(--text-light); line-height: 1.2;
  letter-spacing: -0.02em; margin-bottom: 6px;
}
.section-hero .sub { font-size: 12.5px; color: var(--text-muted); }

.content-section { margin-bottom: 26px; }
.content-section-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--text-dim);
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border-soft);
}
.content-section-title i { color: var(--accent-bright); font-size: 12px; }
.content-section-title .count {
  margin-left: auto; color: var(--text-muted); font-weight: 600;
}

.raw-input {
  padding: 16px 18px; border-radius: var(--radius);
  background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-soft);
  font-size: 13.5px; color: var(--text-body); line-height: 1.65;
  white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;
  max-height: 200px; overflow: hidden; position: relative;
}
.raw-input.expanded { max-height: none; }
.raw-input::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 40px; background: linear-gradient(180deg, transparent, rgba(10, 10, 10, 0.9));
  pointer-events: none;
}
.raw-input.expanded::after { display: none; }

.expand-btn {
  margin-top: 8px; padding: 8px 16px; border-radius: 20px;
  background: transparent; border: 1px solid var(--border-soft);
  color: var(--accent-bright); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: var(--transition);
  display: inline-flex; align-items: center; gap: 6px;
}
.expand-btn:hover { border-color: var(--border-gold); background: rgba(224, 184, 74, 0.05); }

.block {
  padding: 16px 18px; border-radius: var(--radius);
  background: var(--bg-card); border: 1px solid var(--border-soft);
  border-left: 3px solid var(--accent-bright);
  margin-bottom: 12px; position: relative;
}
.block.blue { border-left-color: var(--info); }
.block.green { border-left-color: var(--success); }
.block.red { border-left-color: var(--danger); }
.block.purple { border-left-color: var(--purple); }

.block-head {
  display: flex; align-items: center; gap: 10px;
  font-size: 12.5px; font-weight: 700; color: var(--accent-bright);
  margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;
}
.block.blue .block-head { color: var(--info); }
.block.green .block-head { color: var(--success); }
.block.red .block-head { color: var(--danger); }
.block.purple .block-head { color: var(--purple); }
.block-head i { font-size: 13px; }

.block-body { font-size: 14.5px; color: var(--text-body); line-height: 1.7; }
.block-body p + p { margin-top: 8px; }

.key-ideas-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.key-ideas-list li { display: flex; gap: 12px; font-size: 14.5px; color: var(--text-body); line-height: 1.6; }
.key-ideas-list li .num {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(74, 175, 224, 0.15); color: var(--info);
  font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}

.formula-block {
  padding: 18px 16px; text-align: center;
  background: rgba(0, 0, 0, 0.25); border-radius: var(--radius-sm);
  margin-bottom: 10px; overflow-x: auto;
}
.formula-block:last-child { margin-bottom: 0; }
.formula-condition {
  font-size: 11.5px; color: var(--text-muted);
  margin-top: 8px; font-style: italic;
}

.method-list { list-style: none; padding: 0; counter-reset: mstep; }
.method-list li {
  position: relative; padding-left: 32px; counter-increment: mstep;
  font-size: 14px; color: var(--text-body); line-height: 1.65; margin-bottom: 10px;
}
.method-list li:last-child { margin-bottom: 0; }
.method-list li::before {
  content: counter(mstep); position: absolute; left: 0; top: 1px;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(155, 89, 182, 0.15); color: var(--purple);
  font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}

.example-enonce {
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: rgba(0, 0, 0, 0.28); font-size: 14px;
  color: var(--text-light); line-height: 1.6; margin-bottom: 12px;
}
.example-steps { list-style: none; padding: 0; counter-reset: estep; }
.example-steps li {
  position: relative; padding-left: 28px; counter-increment: estep;
  font-size: 14px; color: var(--text-body); line-height: 1.65; margin-bottom: 8px;
}
.example-steps li::before {
  content: counter(estep) '.'; position: absolute; left: 0; top: 0;
  color: var(--success); font-weight: 700;
}
.example-result {
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: rgba(58, 182, 126, 0.1); border-left: 3px solid var(--success);
  font-size: 14px; color: #7ce0aa; font-weight: 600; margin-top: 8px;
}

.trap-text { font-size: 14px; color: var(--text-light); line-height: 1.65; margin-bottom: 8px; }
.trap-solution {
  padding-left: 18px; position: relative;
  font-size: 13.5px; color: #7ce0aa; line-height: 1.6;
}
.trap-solution::before { content: '→'; position: absolute; left: 0; top: 0; font-weight: 700; }

/* QUESTIONS */
.qa-list { display: flex; flex-direction: column; gap: 10px; }
.qa-item {
  border-radius: var(--radius); background: var(--bg-card);
  border: 1px solid var(--border-soft); overflow: hidden; transition: var(--transition);
}
.qa-item.open { border-color: var(--border-gold); }
.qa-question {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; cursor: pointer; user-select: none;
}
.qa-question:hover { background: rgba(255, 255, 255, 0.015); }
.qa-q-icon {
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--info-soft); color: var(--info);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; flex-shrink: 0;
}
.qa-q-text { flex: 1; font-size: 14px; font-weight: 600; color: var(--text-light); line-height: 1.5; }
.qa-toggle {
  color: var(--text-muted); font-size: 12px;
  transition: transform 0.3s ease; flex-shrink: 0; margin-top: 4px;
}
.qa-item.open .qa-toggle { transform: rotate(180deg); color: var(--accent-bright); }
.qa-answer {
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.qa-item.open .qa-answer { max-height: 3000px; }
.qa-answer-inner {
  padding: 14px 16px 16px; border-top: 1px solid var(--border-soft);
  background: rgba(0, 0, 0, 0.15);
}
.qa-answer-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--success); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.qa-answer-text { font-size: 14px; color: var(--text-body); line-height: 1.7; }
.qa-source {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed var(--border-soft);
  font-size: 11.5px; color: var(--text-muted);
  font-style: italic; line-height: 1.55;
}
.qa-source strong { color: var(--text-dim); font-style: normal; font-weight: 700; }

/* NOTES */
.notes-area {
  width: 100%; min-height: 120px;
  padding: 14px 16px; border-radius: var(--radius);
  background: var(--bg-input); border: 1px solid var(--border-soft);
  color: var(--text-light); font-family: inherit;
  font-size: 14px; line-height: 1.65; resize: vertical; outline: none;
  transition: var(--transition);
}

<script type="importmap">

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged, getIdToken } from "firebase/auth";
import { getFirestore, doc, getDoc } from "firebase/firestore";

// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",

const MIN_CONTENT_LENGTH = 80;
const MAX_CONTENT_LENGTH = 15000;

const SUBJECTS = {
  mathematiques: { label: 'Mathématiques',    emoji: '📐', color: '#E0B84A', profile: 'scientific' },
  physique:      { label: 'Physique',         emoji: '⚡', color: '#4AAFE0', profile: 'scientific' },
  chimie:        { label: 'Chimie',           emoji: '🧪', color: '#E07A4A', profile: 'scientific' },
  svt:           { label: 'SVT',              emoji: '🧬', color: '#7AE04A', profile: 'scientific' },
  philosophie:   { label: 'Philosophie',      emoji: '🧠', color: '#9B59B6', profile: 'literary'   },
  'histoire-geo':{ label: 'Histoire-Géo',     emoji: '🌍', color: '#C68642', profile: 'literary'   },
  francais:      { label: 'Français',         emoji: '📖', color: '#E04A85', profile: 'literary'   },
  anglais:       { label: 'Anglais',          emoji: '🌐', color: '#4AE0A8', profile: 'literary'   }
};

const ALL_SUBJECT_KEYS = Object.keys(SUBJECTS);

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const state = {
  user: null,
  userData: null,
  isPremium: false,

  params: {},
  router: { history: [] },
  cache: {
    dashboard: null,
    chapters: {},
    chapter: {}
  }
};

// ═══════════════════════════════════════════════════════════════
// UTILITAIRES
// ═══════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

function safeText(text) {
  return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let katexAttempts = 0;
function renderKaTeX(root) {
  if (!root) return;
  if (window.KaTeXUtils?.renderMath) { window.KaTeXUtils.renderMath(root); return; }
  if (typeof renderMathInElement !== 'function') {
    if (katexAttempts++ < 20) setTimeout(() => renderKaTeX(root), 200);
    return;
  }
  katexAttempts = 0;
  try {
    renderMathInElement(root, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false, errorColor: '#ff9a84', strict: false, trust: true
    });
  } catch (_) {}
}

function showToast(message, type = 'info', duration = 3000) {
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(message)}</span>`;
  $('toastContainer').appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

function showLoadingState(el, text = 'Chargement...') {
  el.innerHTML = `
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p>${escapeHtml(text)}</p>
    </div>
  `;
}

function showEmptyState(el, icon, title, message, actionHtml = '') {
  el.innerHTML = `
    <div class="empty-state">
      <div class="icon"><i class="fas ${icon}"></i></div>
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(message)}</p>
      ${actionHtml}
    </div>
  `;
}

function getGreeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'Bonjour';
  if (h >= 12 && h < 18) return 'Bon après-midi';
  return 'Bonsoir';
}

function getFirstName() {
  return state.userData?.firstName || state.userData?.displayName?.split(' ')[0] || 'Élève';
}

// ═══════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════
async function callApi(action, params = {}) {
  if (!state.user) throw new Error('Non authentifié.');
  const token = await getIdToken(state.user);
  const response = await fetch('/api/progress', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ action, ...params })
  });
  const data = await response.json().catch(() => null);
  if (!response.ok || !data?.success) {
    const err = new Error(data?.error || `Erreur ${response.status}`);
    err.code = data?.code;
    err.status = response.status;
    throw err;
  }
  return data;
}

// ═══════════════════════════════════════════════════════════════
// ROUTER (hash-based + history API)
// ═══════════════════════════════════════════════════════════════
function routeFromHash() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  if (!hash) return { view: 'notebooks', params: {} };

  const parts = hash.split('/').filter(Boolean);
  const view = parts[0];

  switch (view) {
    case 'notebooks':
      return { view: 'notebooks', params: {} };
    case 'notebook':
      return { view: 'notebook', params: { subject: parts[1] } };
    case 'chapter':
      return { view: 'chapter', params: { subject: parts[1], chapterId: parts[2] } };
    case 'section':
      return { view: 'section', params: { subject: parts[1], chapterId: parts[2], sectionId: parts[3] } };
    case 'lesson':
      return { view: 'lesson', params: { subject: parts[1], chapterId: parts[2] } };
    default:
      return { view: 'notebooks', params: {} };
  }
}

function hashFromRoute(view, params) {
  switch (view) {
    case 'notebooks': return '#/notebooks';
    case 'notebook': return `#/notebook/${params.subject}`;
    case 'chapter': return `#/chapter/${params.subject}/${params.chapterId}`;
    case 'section': return `#/section/${params.subject}/${params.chapterId}/${params.sectionId}`;
    case 'lesson': return `#/lesson/${params.subject}/${params.chapterId}`;
    default: return '#/notebooks';
  }
}

function navigate(view, params = {}, replace = false) {
  const hash = hashFromRoute(view, params);
  if (replace) {
    window.history.replaceState(null, '', hash);
  } else {
    window.history.pushState(null, '', hash);
  }
  applyRoute({ view, params });
}

function goBack() {
  window.history.back();
}

function applyRoute(route) {
  state.view = route.view;
  state.params = route.params || {};

  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  const target = $(`view-${route.view}`);
  if (target) target.classList.add('active');

  updateHeader();
  updateBackButton();

  switch (route.view) {
    case 'notebooks': renderNotebooksView(); break;
    case 'notebook': renderNotebookView(route.params); break;
    case 'chapter': renderChapterView(route.params); break;
    case 'section': renderSectionView(route.params); break;
    case 'lesson': renderLessonView(route.params); break;
  }

  window.scrollTo({ top: 0, behavior: 'instant' });
}

function updateHeader() {
  const map = {
    notebooks: { emoji: '📓', text: 'Mon cahier' },
    notebook: { emoji: SUBJECTS[state.params.subject]?.emoji || '📖', text: SUBJECTS[state.params.subject]?.label || 'Cahier' },
    chapter: { emoji: '📖', text: 'Chapitre' },
    section: { emoji: '📝', text: 'Section' },
    lesson: { emoji: '📄', text: 'Leçon complète' }
  };
  const info = map[state.view] || map.notebooks;
  $('pageTitle').innerHTML = `<span class="emoji">${info.emoji}</span><span id="pageTitleText">${escapeHtml(info.text)}</span>`;
}

function updateBackButton() {
  $('backBtn').classList.toggle('hidden', state.view === 'notebooks');
}

window.addEventListener('hashchange', () => {
  applyRoute(routeFromHash());
});

// ═══════════════════════════════════════════════════════════════
// VUE 1 — MES CAHIERS
// ═══════════════════════════════════════════════════════════════
async function renderNotebooksView() {
  const el = $('view-notebooks');
  showLoadingState(el, 'Chargement de ton cahier...');

  try {
    const data = await callApi('getDashboard');
    state.cache.dashboard = data;

    const m = data;
    const totalSections = m.summary.totalSections || 0;
    const totalChapters = m.summary.totalChapters || 0;
    const streak = m.streak || { current: 0, best: 0 };

    // Construire la grille de toutes les matières (8)
    const subjectCards = ALL_SUBJECT_KEYS.map((key) => {
      const info = SUBJECTS[key];
      const active = (m.subjects || []).find((s) => s.key === key);
      const sectionsCount = active ? active.sectionsCount : 0;
      const last = active ? active.last : '';
      const percent = sectionsCount > 0 ? Math.min(100, sectionsCount * 10) : 0;

      return `
        <button class="subject-card" data-subject="${key}">
          <div class="subject-emoji">${info.emoji}</div>
          <div class="subject-name">${escapeHtml(info.label)}</div>
          <div class="subject-meta">
            ${sectionsCount > 0
              ? `${sectionsCount} section${sectionsCount > 1 ? 's' : ''}${last ? ' · ' + last : ''}`
              : 'Aucune section'}
          </div>
          <div class="subject-bar">
            <div class="subject-bar-fill" style="width:${percent}%; background: linear-gradient(90deg, ${info.color}, ${info.color}dd);"></div>
          </div>
        </button>
      `;
    }).join('');

    // Activité récente
    const activityHtml = (m.recentActivity || []).length > 0
      ? `
        <div class="section-title">
          <i class="fas fa-clock"></i> Activité récente
        </div>
        <div class="activity-list">
          ${m.recentActivity.map((a) => {
            const info = SUBJECTS[a.subject] || { emoji: '📖', label: 'Matière' };
            return `
              <button class="activity-item" data-subject="${a.subject}" data-chapter="${escapeHtml(a.chapterId)}">
                <div class="activity-emoji">${info.emoji}</div>
                <div class="activity-body">
                  <div class="activity-title">${escapeHtml(a.chapterTitle)}</div>
                  <div class="activity-meta">
                    <span>${escapeHtml(info.label)}</span>
                    <span>·</span>
                    <span>${escapeHtml(a.time)}</span>
                  </div>
                  <div class="activity-meta" style="margin-top:4px; color:var(--accent-bright);">
                    → ${a.sectionsCount} section${a.sectionsCount > 1 ? 's' : ''}
                  </div>
                </div>
                <div class="activity-arrow"><i class="fas fa-chevron-right"></i></div>
              </button>
            `;
          }).join('')}
        </div>
      `
      : '';

    el.innerHTML = `
      <div class="greeting">
        <h1>${getGreeting()}, <em>${escapeHtml(getFirstName())}</em> 👋</h1>
        <p>${totalSections > 0 ? 'Continue là où tu t\'es arrêté.' : 'Commence ton premier cahier.'}</p>
      </div>

      <div class="streak-card">
        <div class="streak-icon">🔥</div>
        <div class="streak-content">
          <div class="streak-value">${streak.current} jour${streak.current > 1 ? 's' : ''} d'affilée</div>
          <div class="streak-label">${totalSections} section${totalSections > 1 ? 's' : ''} · ${totalChapters} chapitre${totalChapters > 1 ? 's' : ''}</div>
        </div>
      </div>

      <div class="section-title">
        <i class="fas fa-book"></i> Mes matières
        <span class="count">${ALL_SUBJECT_KEYS.length}</span>
      </div>

      <div class="subjects-grid">
        ${subjectCards}
      </div>

      ${activityHtml}
    `;

    el.querySelectorAll('[data-subject]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const subject = btn.dataset.subject;
        const chapter = btn.dataset.chapter;
        if (chapter) {
          navigate('chapter', { subject, chapterId: chapter });
        } else {
          navigate('notebook', { subject });
        }
      });
    });

  } catch (err) {
    console.error(err);
    showEmptyState(el, 'fa-exclamation-triangle', 'Impossible de charger',
      err.message || 'Erreur réseau.',
      `<button class="btn-full primary" style="max-width:200px;" onclick="location.reload()">
        <i class="fas fa-rotate"></i> Réessayer
      </button>`);
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 2 — CHAPITRES D'UNE MATIÈRE
// ═══════════════════════════════════════════════════════════════
async function renderNotebookView(params) {
  const el = $('view-notebook');
  const subject = params.subject;
  const info = SUBJECTS[subject];

  if (!info) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement des chapitres...');

  try {
    const data = await callApi('listChapters', { subject });
    state.cache.chapters[subject] = data;

    const chapters = data.chapters || [];
    const totalSections = chapters.reduce((s, c) => s + (c.sectionsCount || 0), 0);

    let listHtml = '';
    if (chapters.length === 0) {
      listHtml = `
        <div class="empty-state" style="padding:30px 20px;">
          <div class="icon"><i class="fas fa-book"></i></div>
          <h3>Aucun chapitre</h3>
          <p>Crée ton premier chapitre pour commencer à ajouter des sections.</p>
        </div>
      `;
    } else {
      listHtml = chapters.map((c) => `
        <button class="list-item" data-chapter="${escapeHtml(c.id)}">
          <div class="list-item-icon">📖</div>
          <div class="list-item-body">
            <div class="list-item-title">${escapeHtml(c.title)}</div>
            <div class="list-item-meta">
              <span>${c.sectionsCount} section${c.sectionsCount > 1 ? 's' : ''}</span>
              <span class="dot"></span>
              <span>${escapeHtml(c.last)}</span>
            </div>
          </div>
          <div class="list-item-arrow"><i class="fas fa-chevron-right"></i></div>
        </button>
      `).join('');
    }

    el.innerHTML = `
      <div class="page-hero">
        <h1>${info.emoji} ${escapeHtml(info.label)}</h1>
        <div class="hero-sub">${totalSections} section${totalSections > 1 ? 's' : ''} · ${chapters.length} chapitre${chapters.length > 1 ? 's' : ''}</div>
      </div>

      <div class="section-title">
        <i class="fas fa-book-open"></i> Chapitres
        <span class="count">${chapters.length}</span>
      </div>

      <div class="list">
        ${listHtml}
        <button class="list-item new" id="newChapterBtn">
          <div class="list-item-icon"><i class="fas fa-plus"></i></div>
          <span>Nouveau chapitre</span>
        </button>
      </div>
    `;

    el.querySelectorAll('[data-chapter]').forEach((btn) => {
      btn.addEventListener('click', () => {
        navigate('chapter', { subject, chapterId: btn.dataset.chapter });
      });
    });

    $('newChapterBtn')?.addEventListener('click', () => openNewChapterModal(subject));

  } catch (err) {
    console.error(err);
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 3 — SECTIONS D'UN CHAPITRE
// ═══════════════════════════════════════════════════════════════
async function renderChapterView(params) {
  const el = $('view-chapter');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];

  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement du chapitre...');

  try {
    const data = await callApi('getChapter', { subject, chapterId });
    state.cache.chapter[`${subject}/${chapterId}`] = data;

    const ch = data.chapter;
    const sections = data.sections || [];

    let listHtml = '';
    if (sections.length === 0) {
      listHtml = `
        <div class="empty-state" style="padding:30px 20px;">
          <div class="icon"><i class="fas fa-file-lines"></i></div>
          <h3>Aucune section</h3>
          <p>Ajoute la première partie que tu as étudiée aujourd'hui.</p>
        </div>
      `;
    } else {
      listHtml = sections.map((s, idx) => `
        <button class="list-item" data-section="${escapeHtml(s.id)}">
          <div class="list-item-icon"><i class="fas fa-check"></i></div>
          <div class="list-item-body">
            <div class="list-item-title">${idx + 1}. ${escapeHtml(s.title)}</div>
            <div class="list-item-meta">
              ${s.questionsCount > 0 ? `<span>${s.questionsCount} question${s.questionsCount > 1 ? 's' : ''}</span><span class="dot"></span>` : ''}
              ${s.exercisesCount > 0 ? `<span>${s.exercisesCount} exercice${s.exercisesCount > 1 ? 's' : ''}</span><span class="dot"></span>` : ''}
              <span>${escapeHtml(s.time)}</span>
            </div>
          </div>
          <div class="list-item-arrow"><i class="fas fa-chevron-right"></i></div>
        </button>
      `).join('');
    }

    el.innerHTML = `
      <div class="page-hero">
        <div class="hero-sub" style="margin-bottom:8px;">${info.emoji} ${escapeHtml(info.label)}</div>
        <h1>${escapeHtml(ch.title)}</h1>
        <div class="hero-sub">${sections.length} section${sections.length > 1 ? 's' : ''}</div>
      </div>

      ${sections.length > 0 ? `
        <button class="cta-card" id="viewLessonBtn">
          <i class="fas fa-book-reader"></i>
          <span>Voir la leçon complète</span>
        </button>
      ` : ''}

      <div class="section-title">
        <i class="fas fa-list"></i> Sections
        <span class="count">${sections.length}</span>
      </div>

      <div class="list">
        ${listHtml}
        <button class="list-item new" id="addSectionBtn">
          <div class="list-item-icon"><i class="fas fa-plus"></i></div>
          <span>Ajouter une section</span>
        </button>
      </div>
    `;

    el.querySelectorAll('[data-section]').forEach((btn) => {
      btn.addEventListener('click', () => {
        navigate('section', { subject, chapterId, sectionId: btn.dataset.section });
      });
    });

    $('viewLessonBtn')?.addEventListener('click', () => {
      navigate('lesson', { subject, chapterId });
    });

    $('addSectionBtn')?.addEventListener('click', () => openAddSectionModal(subject, chapterId));

  } catch (err) {
    console.error(err);
    if (err.status === 404) {
      showEmptyState(el, 'fa-book', 'Chapitre introuvable', 'Ce chapitre n\'existe plus.');
    } else {
      showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 4 — SECTION DÉTAILLÉE
// ═══════════════════════════════════════════════════════════════
async function renderSectionView(params) {
  const el = $('view-section');
  const { subject, chapterId, sectionId } = params;
  const info = SUBJECTS[subject];

  if (!info || !chapterId || !sectionId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement de la section...');

  try {
    const data = await callApi('getSection', { subject, chapterId, sectionId });
    const s = data.section;
    const a = s.analysis || {};

    const subjectLabel = info.label;
    const chapterTitle = state.cache.chapter[`${subject}/${chapterId}`]?.chapter?.title || '';

    // Construction des blocs selon le profil
    let blocksHtml = '';

    // Résumé
    if (a.summary) {
      blocksHtml += `
        <div class="block gold">
          <div class="block-head"><i class="fas fa-align-left"></i> Résumé</div>
          <div class="block-body">${safeText(a.summary)}</div>
        </div>
      `;
    }

    // Idées clés
    if (Array.isArray(a.keyIdeas) && a.keyIdeas.length > 0) {
      blocksHtml += `
        <div class="block blue">
          <div class="block-head"><i class="fas fa-lightbulb"></i> Idées clés</div>
          <ul class="key-ideas-list">
            ${a.keyIdeas.map((idea, i) => `
              <li><span class="num">${i + 1}</span><span>${safeText(idea)}</span></li>
            `).join('')}
          </ul>
        </div>
      `;
    }

    // Définitions (profil littéraire)
    if (Array.isArray(a.definitions) && a.definitions.length > 0) {
      blocksHtml += `
        <div class="block purple">
          <div class="block-head"><i class="fas fa-book"></i> Définitions</div>
          <ul class="key-ideas-list">
            ${a.definitions.map((d, i) => `
              <li>
                <span class="num">${i + 1}</span>
                <span><strong>${safeText(d.term)}</strong> — ${safeText(d.definition)}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
    }

    // Formules (profil scientifique)
    if (Array.isArray(a.formulas) && a.formulas.length > 0) {
      blocksHtml += `
        <div class="block gold">
          <div class="block-head"><i class="fas fa-square-root-variable"></i> Formules clés</div>
          ${a.formulas.map((f) => `
            <div class="formula-block">
              <div>$$${safeText(f.latex)}$$</div>
              ${f.condition ? `<div class="formula-condition">${safeText(f.condition)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    // Méthode
    if (Array.isArray(a.method) && a.method.length > 0) {
      blocksHtml += `
        <div class="block purple">
          <div class="block-head"><i class="fas fa-list-ol"></i> Méthode</div>
          <ol class="method-list">
            ${a.method.map((m) => `<li>${safeText(m)}</li>`).join('')}
          </ol>
        </div>
      `;
    }

    // Arguments (profil littéraire)
    if (Array.isArray(a.arguments) && a.arguments.length > 0) {
      blocksHtml += `
        <div class="block blue">
          <div class="block-head"><i class="fas fa-scale-balanced"></i> Arguments / Thèses</div>
          ${a.arguments.map((arg) => `
            <div style="margin-bottom:12px;">
              <div style="font-weight:700; color:var(--text-light); margin-bottom:6px;">${safeText(arg.thesis || '')}</div>
              <ul class="key-ideas-list">
                ${(arg.arguments || []).map((x, i) => `
                  <li><span class="num">${i + 1}</span><span>${safeText(x)}</span></li>
                `).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Vocabulaire (profil littéraire)
    if (Array.isArray(a.vocabulary) && a.vocabulary.length > 0) {
      blocksHtml += `
        <div class="block green">
          <div class="block-head"><i class="fas fa-spell-check"></i> Vocabulaire</div>
          <ul class="key-ideas-list">
            ${a.vocabulary.map((v, i) => `
              <li>
                <span class="num">${i + 1}</span>
                <span><strong>${safeText(v.term)}</strong> — ${safeText(v.meaning)}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
    }

    // Exemple
    if (a.example && (a.example.enonce || a.example.steps)) {
      blocksHtml += `
        <div class="block green">
          <div class="block-head"><i class="fas fa-check-circle"></i> Exemple guidé</div>
          ${a.example.enonce ? `<div class="example-enonce">${safeText(a.example.enonce)}</div>` : ''}
          ${Array.isArray(a.example.steps) && a.example.steps.length > 0
            ? `<ol class="example-steps">${a.example.steps.map((st) => `<li>${safeText(st)}</li>`).join('')}</ol>`
            : ''}
          ${a.example.result ? `<div class="example-result">${safeText(a.example.result)}</div>` : ''}
        </div>
      `;
    }

    // Piège
    if (a.trap && (a.trap.text || a.trap.solution)) {
      blocksHtml += `
        <div class="block red">
          <div class="block-head"><i class="fas fa-triangle-exclamation"></i> Piège du BAC</div>
          ${a.trap.text ? `<div class="trap-text">${safeText(a.trap.text)}</div>` : ''}
          ${a.trap.solution ? `<div class="trap-solution">${safeText(a.trap.solution)}</div>` : ''}
        </div>
      `;
    }

    // Questions probables
    let questionsHtml = '';
    if (Array.isArray(a.questions) && a.questions.length > 0) {
      questionsHtml = `
        <div class="content-section">
          <div class="content-section-title">
            <i class="fas fa-circle-question"></i> Questions probables au BAC
            <span class="count">${a.questions.length}</span>
          </div>
          <div class="qa-list">
            ${a.questions.map((q, i) => `
              <div class="qa-item" data-qa="${i}">
                <div class="qa-question">
                  <div class="qa-q-icon">Q${i + 1}</div>
                  <div class="qa-q-text">${safeText(q.q)}</div>
                  <div class="qa-toggle"><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="qa-answer">
                  <div class="qa-answer-inner">
                    <div class="qa-answer-label"><i class="fas fa-check"></i> Réponse</div>
                    <div class="qa-answer-text">${safeText(q.a)}</div>
                    ${q.source ? `<div class="qa-source"><strong>📎 Source :</strong> ${safeText(q.source)}</div>` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Exercices (scientifique)
    let exercisesHtml = '';
    if (Array.isArray(a.exercises) && a.exercises.length > 0) {
      exercisesHtml = `
        <div class="content-section">
          <div class="content-section-title">
            <i class="fas fa-dumbbell"></i> Exercices corrigés
            <span class="count">${a.exercises.length}</span>
          </div>
          <div class="qa-list">
            ${a.exercises.map((ex, i) => `
              <div class="qa-item" data-qa="ex-${i}">
                <div class="qa-question">
                  <div class="qa-q-icon">E${i + 1}</div>
                  <div class="qa-q-text">${safeText(ex.enonce)}</div>
                  <div class="qa-toggle"><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="qa-answer">
                  <div class="qa-answer-inner">
                    ${ex.indice ? `<div class="qa-answer-label" style="color:var(--info);"><i class="fas fa-lightbulb"></i> Indice</div><div class="qa-answer-text" style="margin-bottom:12px;">${safeText(ex.indice)}</div>` : ''}
                    <div class="qa-answer-label"><i class="fas fa-check"></i> Correction</div>
                    ${ex.correction && Array.isArray(ex.correction.steps) ? `
                      <ol class="example-steps" style="margin-top:8px;">
                        ${ex.correction.steps.map((s) => `<li>${safeText(s)}</li>`).join('')}
                      </ol>
                    ` : ''}
                    ${ex.correction?.reponse ? `<div class="example-result" style="margin-top:10px;">${safeText(ex.correction.reponse)}</div>` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    el.innerHTML = `
      <div class="section-hero">
        <div class="breadcrumb">
          <span>${info.emoji} ${escapeHtml(subjectLabel)}</span>
          ${chapterTitle ? `<span class="sep">›</span><span>${escapeHtml(chapterTitle)}</span>` : ''}
        </div>
        <h1>${escapeHtml(s.title)}</h1>
        <div class="sub">${escapeHtml(s.time || '')}</div>
      </div>

      <div class="content-section">
        <div class="content-section-title">
          <i class="fas fa-paste"></i> Ce que tu as collé
        </div>
        <div class="raw-input" id="rawInput">${safeText(s.rawInput)}</div>
        <button class="expand-btn" id="expandRawBtn">
          <i class="fas fa-chevron-down"></i>
          <span>Voir tout</span>
        </button>
      </div>

      <div class="content-section">
        <div class="content-section-title">
          <i class="fas fa-graduation-cap"></i> L'explication du prof
        </div>
        ${blocksHtml}
      </div>

      ${questionsHtml}
      ${exercisesHtml}

      <div class="content-section">
        <div class="content-section-title">
          <i class="fas fa-pen"></i> Mes notes
        </div>
        <textarea class="notes-area" id="notesArea" placeholder="Ajoute tes notes personnelles ici...">${escapeHtml(s.userNotes || '')}</textarea>
        <div class="notes-status" id="notesStatus"></div>
      </div>
    `;

    renderKaTeX(el);

    // Expand raw
    $('expandRawBtn')?.addEventListener('click', () => {
      const raw = $('rawInput');
      raw.classList.toggle('expanded');
      const span = $('expandRawBtn').querySelector('span');
      span.textContent = raw.classList.contains('expanded') ? 'Réduire' : 'Voir tout';
    });

    // Toggle QA items
    el.querySelectorAll('.qa-item').forEach((item) => {
      item.querySelector('.qa-question').addEventListener('click', () => {
        item.classList.toggle('open');
        if (item.classList.contains('open')) {
          setTimeout(() => renderKaTeX(item.querySelector('.qa-answer-inner')), 150);
        }
      });
    });

    // Auto-save notes
    let notesTimer = null;
    $('notesArea')?.addEventListener('input', () => {
      const status = $('notesStatus');
      status.textContent = 'Enregistrement...';
      status.className = 'notes-status saving';
      clearTimeout(notesTimer);
      notesTimer = setTimeout(async () => {
        try {
          await callApi('updateNotes', {
            subject,
            chapterId,
            sectionId,
            userNotes: $('notesArea').value
          });
          status.textContent = '✓ Enregistré';
          status.className = 'notes-status saved';
          setTimeout(() => { status.textContent = ''; }, 2000);
        } catch (e) {
          status.textContent = '✗ Erreur';
          status.className = 'notes-status';
          status.style.color = '#ff9a84';
        }
      }, 1500);
    });

  } catch (err) {
    console.error(err);
    if (err.status === 404) {
      showEmptyState(el, 'fa-file', 'Section introuvable', 'Cette section n\'existe plus.');
    } else {
      showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 5 — LEÇON COMPLÈTE
// ═══════════════════════════════════════════════════════════════
async function renderLessonView(params) {
  const el = $('view-lesson');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];

  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Assemblage de la leçon...');

  try {
    const data = await callApi('getFullLesson', { subject, chapterId });
    const sections = data.sections || [];

    if (sections.length === 0) {
      showEmptyState(el, 'fa-book', 'Leçon vide', 'Aucune section à afficher.');
      return;
    }

    const tocHtml = sections.map((s, i) => `
      <li data-toc="${i}">${escapeHtml(s.title)}</li>
    `).join('');

    const sectionsHtml = sections.map((s, i) => {
      const a = s.analysis || {};
      let content = '';

      if (a.summary) {
        content += `
          <div class="block gold">
            <div class="block-head"><i class="fas fa-align-left"></i> Résumé</div>
            <div class="block-body">${safeText(a.summary)}</div>
          </div>
        `;
      }

      if (Array.isArray(a.keyIdeas) && a.keyIdeas.length > 0) {
        content += `
          <div class="block blue">
            <div class="block-head"><i class="fas fa-lightbulb"></i> Idées clés</div>
            <ul class="key-ideas-list">
              ${a.keyIdeas.map((idea, j) => `
                <li><span class="num">${j + 1}</span><span>${safeText(idea)}</span></li>
              `).join('')}
            </ul>
          </div>
        `;
      }

      if (Array.isArray(a.formulas) && a.formulas.length > 0) {
        content += `
          <div class="block gold">
            <div class="block-head"><i class="fas fa-square-root-variable"></i> Formules clés</div>
            ${a.formulas.map((f) => `
              <div class="formula-block">
                <div>$$${safeText(f.latex)}$$</div>
                ${f.condition ? `<div class="formula-condition">${safeText(f.condition)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }

      if (Array.isArray(a.definitions) && a.definitions.length > 0) {
        content += `
          <div class="block purple">
            <div class="block-head"><i class="fas fa-book"></i> Définitions</div>
            <ul class="key-ideas-list">
              ${a.definitions.map((d, j) => `
                <li><span class="num">${j + 1}</span><span><strong>${safeText(d.term)}</strong> — ${safeText(d.definition)}</span></li>
              `).join('')}
            </ul>
          </div>
        `;
      }

      if (s.userNotes && s.userNotes.trim()) {
        content += `
          <div class="block green">
            <div class="block-head"><i class="fas fa-pen"></i> Mes notes</div>
            <div class="block-body" style="white-space:pre-wrap;">${safeText(s.userNotes)}</div>
          </div>
        `;
      }

      return `
        <div class="lesson-section" id="lesson-section-${i}">
          <div class="lesson-section-head">
            <div class="lesson-section-num">Section ${i + 1}</div>
            <div class="lesson-section-title">${escapeHtml(s.title)}</div>
          </div>
          ${content}
        </div>
      `;
    }).join('');

    el.innerHTML = `
      <div class="lesson-hero">
        <span class="lesson-emoji">${info.emoji}</span>
        <div class="lesson-subject">${escapeHtml(info.label)}</div>
        <h1>${escapeHtml(data.chapter.title)}</h1>
        <div class="lesson-stats">
          <span><i class="fas fa-layer-group"></i> ${sections.length} sections</span>
        </div>
      </div>

      <div class="toc">
        <div class="toc-title"><i class="fas fa-list"></i> Sommaire</div>
        <ol class="toc-list">${tocHtml}</ol>
      </div>

      ${sectionsHtml}
    `;

    renderKaTeX(el);

    el.querySelectorAll('[data-toc]').forEach((li) => {
      li.addEventListener('click', () => {
        const idx = li.dataset.toc;
        const target = $(`lesson-section-${idx}`);
        if (target) {
          const top = target.getBoundingClientRect().top + window.scrollY - 80;
          window.scrollTo({ top, behavior: 'smooth' });
        }
      });
    });

  } catch (err) {
    console.error(err);
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

function closeModal() {
  $('modalBackdrop').classList.remove('show');
  $('modalBackdrop').innerHTML = '';
  document.body.style.overflow = '';
  stopVoiceRecognition();
}

function openModal(html) {
  $('modalBackdrop').innerHTML = html;
  $('modalBackdrop').classList.add('show');
  document.body.style.overflow = 'hidden';

  const close = $('modalBackdrop').querySelector('.modal-close');
  close?.addEventListener('click', closeModal);

  $('modalBackdrop').addEventListener('click', (e) => {
    if (e.target === $('modalBackdrop')) closeModal();
  });
}

// Modale : nouveau chapitre
function openNewChapterModal(subject) {
  const info = SUBJECTS[subject];

  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>Nouveau chapitre</h2>
        <p>${info.emoji} ${escapeHtml(info.label)}</p>
      </div>

      <div class="form-field">
        <label class="form-label"><i class="fas fa-heading"></i> Titre du chapitre</label>
        <input type="text" class="form-input" id="newChapterTitle" placeholder="Ex : Nombres complexes" maxlength="100">
      </div>

      <button class="btn-full primary" id="createChapterBtn" disabled>
        <span class="btn-icon"><i class="fas fa-plus"></i></span>
        <span class="btn-text">Créer le chapitre</span>
        <span class="spinner"></span>
      </button>
    </div>
  `);

  const input = $('newChapterTitle');
  const btn = $('createChapterBtn');

  input.addEventListener('input', () => {
    btn.disabled = input.value.trim().length < 2;
  });

  btn.addEventListener('click', async () => {
    const title = input.value.trim();
    if (title.length < 2) return;

    btn.disabled = true;
    btn.classList.add('loading');

    try {
      await callApi('createChapter', { subject, title });
      showToast('Chapitre créé !', 'success');
      delete state.cache.chapters[subject];
      closeModal();
      navigate('notebook', { subject }, true);
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });

  setTimeout(() => input.focus(), 300);
}

// Modale : ajouter une section (texte ou voix)
function openAddSectionModal(subject, chapterId) {
  const info = SUBJECTS[subject];
  let mode = 'text';
  let voiceText = '';

  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>Ajouter une section</h2>
        <p>${info.emoji} ${escapeHtml(info.label)} · Colle ou dicte la partie étudiée</p>
      </div>

      <div class="capture-modes">
        <button class="capture-mode active" data-mode="text" type="button">
          <div class="icon"><i class="fas fa-keyboard"></i></div>
          <div class="label">Écrire</div>
          <div class="sub">Colle ton cours</div>
        </button>
        <button class="capture-mode" data-mode="voice" type="button">
          <div class="icon"><i class="fas fa-microphone"></i></div>
          <div class="label">Dicter</div>
          <div class="sub">Voix → texte</div>
        </button>
      </div>

      <div id="zoneText">
        <div class="form-field">
          <textarea class="form-textarea" id="sectionBody" placeholder="Colle ici la partie du cours que tu viens d'étudier..." maxlength="${MAX_CONTENT_LENGTH}"></textarea>
          <div class="char-counter" id="sectionCounter">0 / ${MAX_CONTENT_LENGTH}</div>
        </div>
      </div>

      <div class="voice-zone" id="zoneVoice">
        <div class="voice-status" id="voiceStatus">Appuie pour dicter</div>
        <button class="voice-btn" id="voiceBtn" type="button"><i class="fas fa-microphone"></i></button>
        <div class="voice-transcript" id="voiceTranscript"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px;">
        <button class="btn-full primary" id="sectionSubmitBtn" disabled>
          <span class="btn-icon"><i class="fas fa-wand-magic-sparkles"></i></span>
          <span class="btn-text">Analyser avec l'IA</span>
          <span class="spinner"></span>
        </button>
      </div>
    </div>
  `);

  const body = $('sectionBody');
  const counter = $('sectionCounter');
  const submitBtn = $('sectionSubmitBtn');

  function updateReady() {
    const len = body.value.trim().length;
    submitBtn.disabled = len < MIN_CONTENT_LENGTH;
    counter.textContent = `${body.value.length} / ${MAX_CONTENT_LENGTH}`;
  }

  body.addEventListener('input', updateReady);

  // Mode switch
  document.querySelectorAll('.capture-mode').forEach((el) => {
    el.addEventListener('click', () => {
      mode = el.dataset.mode;
      document.querySelectorAll('.capture-mode').forEach((m) => m.classList.toggle('active', m === el));
      $('zoneText').style.display = mode === 'text' ? 'block' : 'none';
      $('zoneVoice').classList.toggle('active', mode === 'voice');
      if (mode === 'voice') updateReady();
    });
  });

  // Voice
  const voiceBtn = $('voiceBtn');
  if (voiceBtn) {
    voiceBtn.addEventListener('click', () => toggleVoiceRecognition(body, updateReady));
  }

  submitBtn.addEventListener('click', async () => {
    const rawInput = mode === 'text' ? body.value.trim() : body.value.trim();
    if (rawInput.length < MIN_CONTENT_LENGTH) {
      showToast(`Contenu trop court (min ${MIN_CONTENT_LENGTH} caractères)`, 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    try {
      const result = await callApi('createSection', {
        subject,
        chapterId,
        rawInput,
        mode
      });
      showToast('Section analysée !', 'success');
      delete state.cache.chapter[`${subject}/${chapterId}`];
      closeModal();
      navigate('section', { subject, chapterId, sectionId: result.sectionId }, true);
    } catch (e) {
      if (e.code === 'FREE_SECTION_LIMIT') {
        showToast('Limite gratuite atteinte. Passe à Premium.', 'error', 5000);
      } else {
        showToast('Erreur : ' + e.message, 'error', 5000);
      }
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// VOIX — Web Speech API
// ═══════════════════════════════════════════════════════════════
let voiceRecognition = null;
let isRecording = false;
let voiceAccumulated = '';
let mediaStream = null;

async function toggleVoiceRecognition(textarea, onChange) {
  if (isRecording) {
    stopVoiceRecognition();
    return;
  }

  // 1. HTTPS ou localhost obligatoire
  if (!window.isSecureContext) {
    showToast('La dictée nécessite HTTPS.', 'error', 5000);
    return;
  }

  // 2. Support navigateur
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('Dictée non supportée. Utilise Chrome.', 'error');
    return;
  }

  // 3. Support getUserMedia
  if (!navigator.mediaDevices?.getUserMedia) {
    showToast('Micro non disponible.', 'error', 5000);
    return;
  }

  // 4. Ouvre le micro et garde le stream ACTIF
  try {
    if (!mediaStream) {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
    }
    // ⚠️ ON NE FERME PAS LE STREAM ICI
    // On le garde ouvert pendant toute la session de dictée
  } catch (err) {
    console.error('[MIC]', err.name, err.message);

    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      showToast('Micro refusé. Réinitialise les permissions du site.', 'error', 6000);
    } else if (err.name === 'NotFoundError') {
      showToast('Aucun micro détecté.', 'error', 5000);
    } else if (err.name === 'NotReadableError') {
      showToast('Micro occupé par une autre application.', 'error', 5000);
    } else {
      showToast('Erreur micro : ' + err.name, 'error', 5000);
    }
    return;
  }

  // 5. Crée et configure SpeechRecognition
  voiceRecognition = new SR();
  voiceRecognition.lang = 'fr-FR';
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = true;
  voiceRecognition.maxAlternatives = 1;

  voiceRecognition.onstart = () => {
    isRecording = true;
    $('voiceBtn')?.classList.add('recording');
    const st = $('voiceStatus');
    if (st) { st.textContent = '🔴 Enregistrement...'; st.classList.add('recording'); }
    console.log('[VOICE] started');
  };

  voiceRecognition.onresult = (event) => {
    let finalText = '';
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += transcript + ' ';
      else interim += transcript;
    }
    if (finalText) voiceAccumulated += finalText;
    textarea.value = voiceAccumulated + interim;
    const tr = $('voiceTranscript');
    if (tr) tr.textContent = voiceAccumulated + interim;
    onChange?.();
  };

  voiceRecognition.onerror = async (e) => {
    console.error('[VOICE] error:', e.error);

    // ⚠️ BUG CHROME ANDROID : "not-allowed" au 1er lancement alors que la permission est OK
    // → on retente automatiquement UNE FOIS après 300ms
    if (e.error === 'not-allowed' && !voiceRecognition.__retried) {
      voiceRecognition.__retried = true;
      console.log('[VOICE] Retry après not-allowed (bug Chrome Android)');
      try { voiceRecognition.stop(); } catch (_) {}
      setTimeout(() => {
        try {
          voiceRecognition.start();
        } catch (err) {
          showToast('Impossible de démarrer la dictée.', 'error');
          stopVoiceRecognition();
        }
      }, 300);
      return;
    }

    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      showToast('Micro refusé. Vérifie les permissions du site dans Chrome.', 'error', 6000);
    } else if (e.error === 'audio-capture') {
      showToast('Aucun micro détecté.', 'error', 5000);
    } else if (e.error === 'network') {
      showToast('Erreur réseau du service vocal.', 'error', 5000);
    } else if (e.error === 'no-speech') {
      // Silencieux
    } else if (e.error !== 'aborted') {
      showToast('Erreur vocale : ' + e.error, 'error', 5000);
    }

    if (e.error !== 'not-allowed' || voiceRecognition.__retried) {
      stopVoiceRecognition();
    }
  };

  voiceRecognition.onend = () => {
    isRecording = false;
    $('voiceBtn')?.classList.remove('recording');
    const st = $('voiceStatus');
    if (st) { st.textContent = 'Appuie pour reprendre'; st.classList.remove('recording'); }
    console.log('[VOICE] ended');
  };

  // 6. Démarre
  try {
    voiceRecognition.start();
  } catch (e) {
    console.error('[VOICE] start error:', e);
    showToast('Impossible de démarrer le micro.', 'error');
    stopVoiceRecognition();
  }
}

function stopVoiceRecognition() {
  if (voiceRecognition && isRecording) {
    try { voiceRecognition.stop(); } catch (_) {}
  }
  // ⚠️ On ferme le stream SEULEMENT ici, quand on arrête tout
  if (mediaStream) {
    try { mediaStream.getTracks().forEach((t) => t.stop()); } catch (_) {}
    mediaStream = null;
  }
  isRecording = false;
  $('voiceBtn')?.classList.remove('recording');
  }

  
function stopVoiceRecognition() {
  if (voiceRecognition && isRecording) {
    try { voiceRecognition.stop(); } catch (e) {}
  }
  isRecording = false;
  $('voiceBtn')?.classList.remove('recording');
}

// AUTH + INIT
// ═══════════════════════════════════════════════════════════════
function isUserPremium(data) {
  if (!data) return false;
  const active = data.premium === true || data.isUnlocked === true || data.hasDeposited === true;
  if (!active) return false;
  const end = data.subscriptionEndDate?.toDate?.() ||
    (data.subscriptionEndDate?.seconds ? new Date(data.subscriptionEndDate.seconds * 1000) : null);
  return !end || end.getTime() > Date.now();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace('login.html');
    return;
  }

  state.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      state.userData = snap.data();
      state.isPremium = isUserPremium(state.userData);
    }
  } catch (_) {}

  // Route initiale depuis le hash
  const initialRoute = routeFromHash();
  applyRoute(initialRoute);

  // Si pas de hash, on met un hash par défaut sans créer d'historique
  if (!window.location.hash) {
    window.history.replaceState(null, '', '#/notebooks');
  }
});
