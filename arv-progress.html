<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>ARVEXA — Mon cahier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="katex-utils.js" defer></script>

<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════════════════ */
:root {
  --accent: #B8860B;
  --accent-bright: #E0B84A;

  --success: #3AB67E;
  --success-soft: rgba(58, 182, 126, 0.12);
  --danger: #B85C3A;
  --danger-soft: rgba(184, 92, 58, 0.12);
  --info: #4AAFE0;
  --info-soft: rgba(74, 175, 224, 0.1);
  --purple: #9B59B6;
  --purple-soft: rgba(155, 89, 182, 0.12);

  --bg-dark: #0A0A0A;
  --bg-surface: #141414;
  --bg-card: rgba(20, 20, 20, 0.7);
  --bg-block: rgba(0, 0, 0, 0.28);
  --bg-input: rgba(0, 0, 0, 0.35);

  --text-light: #F5F0E8;
  --text-body: #cfd0cc;
  --text-dim: #8A8A7A;
  --text-muted: #5A5A4A;

  --border-soft: rgba(255, 255, 255, 0.05);
  --border-strong: rgba(255, 255, 255, 0.09);
  --border-gold: rgba(224, 184, 74, 0.22);

  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 18px;

  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);

  --font-body: 'Inter', system-ui, sans-serif;
  --font-serif: 'Playfair Display', Georgia, serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html {
  background: var(--bg-dark);
  color-scheme: dark;
  min-width: 320px;
  width: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.14) 0%, transparent 70%),
    radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
    linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
  color: var(--text-light);
  font: 15px/1.6 var(--font-body);
  padding-top: var(--safe-top);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
button:disabled { cursor: not-allowed; opacity: 0.5; }

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.header {
  position: sticky;
  top: 0;
  flex-shrink: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: rgba(10, 10, 10, 0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
  min-height: 60px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--text-dim);
  transition: var(--transition);
  font-size: 14px;
  flex-shrink: 0;
}
.back-btn:hover { border-color: var(--border-gold); color: var(--accent-bright); }
.back-btn.hidden { display: none; }

.page-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-serif);
  color: var(--text-light);
  letter-spacing: -0.01em;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.page-title i { color: var(--accent-bright); font-size: 14px; }
.page-title .emoji { font-size: 16px; }

.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--text-dim);
  transition: var(--transition);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover { border-color: var(--border-gold); color: var(--accent-bright); }

/* ═══════════════════════════════════════════════════════════
   MAIN / VIEWS
   ═══════════════════════════════════════════════════════════ */
main {
  flex: 1 1 auto;
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 16px 60px;
  position: relative;
}

.view { display: none; }
.view.active {
  display: block;
  animation: fadeIn 0.35s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* ═══════════════════════════════════════════════════════════
   VUE 1 — MES CAHIERS
   ═══════════════════════════════════════════════════════════ */
.greeting {
  margin-bottom: 20px;
}
.greeting h1 {
  font-family: var(--font-serif);
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 700;
  color: var(--text-light);
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.greeting h1 em {
  color: var(--accent-bright);
  font-style: italic;
}
.greeting p {
  color: var(--text-dim);
  font-size: 14px;
}

.streak-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.08), rgba(26, 58, 42, 0.05));
  border: 1px solid var(--border-gold);
  margin-bottom: 26px;
  position: relative;
  overflow: hidden;
}
.streak-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
}
.streak-icon {
  font-size: 32px;
  line-height: 1;
  filter: drop-shadow(0 2px 6px rgba(224, 184, 74, 0.3));
}
.streak-content { flex: 1; min-width: 0; }
.streak-value {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--accent-bright);
  line-height: 1.1;
}
.streak-label {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 2px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--text-light);
  margin: 24px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-soft);
  position: relative;
}
.section-title::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 40px;
  height: 2px;
  background: var(--accent-bright);
}
.section-title i { color: var(--accent-bright); font-size: 14px; }
.section-title .count {
  margin-left: auto;
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.subjects-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 620px) {
  .subjects-grid { grid-template-columns: repeat(3, 1fr); }
}

.subject-card {
  padding: 18px 16px;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
  position: relative;
  overflow: hidden;
}
.subject-card:hover {
  border-color: var(--border-gold);
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}
.subject-card .subject-emoji {
  font-size: 28px;
  line-height: 1;
}
.subject-card .subject-name {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text-light);
  letter-spacing: -0.01em;
}
.subject-card .subject-meta {
  font-size: 11.5px;
  color: var(--text-muted);
}
.subject-bar {
  height: 4px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 2px;
}
.subject-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 1s ease;
  width: 0%;
}

.activity-list { display: flex; flex-direction: column; gap: 10px; }

.activity-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  cursor: pointer;
  transition: var(--transition);
}
.activity-item:hover {
  border-color: var(--border-gold);
  transform: translateX(3px);
}
.activity-emoji {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  background: rgba(224, 184, 74, 0.1);
  flex-shrink: 0;
}
.activity-body { flex: 1; min-width: 0; }
.activity-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.activity-meta {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.activity-arrow {
  color: var(--text-muted);
  font-size: 14px;
  flex-shrink: 0;
  transition: var(--transition);
}
.activity-item:hover .activity-arrow {
  color: var(--accent-bright);
  transform: translateX(3px);
}

/* ═══════════════════════════════════════════════════════════
   VUE 2 & 3 — LISTES (CHAPITRES / SECTIONS)
   ═══════════════════════════════════════════════════════════ */
.page-hero {
  padding: 20px 22px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.06), rgba(26, 58, 42, 0.04));
  border: 1px solid var(--border-soft);
  margin-bottom: 22px;
}
.page-hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(22px, 4.5vw, 28px);
  font-weight: 700;
  color: var(--text-light);
  line-height: 1.15;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.page-hero .hero-sub {
  color: var(--text-dim);
  font-size: 13.5px;
  margin-bottom: 12px;
}
.page-hero .hero-progress {
  display: flex;
  align-items: center;
  gap: 12px;
}
.page-hero .hero-progress-bar {
  flex: 1;
  height: 5px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 5px;
  overflow: hidden;
}
.page-hero .hero-progress-fill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  transition: width 1s ease;
  width: 0%;
}
.page-hero .hero-progress-value {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-bright);
  flex-shrink: 0;
}

.cta-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 20px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A;
  font-weight: 800;
  font-size: 14.5px;
  transition: var(--transition);
  box-shadow: 0 6px 20px rgba(184, 134, 11, 0.2);
  margin-bottom: 22px;
  font-family: inherit;
  border: none;
}
.cta-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(184, 134, 11, 0.35);
}
.cta-card i { font-size: 14px; }

.cta-card.secondary {
  background: transparent;
  border: 1px solid var(--border-gold);
  color: var(--accent-bright);
  box-shadow: none;
}
.cta-card.secondary:hover {
  background: rgba(224, 184, 74, 0.06);
}

.list { display: flex; flex-direction: column; gap: 10px; }

.list-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}
.list-item:hover {
  border-color: var(--border-gold);
  transform: translateX(3px);
}

.list-item-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  background: rgba(224, 184, 74, 0.1);
  border: 1px solid rgba(224, 184, 74, 0.15);
}
.list-item-icon.done {
  background: var(--success-soft);
  border-color: rgba(58, 182, 126, 0.25);
  color: var(--success);
  font-size: 16px;
}
.list-item-icon.draft {
  background: rgba(224, 184, 74, 0.08);
  border-color: rgba(224, 184, 74, 0.15);
  color: var(--accent-bright);
  font-size: 16px;
}

.list-item-body { flex: 1; min-width: 0; }
.list-item-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 4px;
  line-height: 1.3;
}
.list-item-meta {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.list-item-meta .dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--text-muted);
}
.list-item-arrow {
  color: var(--text-muted);
  font-size: 14px;
  flex-shrink: 0;
  transition: var(--transition);
}
.list-item:hover .list-item-arrow {
  color: var(--accent-bright);
  transform: translateX(3px);
}

.list-item.new {
  background: transparent;
  border: 1px dashed rgba(224, 184, 74, 0.3);
  justify-content: center;
  color: var(--accent-bright);
  font-weight: 700;
  font-size: 14px;
}
.list-item.new:hover {
  background: rgba(224, 184, 74, 0.05);
  border-style: solid;
}
.list-item.new .list-item-icon {
  background: transparent;
  border: none;
  width: 32px;
  height: 32px;
  font-size: 18px;
}

/* Progress dots */
.progress-dots {
  display: flex;
  gap: 3px;
  margin-top: 4px;
}
.progress-dots .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
}
.progress-dots .dot.filled {
  background: var(--accent-bright);
}

/* ═══════════════════════════════════════════════════════════
   VUE 4 — SECTION DÉTAILLÉE
   ═══════════════════════════════════════════════════════════ */
.section-hero {
  margin-bottom: 22px;
}
.section-hero .breadcrumb {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.section-hero .breadcrumb .sep { opacity: 0.5; }
.section-hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700;
  color: var(--text-light);
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.section-hero .sub {
  font-size: 12.5px;
  color: var(--text-muted);
}

.content-section {
  margin-bottom: 26px;
}
.content-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-soft);
}
.content-section-title i { color: var(--accent-bright); font-size: 12px; }
.content-section-title .count {
  margin-left: auto;
  color: var(--text-muted);
  font-weight: 600;
}

/* Bloc "ce que tu as collé" */
.raw-input {
  padding: 16px 18px;
  border-radius: var(--radius);
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border-soft);
  font-size: 13.5px;
  color: var(--text-body);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: break-word;
  max-height: 200px;
  overflow: hidden;
  position: relative;
}
.raw-input.expanded { max-height: none; }
.raw-input::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(180deg, transparent, rgba(10, 10, 10, 0.9));
  pointer-events: none;
}
.raw-input.expanded::after { display: none; }

.expand-btn {
  margin-top: 8px;
  padding: 8px 16px;
  border-radius: 20px;
  background: transparent;
  border: 1px solid var(--border-soft);
  color: var(--accent-bright);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.expand-btn:hover {
  border-color: var(--border-gold);
  background: rgba(224, 184, 74, 0.05);
}

/* Blocs typés */
.block {
  padding: 16px 18px;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-left: 3px solid var(--accent-bright);
  margin-bottom: 12px;
  position: relative;
}
.block.gold { border-left-color: var(--accent-bright); }
.block.blue { border-left-color: var(--info); }
.block.green { border-left-color: var(--success); }
.block.red { border-left-color: var(--danger); }
.block.purple { border-left-color: var(--purple); }

.block-head {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--accent-bright);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.block.blue .block-head { color: var(--info); }
.block.green .block-head { color: var(--success); }
.block.red .block-head { color: var(--danger); }
.block.purple .block-head { color: var(--purple); }
.block-head i { font-size: 13px; }

.block-body {
  font-size: 14.5px;
  color: var(--text-body);
  line-height: 1.7;
}
.block-body p + p { margin-top: 8px; }

/* Idées clés */
.key-ideas-list {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.key-ideas-list li {
  display: flex;
  gap: 12px;
  font-size: 14.5px;
  color: var(--text-body);
  line-height: 1.6;
}
.key-ideas-list li .num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(74, 175, 224, 0.15);
  color: var(--info);
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

/* Formules */
.formula-block {
  padding: 18px 16px;
  text-align: center;
  background: rgba(0, 0, 0, 0.25);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  overflow-x: auto;
}
.formula-block:last-child { margin-bottom: 0; }
.formula-condition {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-top: 8px;
  font-style: italic;
}

/* Méthode */
.method-list {
  list-style: none;
  padding: 0;
  counter-reset: mstep;
}
.method-list li {
  position: relative;
  padding-left: 32px;
  counter-increment: mstep;
  font-size: 14px;
  color: var(--text-body);
  line-height: 1.65;
  margin-bottom: 10px;
}
.method-list li:last-child { margin-bottom: 0; }
.method-list li::before {
  content: counter(mstep);
  position: absolute;
  left: 0; top: 1px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(155, 89, 182, 0.15);
  color: var(--purple);
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Exemple */
.example-enonce {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: rgba(0, 0, 0, 0.28);
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.6;
  margin-bottom: 12px;
}
.example-steps {
  list-style: none;
  padding: 0;
  counter-reset: estep;
}
.example-steps li {
  position: relative;
  padding-left: 28px;
  counter-increment: estep;
  font-size: 14px;
  color: var(--text-body);
  line-height: 1.65;
  margin-bottom: 8px;
}
.example-steps li::before {
  content: counter(estep) '.';
  position: absolute;
  left: 0; top: 0;
  color: var(--success);
  font-weight: 700;
}
.example-result {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: rgba(58, 182, 126, 0.1);
  border-left: 3px solid var(--success);
  font-size: 14px;
  color: #7ce0aa;
  font-weight: 600;
  margin-top: 8px;
}

/* Piège */
.trap-text {
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.65;
  margin-bottom: 8px;
}
.trap-solution {
  padding-left: 18px;
  position: relative;
  font-size: 13.5px;
  color: #7ce0aa;
  line-height: 1.6;
}
.trap-solution::before {
  content: '→';
  position: absolute;
  left: 0; top: 0;
  font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════
   QUESTIONS PROBABLES
   ═══════════════════════════════════════════════════════════ */
.qa-list { display: flex; flex-direction: column; gap: 10px; }

.qa-item {
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  overflow: hidden;
  transition: var(--transition);
}
.qa-item.open { border-color: var(--border-gold); }

.qa-question {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}
.qa-question:hover { background: rgba(255, 255, 255, 0.015); }

.qa-q-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--info-soft);
  color: var(--info);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  flex-shrink: 0;
}
.qa-q-text {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-light);
  line-height: 1.5;
}
.qa-toggle {
  color: var(--text-muted);
  font-size: 12px;
  transition: transform 0.3s ease;
  flex-shrink: 0;
  margin-top: 4px;
}
.qa-item.open .qa-toggle { transform: rotate(180deg); color: var(--accent-bright); }

.qa-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.qa-item.open .qa-answer { max-height: 3000px; }

.qa-answer-inner {
  padding: 14px 16px 16px;
  border-top: 1px solid var(--border-soft);
  background: rgba(0, 0, 0, 0.15);
}
.qa-answer-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--success);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.qa-answer-text {
  font-size: 14px;
  color: var(--text-body);
  line-height: 1.7;
}
.qa-source {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--border-soft);
  font-size: 11.5px;
  color: var(--text-muted);
  font-style: italic;
  line-height: 1.55;
}
.qa-source strong {
  color: var(--text-dim);
  font-style: normal;
  font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════
   NOTES + IMAGES
   ═══════════════════════════════════════════════════════════ */
.notes-area {
  width: 100%;
  min-height: 120px;
  padding: 14px 16px;
  border-radius: var(--radius);
  background: var(--bg-input);
  border: 1px solid var(--border-soft);
  color: var(--text-light);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.65;
  resize: vertical;
  outline: none;
  transition: var(--transition);
}
.notes-area:focus {
  border-color: var(--border-gold);
  box-shadow: 0 0 0 3px rgba(224, 184, 74, 0.08);
}
.notes-area::placeholder { color: var(--text-muted); }

.notes-status {
  font-size: 11px;
  color: var(--text-muted);
  text-align: right;
  margin-top: 6px;
  min-height: 16px;
}
.notes-status.saving { color: var(--accent-bright); }
.notes-status.saved { color: var(--success); }

.images-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 10px;
}
.image-tile {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  position: relative;
  background: var(--bg-input);
  border: 1px solid var(--border-soft);
  cursor: pointer;
  transition: var(--transition);
}
.image-tile:hover { border-color: var(--border-gold); }
.image-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.image-tile .image-remove {
  position: absolute;
  top: 6px; right: 6px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.75);
  color: #ff9a84;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  cursor: pointer;
  opacity: 0;
  transition: var(--transition);
}
.image-tile:hover .image-remove { opacity: 1; }

.image-add {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  border: 2px dashed rgba(224, 184, 74, 0.3);
  background: transparent;
  color: var(--accent-bright);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}
.image-add:hover {
  border-color: var(--accent-bright);
  background: rgba(224, 184, 74, 0.05);
}
.image-add i { font-size: 20px; }
.image-add span { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══════════════════════════════════════════════════════════
   VUE 5 — LEÇON COMPLÈTE
   ═══════════════════════════════════════════════════════════ */
.lesson-hero {
  text-align: center;
  padding: 32px 20px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.06), rgba(26, 58, 42, 0.04));
  border: 1px solid var(--border-soft);
  margin-bottom: 26px;
}
.lesson-hero .lesson-emoji {
  font-size: 44px;
  margin-bottom: 12px;
  display: block;
}
.lesson-hero .lesson-subject {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent-bright);
  margin-bottom: 8px;
}
.lesson-hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(22px, 5vw, 30px);
  font-weight: 700;
  color: var(--text-light);
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
.lesson-hero .lesson-stats {
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.lesson-hero .lesson-stats span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.lesson-hero .lesson-stats i { color: var(--accent-bright); font-size: 12px; }

/* Sommaire */
.toc {
  padding: 20px 22px;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  margin-bottom: 26px;
}
.toc-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent-bright);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toc-list {
  list-style: none;
  padding: 0;
  counter-reset: toc;
}
.toc-list li {
  counter-increment: toc;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-soft);
  font-size: 14px;
  color: var(--text-body);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: var(--transition);
}
.toc-list li:last-child { border-bottom: none; }
.toc-list li:hover { color: var(--accent-bright); padding-left: 6px; }
.toc-list li::before {
  content: counter(toc);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(224, 184, 74, 0.1);
  color: var(--accent-bright);
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.lesson-section {
  padding: 26px 0;
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: 26px;
}
.lesson-section:last-child { border-bottom: none; }

.lesson-section-head {
  margin-bottom: 20px;
}
.lesson-section-num {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent-bright);
  margin-bottom: 6px;
}
.lesson-section-title {
  font-family: var(--font-serif);
  font-size: clamp(19px, 3.5vw, 24px);
  font-weight: 700;
  color: var(--text-light);
  line-height: 1.2;
  letter-spacing: -0.01em;
}

/* ═══════════════════════════════════════════════════════════
   MODALES
   ═══════════════════════════════════════════════════════════ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.modal-backdrop.show { display: flex; animation: fadeIn 0.25s ease; }

.modal {
  width: 100%;
  max-width: 640px;
  max-height: 92vh;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-strong);
  border-radius: 22px 22px 0 0;
  padding: 24px 20px;
  padding-bottom: calc(24px + var(--safe-bottom));
  overflow-y: auto;
  position: relative;
  animation: slideUp 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 22px 22px 0 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid var(--border-soft);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: var(--transition);
  z-index: 5;
}
.modal-close:hover { color: var(--text-light); border-color: var(--border-gold); }

.modal-head {
  text-align: center;
  margin-bottom: 22px;
  padding: 0 30px;
}
.modal-head h2 {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 6px;
}
.modal-head p {
  font-size: 13.5px;
  color: var(--text-dim);
  line-height: 1.55;
}

.form-field { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.form-label i { color: var(--accent-bright); margin-right: 6px; }

.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 13px 15px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--bg-input);
  color: var(--text-light);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: var(--transition);
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: var(--border-gold);
  box-shadow: 0 0 0 3px rgba(224, 184, 74, 0.08);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
.form-textarea { min-height: 160px; line-height: 1.6; resize: vertical; }

.char-counter {
  text-align: right;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
}

/* Subject picker (dans modale) */
.subject-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.subject-pick {
  padding: 14px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--bg-card);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  font-family: inherit;
}
.subject-pick:hover { border-color: var(--border-gold); color: var(--text-light); }
.subject-pick.active {
  border-color: var(--accent-bright);
  background: rgba(224, 184, 74, 0.08);
  color: var(--accent-bright);
}
.subject-pick .emoji { font-size: 18px; }

/* Buttons */
.btn-full {
  width: 100%;
  min-height: 48px;
  padding: 14px 20px;
  border-radius: 12px;
  border: none;
  font-size: 14.5px;
  font-weight: 700;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: var(--transition);
  cursor: pointer;
}
.btn-full.primary {
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A;
  box-shadow: 0 4px 16px rgba(184, 134, 11, 0.25);
}
.btn-full.primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(184, 134, 11, 0.4);
}
.btn-full.secondary {
  background: transparent;
  border: 1px solid var(--border-soft);
  color: var(--text-dim);
}
.btn-full.secondary:hover { border-color: var(--border-gold); color: var(--accent-bright); }

.btn-full .spinner {
  display: none;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(10, 10, 10, 0.25);
  border-top-color: #0A0A0A;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.btn-full.loading .spinner { display: block; }
.btn-full.loading .btn-text,
.btn-full.loading .btn-icon { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Capture modes */
.capture-modes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.capture-mode {
  padding: 16px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  transition: var(--transition);
  font-family: inherit;
  color: inherit;
}
.capture-mode:hover { border-color: var(--border-gold); }
.capture-mode.active {
  border-color: var(--accent-bright);
  background: rgba(224, 184, 74, 0.08);
}
.capture-mode .icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(224, 184, 74, 0.1);
  color: var(--accent-bright);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}
.capture-mode .label { font-size: 13px; font-weight: 700; color: var(--text-light); }
.capture-mode .sub { font-size: 10.5px; color: var(--text-muted); }

/* Voice zone */
.voice-zone {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 22px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  text-align: center;
}
.voice-zone.active { display: flex; }
.voice-btn {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A;
  font-size: 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  box-shadow: 0 8px 30px rgba(184, 134, 11, 0.3);
}
.voice-btn:hover { transform: scale(1.05); }
.voice-btn.recording {
  background: linear-gradient(135deg, #E74C3C, #B85C3A);
  animation: pulseRec 1.5s ease-in-out infinite;
}
@keyframes pulseRec {
  0%, 100% { box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4), 0 0 0 0 rgba(231, 76, 60, 0.4); }
  50% { box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4), 0 0 0 20px rgba(231, 76, 60, 0); }
}
.voice-status {
  font-size: 13px;
  color: var(--text-dim);
  min-height: 20px;
}
.voice-status.recording { color: #ff9a84; font-weight: 700; }
.voice-transcript {
  width: 100%;
  padding: 12px 14px;
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-light);
  min-height: 70px;
  max-height: 180px;
  overflow-y: auto;
  text-align: left;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.voice-transcript:empty::before {
  content: 'Ta dictée apparaîtra ici...';
  color: var(--text-muted);
}

/* ═══════════════════════════════════════════════════════════
   TOASTS
   ═══════════════════════════════════════════════════════════ */
.toast-container {
  position: fixed;
  top: calc(var(--safe-top) + 16px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  width: calc(100% - 32px);
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-radius: 12px;
  background: rgba(20, 22, 20, 0.96);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-soft);
  color: var(--text-light);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  pointer-events: auto;
}
.toast.success { border-color: rgba(58, 182, 126, 0.5); }
.toast.error { border-color: rgba(231, 76, 60, 0.5); }
.toast.info { border-color: var(--border-gold); }
.toast i { font-size: 15px; flex-shrink: 0; }
.toast.success i { color: var(--success); }
.toast.error i { color: #ff9a84; }
.toast.info i { color: var(--accent-bright); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════════════════════
   LOADING / EMPTY
   ═══════════════════════════════════════════════════════════ */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 60px 20px;
}
.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(224, 184, 74, 0.15);
  border-top-color: var(--accent-bright);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-state p { font-size: 13.5px; color: var(--text-muted); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.empty-state .icon {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  background: rgba(224, 184, 74, 0.06);
  border: 1px solid var(--border-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  color: var(--accent-bright);
}
.empty-state h3 {

const $ = (id) => document.getElementById(id);

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

function safeText(text) {
  return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderKaTeX(root) {
  if (!root) return;
  if (window.KaTeXUtils?.renderMath) { window.KaTeXUtils.renderMath(root); return; }
  if (typeof renderMathInElement !== 'function') { setTimeout(() => renderKaTeX(root), 200); return; }
  try {
    renderMathInElement(root, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false,
      errorColor: '#ff9a84',
      strict: false,
      trust: true
    });
  } catch (_) {}
}

function showToast(message, type = 'info', duration = 3000) {
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(message)}</span>`;
  $('toastContainer').appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// ═══════════════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════════════
function navigate(view, params = {}, pushHistory = true) {
  if (pushHistory && state.view) {
    state.history.push({ view: state.view, params: state.params });
  }

  state.view = view;
  state.params = params || {};

  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  const targetView = $(`view-${view}`);
  if (targetView) targetView.classList.add('active');

  updateHeader();
  updateBackButton();

  switch (view) {
    case 'notebooks': renderNotebooksView(); break;
    case 'notebook': renderNotebookView(params); break;
    case 'chapter': renderChapterView(params); break;
    case 'section': renderSectionView(params); break;
    case 'lesson': renderLessonView(params); break;
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  const prev = state.history.pop();
  if (prev) {
    navigate(prev.view, prev.params, false);
  } else {
    navigate('notebooks', {}, false);
  }
}

function updateHeader() {
  const map = {
    notebooks: { emoji: '📓', text: 'Mon cahier' },
    notebook: { emoji: SUBJECTS[state.params.subject]?.emoji || '📖', text: SUBJECTS[state.params.subject]?.label || 'Cahier' },
    chapter: { emoji: '📖', text: state.mock.chapter.title || 'Chapitre' },
    section: { emoji: '📝', text: state.params.title || 'Section' },
    lesson: { emoji: '📄', text: 'Leçon complète' }
  };
  const info = map[state.view] || map.notebooks;
  $('pageTitle').innerHTML = `<span class="emoji">${info.emoji}</span><span id="pageTitleText">${escapeHtml(info.text)}</span>`;
}

function updateBackButton() {
  $('backBtn').classList.toggle('hidden', state.view === 'notebooks');
}

            </div>

        `;
      }).join('')}

    <div class="section-title">
      <i class="fas fa-clock"></i> Activité récente
    </div>

    <div class="activity-list">
      ${m.recentActivity.map((a) => {
        const subj = SUBJECTS[a.subject];
        return `
          <button class="activity-item" data-subject="${a.subject}">
            <div class="activity-emoji">${subj.emoji}</div>
            <div class="activity-body">
              <div class="activity-title">${escapeHtml(a.chapter)}</div>

    navigate('lesson', { subject: params.subject, chapterId: params.chapterId });
  });

  $('addSectionBtn')?.addEventListener('click', () => {
    showToast('Fonctionnalité à venir : ajouter une section', 'info');
  });
}

// ═══════════════════════════════════════════════════════════════
// VUE 4 — SECTION DÉTAILLÉE
// ═══════════════════════════════════════════════════════════════
function renderSectionView(params) {
  const el = $('view-section');
  const sec = state.mock.section;
  const subj = SUBJECTS[sec.subject] || SUBJECTS.mathematiques;
  const a = sec.analysis;

  el.innerHTML = `
    <div class="section-hero">
      <div class="breadcrumb">
        <span>${subj.emoji} ${escapeHtml(subj.label)}</span>
        <span class="sep">›</span>
        <span>${escapeHtml(sec.chapterTitle)}</span>
      </div>
      <h1>${escapeHtml(sec.title)}</h1>
      <div class="sub">Section 1 · ${escapeHtml(sec.time)}</div>
    </div>

    <!-- Ce que tu as collé -->
    <div class="content-section">
      <div class="content-section-title">
        <i class="fas fa-paste"></i> Ce que tu as collé
      </div>
      <div class="raw-input" id="rawInput">${safeText(sec.rawInput)}</div>
      <button class="expand-btn" id="expandRawBtn">
        <i class="fas fa-chevron-down"></i>
        <span>Voir tout</span>
      </button>
    </div>

    <!-- Explication du prof -->
    <div class="content-section">
      <div class="content-section-title">
        <i class="fas fa-graduation-cap"></i> L'explication du prof
      </div>

      <div class="block gold">
        <div class="block-head"><i class="fas fa-align-left"></i> Résumé</div>
        <div class="block-body">${safeText(a.summary)}</div>
      </div>

      <div class="block blue">
        <div class="block-head"><i class="fas fa-lightbulb"></i> Idées clés</div>
        <ul class="key-ideas-list">
          ${a.keyIdeas.map((idea, i) => `
            <li><span class="num">${i + 1}</span><span>${safeText(idea)}</span></li>
          `).join('')}
        </ul>
      </div>

      ${a.formulas && a.formulas.length > 0 ? `
        <div class="block gold">
          <div class="block-head"><i class="fas fa-square-root-variable"></i> Formules clés</div>
          ${a.formulas.map((f) => `
            <div class="formula-block">
              <div>$$${safeText(f.latex)}$$</div>
              ${f.condition ? `<div class="formula-condition">${safeText(f.condition)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}

      <div class="block purple">
        <div class="block-head"><i class="fas fa-list-ol"></i> Méthode</div>
        <ol class="method-list">
          ${a.method.map((m) => `<li>${safeText(m)}</li>`).join('')}
        </ol>
      </div>

      <div class="block green">
        <div class="block-head"><i class="fas fa-check-circle"></i> Exemple guidé</div>
        <div class="example-enonce">${safeText(a.example.enonce)}</div>
        <ol class="example-steps">
          ${a.example.steps.map((s) => `<li>${safeText(s)}</li>`).join('')}
        </ol>
        <div class="example-result">${safeText(a.example.result)}</div>
      </div>

      <div class="block red">
        <div class="block-head"><i class="fas fa-triangle-exclamation"></i> Piège du BAC</div>
        <div class="trap-text">${safeText(a.trap.text)}</div>
        <div class="trap-solution">${safeText(a.trap.solution)}</div>
      </div>
    </div>

    <!-- Questions probables -->
    <div class="content-section">
      <div class="content-section-title">
        <i class="fas fa-circle-question"></i> Questions probables au BAC
        <span class="count">${a.questions.length}</span>
      </div>
      <div class="qa-list">
        ${a.questions.map((q, i) => `
          <div class="qa-item" data-qa="${i}">
            <div class="qa-question">
              <div class="qa-q-icon">Q${i + 1}</div>
              <div class="qa-q-text">${safeText(q.q)}</div>
              <div class="qa-toggle"><i class="fas fa-chevron-down"></i></div>
            </div>
            <div class="qa-answer">
              <div class="qa-answer-inner">
                <div class="qa-answer-label"><i class="fas fa-check"></i> Réponse</div>
                <div class="qa-answer-text">${safeText(q.a)}</div>
                <div class="qa-source"><strong>📎 Source :</strong> ${safeText(q.source)}</div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Mes notes -->
    <div class="content-section">
      <div class="content-section-title">
        <i class="fas fa-pen"></i> Mes notes
      </div>
      <textarea class="notes-area" id="notesArea" placeholder="Ajoute tes notes personnelles ici...">${escapeHtml(sec.userNotes)}</textarea>
      <div class="notes-status" id="notesStatus"></div>
    </div>

    <!-- Mes images -->
    <div class="content-section">
      <div class="content-section-title">
        <i class="fas fa-image"></i> Mes images
        <span class="count">${sec.userImages.length}</span>
      </div>
      <div class="images-grid" id="imagesGrid">
        ${sec.userImages.map((img, i) => `
          <div class="image-tile">
            <img src="${escapeHtml(img.url)}" alt="Image ${i + 1}">
            <button class="image-remove" data-remove-image="${i}" aria-label="Supprimer">
              <i class="fas fa-times"></i>
            </button>
          </div>
        `).join('')}
        <button class="image-add" id="addImageBtn">
          <i class="fas fa-plus"></i>
          <span>Ajouter</span>
        </button>
      </div>
    </div>
  `;

  renderKaTeX(el);

  // Expand raw input
  $('expandRawBtn')?.addEventListener('click', () => {
    const raw = $('rawInput');
    raw.classList.toggle('expanded');
    const span = $('expandRawBtn').querySelector('span');
    span.textContent = raw.classList.contains('expanded') ? 'Réduire' : 'Voir tout';
  });

  // Toggle QA
  el.querySelectorAll('.qa-item').forEach((item) => {
    item.querySelector('.qa-question').addEventListener('click', () => {
      item.classList.toggle('open');
      if (item.classList.contains('open')) {
        setTimeout(() => renderKaTeX(item.querySelector('.qa-answer-inner')), 150);
      }
    });
  });

  // Notes auto-save
  let notesTimer = null;
  $('notesArea')?.addEventListener('input', () => {
    const status = $('notesStatus');
    status.textContent = 'Enregistrement...';
    status.className = 'notes-status saving';
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => {
      status.textContent = '✓ Enregistré';
      status.className = 'notes-status saved';
      setTimeout(() => { status.textContent = ''; }, 2000);
    }, 1200);
  });

  $('addImageBtn')?.addEventListener('click', () => {
    showToast('Fonctionnalité à venir : ajout d\'image', 'info');
  });
}

// ═══════════════════════════════════════════════════════════════
// VUE 5 — LEÇON COMPLÈTE
// ═══════════════════════════════════════════════════════════════
function renderLessonView(params) {
  const el = $('view-lesson');
  const l = state.mock.lesson;
  const subj = SUBJECTS[l.subject] || SUBJECTS.mathematiques;

  el.innerHTML = `
    <div class="lesson-hero">
      <span class="lesson-emoji">${subj.emoji}</span>
      <div class="lesson-subject">${escapeHtml(subj.label)}</div>
      <h1>${escapeHtml(l.chapterTitle)}</h1>
      <div class="lesson-stats">
        <span><i class="fas fa-layer-group"></i> ${l.sectionsCount} sections</span>
        <span><i class="fas fa-clock"></i> ${l.readingTime} min</span>
      </div>
    </div>

    <div class="toc">
      <div class="toc-title"><i class="fas fa-list"></i> Sommaire</div>
      <ol class="toc-list">
        ${l.sections.map((s, i) => `
          <li data-toc="${i}">${escapeHtml(s.title)}</li>
        `).join('')}
      </ol>
    </div>

    ${l.sections.map((s, i) => `
      <div class="lesson-section" id="lesson-section-${i}">
        <div class="lesson-section-head">
          <div class="lesson-section-num">Section ${i + 1}</div>
          <div class="lesson-section-title">${escapeHtml(s.title)}</div>
        </div>

        <div class="block gold">
          <div class="block-head"><i class="fas fa-align-left"></i> Résumé</div>
          <div class="block-body">${safeText(s.summary)}</div>
        </div>

        <div class="block blue">
          <div class="block-head"><i class="fas fa-lightbulb"></i> Idées clés</div>
          <ul class="key-ideas-list">
            ${s.keyIdeas.map((idea, j) => `
              <li><span class="num">${j + 1}</span><span>${safeText(idea)}</span></li>
            `).join('')}
          </ul>
        </div>
      </div>
    `).join('')}
  `;

  renderKaTeX(el);

  el.querySelectorAll('[data-toc]').forEach((li) => {
    li.addEventListener('click', () => {
      const idx = li.dataset.toc;
      const target = $(`lesson-section-${idx}`);
      if (target) {
        const headerOffset = 80;
        const top = target.getBoundingClientRect().top + window.scrollY - headerOffset;
        window.scrollTo({ top, behavior: 'smooth' });
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════════
// ÉVÉNEMENTS GLOBAUX
// ═══════════════════════════════════════════════════════════════
$('backBtn').addEventListener('click', goBack);

$('refreshBtn').addEventListener('click', () => {
  const icon = $('refreshBtn').querySelector('i');
  icon.style.transform = 'rotate(360deg)';
  setTimeout(() => icon.style.transform = '', 600);
  showToast('Actualisé', 'success', 1500);
  navigate(state.view, state.params, false);
});

// Support bouton retour navigateur
window.addEventListener('popstate', () => {
  if (state.history.length > 0) {
    goBack();
  }
});
