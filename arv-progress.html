<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0F">
<title>ARVEXA — Mon cahier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN SIMPLE — focus révision
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg: #0F0F0F;
  --bg-card: #171717;
  --bg-block: #1C1C1C;
  --bg-input: #141414;
  --border: rgba(255, 255, 255, 0.07);
  --border-soft: rgba(255, 255, 255, 0.04);
  --accent: #C9A227;
  --accent-soft: rgba(201, 162, 39, 0.1);
  --text: #E8E6E0;
  --text-dim: #9A9A90;
  --text-muted: #666660;
  --text-body: #B8B8B0;
  --success: #4CAF7D;
  --danger: #E07856;
  --radius: 10px;
  --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html {
  background: var(--bg);
  color-scheme: dark;
  min-width: 320px;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 'Inter', system-ui, sans-serif;
  padding-top: var(--safe-top);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
button:disabled { cursor: not-allowed; opacity: 0.4; }

/* HEADER */
.header {
  position: sticky; top: 0; flex-shrink: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  min-height: 56px;
}
.header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: transparent;
  color: var(--text-dim); font-size: 14px; flex-shrink: 0;
}
.back-btn:hover { color: var(--accent); border-color: var(--accent); }
.back-btn.hidden { display: none; }

.page-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 600;
  color: var(--text); min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.page-title i { color: var(--accent); font-size: 14px; }

.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.icon-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: transparent;
  color: var(--text-dim); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent); }

main {
  flex: 1 1 auto; width: 100%; max-width: 780px;
  margin: 0 auto; padding: 20px 16px 60px;
}

.view { display: none; }
.view.active { display: block; }

/* GREETING */
.greeting { margin-bottom: 22px; }
.greeting h1 {
  font-family: 'Playfair Display', serif;
  font-size: 26px; font-weight: 700;
  color: var(--text); line-height: 1.2;
  margin-bottom: 6px;
}
.greeting h1 em { color: var(--accent); font-style: normal; }
.greeting p { color: var(--text-dim); font-size: 14px; }

/* STREAK */
.streak-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border);
  margin-bottom: 22px;
}
.streak-icon { font-size: 20px; color: var(--accent); }
.streak-content { flex: 1; }
.streak-value { font-size: 15px; font-weight: 600; color: var(--text); }
.streak-label { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

/* SECTION TITLES */
.section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 26px 0 12px;
}
.section-title .count {
  margin-left: auto; color: var(--text-muted);
  font-size: 11.5px; font-weight: 500;
  text-transform: none; letter-spacing: 0;
}

/* SUBJECTS GRID */
.subjects-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
}
@media (min-width: 620px) { .subjects-grid { grid-template-columns: repeat(3, 1fr); } }

.subject-card {
  padding: 16px 14px; border-radius: var(--radius);
  background: var(--bg-card); border: 1px solid var(--border);
  cursor: pointer; transition: border-color 0.15s;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left; width: 100%;
}
.subject-card:hover { border-color: var(--accent); }
.subject-card .subject-emoji { font-size: 22px; line-height: 1; }
.subject-card .subject-name { font-size: 14px; font-weight: 600; color: var(--text); }
.subject-card .subject-meta { font-size: 12px; color: var(--text-dim); }

/* LIST ITEMS */
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius);
  background: var(--bg-card); border: 1px solid var(--border);
  cursor: pointer; transition: border-color 0.15s;
  text-align: left; width: 100%;
}
.list-item:hover { border-color: var(--accent); }

.list-item-icon {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
  background: var(--accent-soft);
  color: var(--accent);
}
.list-item-body { flex: 1; min-width: 0; }
.list-item-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 3px; line-height: 1.3;
}
.list-item-meta {
  font-size: 12px; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.list-item-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
.list-item-arrow { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }

.list-item.new {
  background: transparent;
  border: 1px dashed var(--border);
  justify-content: center; color: var(--text-dim);
  font-weight: 500; font-size: 13.5px;
  gap: 8px;
}
.list-item.new:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
.list-item.new .list-item-icon { background: transparent; color: inherit; }

/* PAGE HERO */
.page-hero {
  padding: 18px 18px; border-radius: var(--radius);
  background: var(--bg-card); border: 1px solid var(--border);
  margin-bottom: 18px;
}
.page-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 700;
  color: var(--text); margin-bottom: 4px;
}
.page-hero .hero-sub { color: var(--text-dim); font-size: 13px; }

/* CTA */
.cta-card {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px 18px; border-radius: var(--radius);
  background: var(--accent);
  color: #0F0F0F;
  font-weight: 600; font-size: 14px;
  border: none; margin-bottom: 18px;
}
.cta-card:hover { opacity: 0.9; }
.cta-card i { font-size: 13px; }

/* SECTION HERO (vue section) */
.section-hero { margin-bottom: 20px; }
.section-hero .breadcrumb {
  font-size: 12px; color: var(--text-muted); margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.section-hero .breadcrumb .sep { opacity: 0.5; }
.section-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 700;
  color: var(--text); line-height: 1.2;
  margin-bottom: 4px;
}
.section-hero .sub { font-size: 12.5px; color: var(--text-muted); }

/* CONTENT SECTIONS */
.content-section { margin-bottom: 22px; }
.content-section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.content-section-title i { color: var(--accent); font-size: 12px; }
.content-section-title .count {
  margin-left: auto; color: var(--text-muted);
  font-weight: 500; text-transform: none; letter-spacing: 0;
}

/* RAW INPUT */
.raw-input {
  padding: 14px 16px; border-radius: var(--radius);
  background: var(--bg-input); border: 1px solid var(--border);
  font-size: 13.5px; color: var(--text-body); line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
  max-height: 200px; overflow: hidden; position: relative;
}
.raw-input.expanded { max-height: none; }

.expand-btn {
  margin-top: 8px; padding: 6px 12px; border-radius: 20px;
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.expand-btn:hover { color: var(--accent); border-color: var(--accent); }

/* BLOCKS — design simple */
.block {
  padding: 14px 16px; border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border);
  margin-bottom: 10px;
}
.block-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 10px;
}
.block-head i { color: var(--accent); font-size: 11px; }
.block-body { font-size: 14.5px; color: var(--text-body); line-height: 1.65; }

/* LISTES SIMPLES */
.simple-list {
  list-style: none; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.simple-list li {
  display: flex; gap: 10px;
  font-size: 14.5px; color: var(--text-body); line-height: 1.55;
}
.simple-list li .num {
  color: var(--accent); font-weight: 600;
  flex-shrink: 0; min-width: 18px;
}

/* FORMULES */
.formula-block {
  padding: 14px 12px; text-align: center;
  background: var(--bg-block); border-radius: var(--radius-sm);
  margin-bottom: 8px; overflow-x: auto;
}
.formula-block:last-child { margin-bottom: 0; }
.formula-condition {
  font-size: 11.5px; color: var(--text-muted);
  margin-top: 6px; font-style: italic;
}

/* METHODE */
.method-list { list-style: none; padding: 0; counter-reset: m; }
.method-list li {
  position: relative; padding-left: 26px; counter-increment: m;
  font-size: 14px; color: var(--text-body); line-height: 1.6; margin-bottom: 8px;
}
.method-list li:last-child { margin-bottom: 0; }
.method-list li::before {
  content: counter(m); position: absolute; left: 0; top: 0;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* EXEMPLE */
.example-enonce {
  padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--bg-block); font-size: 14px;
  color: var(--text); line-height: 1.55; margin-bottom: 10px;
}
.example-steps { list-style: none; padding: 0; counter-reset: e; }
.example-steps li {
  position: relative; padding-left: 24px; counter-increment: e;
  font-size: 14px; color: var(--text-body); line-height: 1.6; margin-bottom: 6px;
}
.example-steps li::before {
  content: counter(e) '.'; position: absolute; left: 0; top: 0;
  color: var(--accent); font-weight: 600;
}
.example-result {
  padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--accent-soft); font-size: 14px;
  color: var(--accent); font-weight: 500; margin-top: 8px;
}

/* PIEGE */
.trap-text { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 6px; }
.trap-solution {
  padding-left: 16px; position: relative;
  font-size: 13.5px; color: var(--success); line-height: 1.55;
}
.trap-solution::before { content: '→'; position: absolute; left: 0; top: 0; }

/* Q/R */
.qa-list { display: flex; flex-direction: column; gap: 8px; }
.qa-item {
  border-radius: var(--radius); background: var(--bg-card);
  border: 1px solid var(--border); overflow: hidden;
}
.qa-item.open { border-color: var(--accent); }
.qa-question {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; cursor: pointer;
}
.qa-q-icon {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.qa-q-text { flex: 1; font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.5; }
.qa-toggle { color: var(--text-muted); font-size: 11px; flex-shrink: 0; margin-top: 3px; }
.qa-item.open .qa-toggle { color: var(--accent); }
.qa-answer {
  max-height: 0; overflow: hidden;
  transition: max-height 0.25s ease;
}
.qa-item.open .qa-answer { max-height: 3000px; }
.qa-answer-inner {
  padding: 12px 14px 14px; border-top: 1px solid var(--border);
}
.qa-answer-label {
  font-size: 10.5px; font-weight: 600; color: var(--success);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.qa-answer-text { font-size: 14px; color: var(--text-body); line-height: 1.65; }
.qa-source {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-size: 11.5px; color: var(--text-muted);
  font-style: italic; line-height: 1.5;
}

/* NOTES */
.notes-area {
  width: 100%; min-height: 100px;
  padding: 12px 14px; border-radius: var(--radius);
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text); font-family: inherit;
  font-size: 14px; line-height: 1.6; resize: vertical; outline: none;
}
.notes-area:focus { border-color: var(--accent); }
.notes-area::placeholder { color: var(--text-muted); }
.notes-status {
  font-size: 11px; color: var(--text-muted);
  text-align: right; margin-top: 5px; min-height: 14px;
}
.notes-status.saved { color: var(--success); }

/* LOADING */
.loading-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 60px 20px;
}
.loading-spinner {
  width: 26px; height: 26px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state p { font-size: 13px; color: var(--text-muted); }

/* EMPTY */
.empty-state {
  text-align: center; padding: 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-state .icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--bg-card); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: var(--text-muted);
}
.empty-state h3 {
  font-size: 15px; font-weight: 600; color: var(--text);
}
.empty-state p { font-size: 13px; color: var(--text-dim); max-width: 320px; line-height: 1.55; }

/* MODALES */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, 0.85);
}
.modal-backdrop.show { display: flex; }

.modal {
  width: 100%; max-width: 640px; max-height: 92vh;
  background: #141414;
  border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  padding: 20px 18px;
  padding-bottom: calc(20px + var(--safe-bottom));
  overflow-y: auto; position: relative;
}
.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { color: var(--text); }

.modal-head { text-align: center; margin-bottom: 18px; padding: 0 26px; }
.modal-head h2 {
  font-family: 'Playfair Display', serif;
  font-size: 19px; font-weight: 700;
  color: var(--text); margin-bottom: 4px;
}
.modal-head p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

/* FORM */
.form-field { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 11.5px; font-weight: 600;
  color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 6px;
}
.form-input, .form-textarea {
  width: 100%; padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-input); color: var(--text);
  font-size: 14px; font-family: inherit; outline: none;
  resize: vertical;
}
.form-input:focus, .form-textarea:focus { border-color: var(--accent); }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
.form-textarea { min-height: 160px; line-height: 1.6; }

.char-counter {
  text-align: right; font-size: 11px;
  color: var(--text-muted); margin-top: 4px;
}

/* BARRE DE SYMBOLES MATHÉMATIQUES */
.symbols-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  max-height: 96px;
  overflow-y: auto;
}
.symbols-group {
  display: flex;
  gap: 2px;
  padding-right: 6px;
  border-right: 1px solid var(--border);
  align-items: center;
}
.symbols-group:last-child { border-right: none; padding-right: 0; }
.symbol-btn {
  min-width: 30px;
  height: 30px;
  padding: 0 6px;
  border-radius: 6px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-body);
  font-size: 14px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
}
.symbol-btn:hover {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
.symbol-btn:active { transform: scale(0.95); }

/* BOUTONS */
.btn-full {
  width: 100%; min-height: 44px;
  padding: 12px 18px; border-radius: var(--radius-sm);
  border: none; font-size: 14px; font-weight: 600;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
}
.btn-full.primary { background: var(--accent); color: #0F0F0F; }
.btn-full.primary:hover:not(:disabled) { opacity: 0.9; }
.btn-full.secondary {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim);
}
.btn-full.secondary:hover { color: var(--accent); border-color: var(--accent); }

.btn-full .spinner {
  display: none; width: 14px; height: 14px;
  border: 2px solid rgba(15, 15, 15, 0.3);
  border-top-color: #0F0F0F; border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.btn-full.loading .spinner { display: block; }
.btn-full.loading .btn-text, .btn-full.loading .btn-icon { display: none; }

/* TOASTS */
.toast-container {
  position: fixed; top: calc(var(--safe-top) + 14px); left: 50%;
  transform: translateX(-50%); z-index: 9999;
  width: calc(100% - 32px); max-width: 400px;
  display: flex; flex-direction: column; gap: 6px;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; border-radius: var(--radius-sm);
  background: #1A1A1A;
  border: 1px solid var(--border);
  color: var(--text); font-size: 13px;
  pointer-events: auto;
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast i { font-size: 14px; flex-shrink: 0; }
.toast.success i { color: var(--success); }

const $ = (id) => document.getElementById(id);

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

function safeText(text) {
  return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let katexAttempts = 0;
function renderKaTeX(root) {
  if (!root) return;
  if (window.KaTeXUtils?.renderMath) { window.KaTeXUtils.renderMath(root); return; }
  if (typeof renderMathInElement !== 'function') {
    if (katexAttempts++ < 20) setTimeout(() => renderKaTeX(root), 200);
    return;
  }
  katexAttempts = 0;
  try {
    renderMathInElement(root, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false, errorColor: '#E07856', strict: false, trust: true
    });
  } catch (_) {}
}

function showToast(message, type = 'info', duration = 2800) {
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(message)}</span>`;
  $('toastContainer').appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 200);
  }, duration);
}

function showLoadingState(el, text = 'Chargement...') {
  el.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><p>${escapeHtml(text)}</p></div>`;
}

function showEmptyState(el, icon, title, message) {

function getGreeting() {

  if (h >= 5 && h < 12) return 'Bonjour';
  if (h >= 12 && h < 18) return 'Bon après-midi';
  return 'Bonsoir';
}

function getFirstName() {

}

// ═══════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════
async function callApi(action, params = {}) {
  if (!state.user) throw new Error('Non authentifié.');
  const token = await getIdToken(state.user);
  const response = await fetch('/api/progress', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ action, ...params })
  });
  const data = await response.json().catch(() => null);
  if (!response.ok || !data?.success) {
    const err = new Error(data?.error || `Erreur ${response.status}`);
    err.code = data?.code;
    err.status = response.status;
    throw err;
  }
  return data;
}

// ═══════════════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════════════
function routeFromHash() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  if (!hash) return { view: 'notebooks', params: {} };
  const parts = hash.split('/').filter(Boolean);
  switch (parts[0]) {
    case 'notebooks': return { view: 'notebooks', params: {} };
    case 'notebook': return { view: 'notebook', params: { subject: parts[1] } };
    case 'chapter': return { view: 'chapter', params: { subject: parts[1], chapterId: parts[2] } };
    case 'section': return { view: 'section', params: { subject: parts[1], chapterId: parts[2], sectionId: parts[3] } };
    case 'lesson': return { view: 'lesson', params: { subject: parts[1], chapterId: parts[2] } };
    default: return { view: 'notebooks', params: {} };
  }
}

function hashFromRoute(view, params) {
  switch (view) {
    case 'notebooks': return '#/notebooks';
    case 'notebook': return `#/notebook/${params.subject}`;
    case 'chapter': return `#/chapter/${params.subject}/${params.chapterId}`;
    case 'section': return `#/section/${params.subject}/${params.chapterId}/${params.sectionId}`;
    case 'lesson': return `#/lesson/${params.subject}/${params.chapterId}`;
    default: return '#/notebooks';
  }
}

function navigate(view, params = {}, replace = false) {
  const hash = hashFromRoute(view, params);
  if (replace) window.history.replaceState(null, '', hash);
  else window.history.pushState(null, '', hash);
  applyRoute({ view, params });
}

function applyRoute(route) {
  state.view = route.view;
  state.params = route.params || {};

  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  const target = $(`view-${route.view}`);
  if (target) target.classList.add('active');

  updateHeader();
  updateBackButton();

  switch (route.view) {
    case 'notebooks': renderNotebooksView(); break;
    case 'notebook': renderNotebookView(route.params); break;
    case 'chapter': renderChapterView(route.params); break;
    case 'section': renderSectionView(route.params); break;
    case 'lesson': renderLessonView(route.params); break;
  }
  window.scrollTo({ top: 0 });
}

function updateHeader() {
  const map = {
    notebooks: 'Mon cahier',
    notebook: SUBJECTS[state.params.subject]?.label || 'Cahier',
    chapter: 'Chapitre',
    section: 'Section',
    lesson: 'Leçon'
  };
  $('pageTitleText').textContent = map[state.view] || 'Mon cahier';
}

function updateBackButton() {
  $('backBtn').classList.toggle('hidden', state.view === 'notebooks');
}

window.addEventListener('hashchange', () => applyRoute(routeFromHash()));

// ═══════════════════════════════════════════════════════════════
// VUE 1 — MES CAHIERS
// ═══════════════════════════════════════════════════════════════
async function renderNotebooksView() {
  const el = $('view-notebooks');
  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('getDashboard');
    state.cache.dashboard = data;

    const totalSections = data.summary.totalSections || 0;
    const totalChapters = data.summary.totalChapters || 0;
    const streak = data.streak || { current: 0 };

    const subjectCards = ALL_SUBJECT_KEYS.map((key) => {
      const info = SUBJECTS[key];
      const active = (data.subjects || []).find((s) => s.key === key);
      const sectionsCount = active ? active.sectionsCount : 0;
      const last = active ? active.last : '';

      return `
        <button class="subject-card" data-subject="${key}">
          <div class="subject-emoji">${info.emoji}</div>
          <div class="subject-name">${escapeHtml(info.label)}</div>
          <div class="subject-meta">
            ${sectionsCount > 0
              ? `${sectionsCount} section${sectionsCount > 1 ? 's' : ''}${last ? ' · ' + last : ''}`
              : 'Vide'}
          </div>
        </button>
      `;
    }).join('');

    const activityHtml = (data.recentActivity || []).length > 0
      ? `
        <div class="section-title">Récent</div>
        <div class="list">
          ${data.recentActivity.map((a) => `
            <button class="list-item" data-subject="${a.subject}" data-chapter="${escapeHtml(a.chapterId)}">
              <div class="list-item-icon"><i class="fas fa-book"></i></div>
              <div class="list-item-body">
                <div class="list-item-title">${escapeHtml(a.chapterTitle)}</div>
                <div class="list-item-meta">
                  <span>${escapeHtml(a.subjectLabel)}</span>
                  <span class="dot"></span>
                  <span>${escapeHtml(a.time)}</span>
                </div>
              </div>
              <div class="list-item-arrow"><i class="fas fa-chevron-right"></i></div>
            </button>
          `).join('')}
        </div>
      `
      : '';

    el.innerHTML = `
      <div class="greeting">
        <h1>${getGreeting()}, <em>${escapeHtml(getFirstName())}</em></h1>
        <p>${totalSections > 0 ? 'Continue ta révision.' : 'Commence ton premier cahier.'}</p>
      </div>

      <div class="streak-bar">
        <i class="fas fa-fire streak-icon"></i>
        <div class="streak-content">
          <div class="streak-value">${streak.current} jour${streak.current > 1 ? 's' : ''} d'affilée</div>
          <div class="streak-label">${totalSections} section${totalSections > 1 ? 's' : ''} · ${totalChapters} chapitre${totalChapters > 1 ? 's' : ''}</div>
        </div>
      </div>

      <div class="section-title">Mes matières</div>
      <div class="subjects-grid">${subjectCards}</div>

      ${activityHtml}
    `;

    el.querySelectorAll('[data-subject]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const subject = btn.dataset.subject;
        const chapter = btn.dataset.chapter;
        if (chapter) navigate('chapter', { subject, chapterId: chapter });
        else navigate('notebook', { subject });
      });
    });

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Impossible de charger', err.message || 'Erreur réseau.');
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 2 — CHAPITRES D'UNE MATIÈRE
// ═══════════════════════════════════════════════════════════════
async function renderNotebookView(params) {
  const el = $('view-notebook');
  const subject = params.subject;
  const info = SUBJECTS[subject];
  if (!info) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('listChapters', { subject });
    const chapters = data.chapters || [];
    const totalSections = chapters.reduce((s, c) => s + (c.sectionsCount || 0), 0);

    const listHtml = chapters.length === 0
      ? `<div class="empty-state" style="padding:30px 20px;">
           <div class="icon"><i class="fas fa-book"></i></div>
           <h3>Aucun chapitre</h3>
           <p>Crée ton premier chapitre.</p>
         </div>`
      : chapters.map((c) => `
          <button class="list-item" data-chapter="${escapeHtml(c.id)}">
            <div class="list-item-icon"><i class="fas fa-book"></i></div>
            <div class="list-item-body">
              <div class="list-item-title">${escapeHtml(c.title)}</div>
              <div class="list-item-meta">
                <span>${c.sectionsCount} section${c.sectionsCount > 1 ? 's' : ''}</span>
                <span class="dot"></span>
                <span>${escapeHtml(c.last)}</span>
              </div>
            </div>
            <div class="list-item-arrow"><i class="fas fa-chevron-right"></i></div>
          </button>
        `).join('');

    el.innerHTML = `
      <div class="page-hero">
        <h1>${info.emoji} ${escapeHtml(info.label)}</h1>
        <div class="hero-sub">${totalSections} section${totalSections > 1 ? 's' : ''} · ${chapters.length} chapitre${chapters.length > 1 ? 's' : ''}</div>
      </div>

      <div class="section-title">Chapitres <span class="count">${chapters.length}</span></div>

      <div class="list">
        ${listHtml}
        <button class="list-item new" id="newChapterBtn">
          <i class="fas fa-plus"></i>
          <span>Nouveau chapitre</span>
        </button>
      </div>
    `;

    el.querySelectorAll('[data-chapter]').forEach((btn) => {
      btn.addEventListener('click', () => navigate('chapter', { subject, chapterId: btn.dataset.chapter }));
    });

    $('newChapterBtn')?.addEventListener('click', () => openNewChapterModal(subject));

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 3 — SECTIONS D'UN CHAPITRE
// ═══════════════════════════════════════════════════════════════
async function renderChapterView(params) {
  const el = $('view-chapter');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('getChapter', { subject, chapterId });
    state.cache.chapter[`${subject}/${chapterId}`] = data;
    const ch = data.chapter;
    const sections = data.sections || [];

    const listHtml = sections.length === 0
      ? `<div class="empty-state" style="padding:30px 20px;">
           <div class="icon"><i class="fas fa-file-lines"></i></div>
           <h3>Aucune section</h3>
           <p>Ajoute la première partie que tu as étudiée.</p>
         </div>`
      : sections.map((s, idx) => `
          <button class="list-item" data-section="${escapeHtml(s.id)}">
            <div class="list-item-icon"><i class="fas fa-check"></i></div>
            <div class="list-item-body">
              <div class="list-item-title">${idx + 1}. ${escapeHtml(s.title)}</div>
              <div class="list-item-meta">
                ${s.questionsCount > 0 ? `<span>${s.questionsCount} Q/R</span><span class="dot"></span>` : ''}
                ${s.exercisesCount > 0 ? `<span>${s.exercisesCount} exo${s.exercisesCount > 1 ? 's' : ''}</span><span class="dot"></span>` : ''}
                <span>${escapeHtml(s.time)}</span>
              </div>
            </div>
            <div class="list-item-arrow"><i class="fas fa-chevron-right"></i></div>
          </button>
        `).join('');

    el.innerHTML = `
      <div class="page-hero">
        <div class="hero-sub" style="margin-bottom:6px;">${info.emoji} ${escapeHtml(info.label)}</div>
        <h1>${escapeHtml(ch.title)}</h1>
        <div class="hero-sub">${sections.length} section${sections.length > 1 ? 's' : ''}</div>
      </div>

      ${sections.length > 0 ? `
        <button class="cta-card" id="viewLessonBtn">
          <i class="fas fa-book-reader"></i>
          <span>Voir la leçon complète</span>
        </button>
      ` : ''}

      <div class="section-title">Sections <span class="count">${sections.length}</span></div>

      <div class="list">
        ${listHtml}
        <button class="list-item new" id="addSectionBtn">
          <i class="fas fa-plus"></i>
          <span>Ajouter une section</span>
        </button>
      </div>
    `;

    el.querySelectorAll('[data-section]').forEach((btn) => {
      btn.addEventListener('click', () => navigate('section', { subject, chapterId, sectionId: btn.dataset.section }));
    });

    $('viewLessonBtn')?.addEventListener('click', () => navigate('lesson', { subject, chapterId }));
    $('addSectionBtn')?.addEventListener('click', () => openAddSectionModal(subject, chapterId));

  } catch (err) {
    if (err.status === 404) showEmptyState(el, 'fa-book', 'Chapitre introuvable', 'Ce chapitre n\'existe plus.');
    else showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 4 — SECTION DÉTAILLÉE
// ═══════════════════════════════════════════════════════════════
async function renderSectionView(params) {
  const el = $('view-section');
  const { subject, chapterId, sectionId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId || !sectionId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('getSection', { subject, chapterId, sectionId });
    const s = data.section;
    const a = s.analysis || {};
    const chapterTitle = state.cache.chapter[`${subject}/${chapterId}`]?.chapter?.title || '';

    let blocksHtml = '';

    if (a.summary) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-align-left"></i>Résumé</div><div class="block-body">${safeText(a.summary)}</div></div>`;
    }

    if (Array.isArray(a.keyIdeas) && a.keyIdeas.length > 0) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-lightbulb"></i>Idées clés</div><ul class="simple-list">
        ${a.keyIdeas.map((x, i) => `<li><span class="num">${i + 1}.</span><span>${safeText(x)}</span></li>`).join('')}
      </ul></div>`;
    }

    if (Array.isArray(a.definitions) && a.definitions.length > 0) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-book"></i>Définitions</div><ul class="simple-list">
        ${a.definitions.map((d, i) => `<li><span class="num">${i + 1}.</span><span><strong style="color:var(--text)">${safeText(d.term)}</strong> — ${safeText(d.definition)}</span></li>`).join('')}
      </ul></div>`;
    }

    if (Array.isArray(a.formulas) && a.formulas.length > 0) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-square-root-variable"></i>Formules clés</div>
        ${a.formulas.map((f) => `<div class="formula-block"><div>$$${safeText(f.latex)}$$</div>${f.condition ? `<div class="formula-condition">${safeText(f.condition)}</div>` : ''}</div>`).join('')}
      </div>`;
    }

    if (Array.isArray(a.method) && a.method.length > 0) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-list-ol"></i>Méthode</div><ol class="method-list">
        ${a.method.map((m) => `<li>${safeText(m)}</li>`).join('')}
      </ol></div>`;
    }

    if (Array.isArray(a.arguments) && a.arguments.length > 0) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-scale-balanced"></i>Arguments</div>
        ${a.arguments.map((arg) => `
          <div style="margin-bottom:10px;">
            <div style="font-weight:600; color:var(--text); margin-bottom:6px;">${safeText(arg.thesis || '')}</div>
            <ul class="simple-list">${(arg.arguments || []).map((x, i) => `<li><span class="num">${i + 1}.</span><span>${safeText(x)}</span></li>`).join('')}</ul>
          </div>
        `).join('')}
      </div>`;
    }

    if (Array.isArray(a.dates) && a.dates.length > 0) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-calendar"></i>Dates</div><ul class="simple-list">
        ${a.dates.map((d, i) => `<li><span class="num">${i + 1}.</span><span><strong>${safeText(d.date)}</strong> — ${safeText(d.event)}</span></li>`).join('')}
      </ul></div>`;
    }

    if (Array.isArray(a.vocabulary) && a.vocabulary.length > 0) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-spell-check"></i>Vocabulaire</div><ul class="simple-list">
        ${a.vocabulary.map((v, i) => `<li><span class="num">${i + 1}.</span><span><strong>${safeText(v.term)}</strong> — ${safeText(v.meaning)}</span></li>`).join('')}
      </ul></div>`;
    }

    if (a.example && (a.example.enonce || a.example.steps)) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-check-circle"></i>Exemple guidé</div>
        ${a.example.enonce ? `<div class="example-enonce">${safeText(a.example.enonce)}</div>` : ''}
        ${Array.isArray(a.example.steps) && a.example.steps.length > 0 ? `<ol class="example-steps">${a.example.steps.map((st) => `<li>${safeText(st)}</li>`).join('')}</ol>` : ''}
        ${a.example.result ? `<div class="example-result">${safeText(a.example.result)}</div>` : ''}
      </div>`;
    }

    if (a.trap && (a.trap.text || a.trap.solution)) {
      blocksHtml += `<div class="block"><div class="block-head"><i class="fas fa-triangle-exclamation"></i>Piège du BAC</div>
        ${a.trap.text ? `<div class="trap-text">${safeText(a.trap.text)}</div>` : ''}
        ${a.trap.solution ? `<div class="trap-solution">${safeText(a.trap.solution)}</div>` : ''}
      </div>`;
    }

    let questionsHtml = '';
    if (Array.isArray(a.questions) && a.questions.length > 0) {
      questionsHtml = `
        <div class="content-section">
          <div class="content-section-title">
            <i class="fas fa-circle-question"></i>Questions probables
            <span class="count">${a.questions.length}</span>
          </div>
          <div class="qa-list">
            ${a.questions.map((q, i) => `
              <div class="qa-item" data-qa="${i}">
                <div class="qa-question">
                  <div class="qa-q-icon">Q${i + 1}</div>
                  <div class="qa-q-text">${safeText(q.q)}</div>
                  <div class="qa-toggle"><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="qa-answer">
                  <div class="qa-answer-inner">
                    <div class="qa-answer-label">Réponse</div>
                    <div class="qa-answer-text">${safeText(q.a)}</div>
                    ${q.source ? `<div class="qa-source"><strong>Source :</strong> ${safeText(q.source)}</div>` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    let exercisesHtml = '';
    if (Array.isArray(a.exercises) && a.exercises.length > 0) {
      exercisesHtml = `
        <div class="content-section">
          <div class="content-section-title">
            <i class="fas fa-pencil"></i>Exercices corrigés
            <span class="count">${a.exercises.length}</span>
          </div>
          <div class="qa-list">
            ${a.exercises.map((ex, i) => `
              <div class="qa-item" data-qa="ex-${i}">
                <div class="qa-question">
                  <div class="qa-q-icon">E${i + 1}</div>
                  <div class="qa-q-text">${safeText(ex.enonce)}</div>
                  <div class="qa-toggle"><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="qa-answer">
                  <div class="qa-answer-inner">
                    ${ex.indice ? `<div class="qa-answer-label" style="color:var(--text-dim)">Indice</div><div class="qa-answer-text" style="margin-bottom:10px;">${safeText(ex.indice)}</div>` : ''}
                    <div class="qa-answer-label">Correction</div>
                    ${ex.correction && Array.isArray(ex.correction.steps) ? `<ol class="example-steps" style="margin-top:8px;">${ex.correction.steps.map((st) => `<li>${safeText(st)}</li>`).join('')}</ol>` : ''}
                    ${ex.correction?.reponse ? `<div class="example-result" style="margin-top:10px;">${safeText(ex.correction.reponse)}</div>` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    el.innerHTML = `
      <div class="section-hero">
        <div class="breadcrumb">
          <span>${info.emoji} ${escapeHtml(info.label)}</span>
          ${chapterTitle ? `<span class="sep">›</span><span>${escapeHtml(chapterTitle)}</span>` : ''}
        </div>
        <h1>${escapeHtml(s.title)}</h1>
        <div class="sub">${escapeHtml(s.time || '')}</div>
      </div>

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-paste"></i>Ce que tu as collé</div>
        <div class="raw-input" id="rawInput">${safeText(s.rawInput)}</div>
        <button class="expand-btn" id="expandRawBtn">
          <i class="fas fa-chevron-down"></i>
          <span>Voir tout</span>
        </button>
      </div>

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-graduation-cap"></i>L'explication du prof</div>
        ${blocksHtml}
      </div>

      ${questionsHtml}
      ${exercisesHtml}

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-pen"></i>Mes notes</div>
        <textarea class="notes-area" id="notesArea" placeholder="Ajoute tes notes personnelles...">${escapeHtml(s.userNotes || '')}</textarea>
        <div class="notes-status" id="notesStatus"></div>
      </div>
    `;

    renderKaTeX(el);

    $('expandRawBtn')?.addEventListener('click', () => {
      const raw = $('rawInput');
      raw.classList.toggle('expanded');
      const span = $('expandRawBtn').querySelector('span');
      span.textContent = raw.classList.contains('expanded') ? 'Réduire' : 'Voir tout';
    });

    el.querySelectorAll('.qa-item').forEach((item) => {
      item.querySelector('.qa-question').addEventListener('click', () => {
        item.classList.toggle('open');
        if (item.classList.contains('open')) {
          setTimeout(() => renderKaTeX(item.querySelector('.qa-answer-inner')), 100);
        }
      });
    });

    let notesTimer = null;
    $('notesArea')?.addEventListener('input', () => {
      const status = $('notesStatus');
      status.textContent = 'Enregistrement...';
      clearTimeout(notesTimer);
      notesTimer = setTimeout(async () => {
        try {
          await callApi('updateNotes', { subject, chapterId, sectionId, userNotes: $('notesArea').value });
          status.textContent = 'Enregistré';
          status.className = 'notes-status saved';
          setTimeout(() => { status.textContent = ''; status.className = 'notes-status'; }, 2000);
        } catch (e) {
          status.textContent = 'Erreur';
          status.className = 'notes-status';
        }
      }, 1400);
    });

  } catch (err) {
    if (err.status === 404) showEmptyState(el, 'fa-file', 'Section introuvable', 'Cette section n\'existe plus.');
    else showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// VUE 5 — LEÇON COMPLÈTE
// ═══════════════════════════════════════════════════════════════
async function renderLessonView(params) {
  const el = $('view-lesson');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Assemblage...');

  try {
    const data = await callApi('getFullLesson', { subject, chapterId });
    const sections = data.sections || [];

    if (sections.length === 0) {
      showEmptyState(el, 'fa-book', 'Leçon vide', 'Aucune section.');
      return;
    }

    const sectionsHtml = sections.map((s, i) => {
      const a = s.analysis || {};
      let content = '';

      if (a.summary) content += `<div class="block"><div class="block-head"><i class="fas fa-align-left"></i>Résumé</div><div class="block-body">${safeText(a.summary)}</div></div>`;
      if (Array.isArray(a.keyIdeas) && a.keyIdeas.length > 0) {
        content += `<div class="block"><div class="block-head"><i class="fas fa-lightbulb"></i>Idées clés</div><ul class="simple-list">${a.keyIdeas.map((x, j) => `<li><span class="num">${j + 1}.</span><span>${safeText(x)}</span></li>`).join('')}</ul></div>`;
      }
      if (Array.isArray(a.formulas) && a.formulas.length > 0) {
        content += `<div class="block"><div class="block-head"><i class="fas fa-square-root-variable"></i>Formules</div>${a.formulas.map((f) => `<div class="formula-block"><div>$$${safeText(f.latex)}$$</div></div>`).join('')}</div>`;
      }
      if (Array.isArray(a.definitions) && a.definitions.length > 0) {
        content += `<div class="block"><div class="block-head"><i class="fas fa-book"></i>Définitions</div><ul class="simple-list">${a.definitions.map((d, j) => `<li><span class="num">${j + 1}.</span><span><strong>${safeText(d.term)}</strong> — ${safeText(d.definition)}</span></li>`).join('')}</ul></div>`;
      }
      if (s.userNotes && s.userNotes.trim()) {
        content += `<div class="block"><div class="block-head"><i class="fas fa-pen"></i>Mes notes</div><div class="block-body" style="white-space:pre-wrap;">${safeText(s.userNotes)}</div></div>`;
      }

      return `
        <div style="margin-bottom:28px;">
          <div style="font-size:11px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px;">Section ${i + 1}</div>
          <div style="font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--text); margin-bottom:14px;">${escapeHtml(s.title)}</div>
          ${content}
        </div>
      `;
    }).join('');

    el.innerHTML = `
      <div class="page-hero" style="text-align:center;">
        <div style="font-size:32px; margin-bottom:8px;">${info.emoji}</div>
        <div style="font-size:11px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px;">${escapeHtml(info.label)}</div>
        <h1 style="font-family:'Playfair Display',serif; font-size:24px; font-weight:700; color:var(--text); margin-bottom:6px;">${escapeHtml(data.chapter.title)}</h1>
        <div style="font-size:13px; color:var(--text-dim);">${sections.length} section${sections.length > 1 ? 's' : ''}</div>
      </div>
      ${sectionsHtml}
    `;

    renderKaTeX(el);

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

function closeModal() {
  $('modalBackdrop').classList.remove('show');
  $('modalBackdrop').innerHTML = '';
  document.body.style.overflow = '';
}

function openModal(html) {
  $('modalBackdrop').innerHTML = html;
  $('modalBackdrop').classList.add('show');
  document.body.style.overflow = 'hidden';

  $('modalBackdrop').querySelector('.modal-close')?.addEventListener('click', closeModal);
  $('modalBackdrop').addEventListener('click', (e) => {
    if (e.target === $('modalBackdrop')) closeModal();
  });
}

// Modale nouveau chapitre
function openNewChapterModal(subject) {
  const info = SUBJECTS[subject];

  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>Nouveau chapitre</h2>
        <p>${info.emoji} ${escapeHtml(info.label)}</p>
      </div>

      <div class="form-field">
        <label class="form-label">Titre du chapitre</label>
        <input type="text" class="form-input" id="newChapterTitle" placeholder="Ex : Nombres complexes" maxlength="100">
      </div>

      <button class="btn-full primary" id="createChapterBtn" disabled>
        <span class="btn-icon"><i class="fas fa-plus"></i></span>
        <span class="btn-text">Créer</span>
        <span class="spinner"></span>
      </button>
    </div>
  `);

  const input = $('newChapterTitle');
  const btn = $('createChapterBtn');

  input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });

  btn.addEventListener('click', async () => {
    const title = input.value.trim();
    if (title.length < 2) return;
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await callApi('createChapter', { subject, title });
      showToast('Chapitre créé', 'success');
      delete state.cache.chapters[subject];
      closeModal();
      applyRoute({ view: 'notebook', params: { subject } });
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });

  setTimeout(() => input.focus(), 200);
}

// Modale ajouter une section
function openAddSectionModal(subject, chapterId) {
  const info = SUBJECTS[subject];

  // Construction de la barre de symboles
  const symbolsHtml = SYMBOL_GROUPS.map((group) =>
    `<div class="symbols-group">${group.map((sym) =>
      `<button type="button" class="symbol-btn" data-symbol="${escapeHtml(sym)}">${sym}</button>`
    ).join('')}</div>`
  ).join('');

  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>Ajouter une section</h2>
        <p>${info.emoji} ${escapeHtml(info.label)} — Colle la partie étudiée</p>
      </div>

      <div class="form-field">
        <label class="form-label">Barre de symboles</label>
        <div class="symbols-bar" id="symbolsBar">${symbolsHtml}</div>
      </div>

      <div class="form-field">
        <label class="form-label">Contenu du cours</label>
        <textarea class="form-textarea" id="sectionBody" placeholder="Colle ici la partie du cours que tu viens d'étudier..." maxlength="${MAX_CONTENT_LENGTH}"></textarea>
        <div class="char-counter" id="sectionCounter">0 / ${MAX_CONTENT_LENGTH}</div>
      </div>

      <p style="font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:14px;">
        💡 Tape normalement, sans te soucier des formules. L'IA convertira automatiquement <code>i²</code> en <code>$i^2$</code>, <code>racine de a²+b²</code> en <code>$\\sqrt{a^2+b^2}$</code>, etc.
      </p>

      <button class="btn-full primary" id="sectionSubmitBtn" disabled>
        <span class="btn-icon"><i class="fas fa-wand-magic-sparkles"></i></span>
        <span class="btn-text">Analyser avec l'IA</span>
        <span class="spinner"></span>
      </button>
    </div>
  `);

  const body = $('sectionBody');
  const counter = $('sectionCounter');
  const submitBtn = $('sectionSubmitBtn');

  function updateReady() {
    const len = body.value.trim().length;
    submitBtn.disabled = len < MIN_CONTENT_LENGTH;
    counter.textContent = `${body.value.length} / ${MAX_CONTENT_LENGTH}`;
  }

  body.addEventListener('input', updateReady);

  // Insertion des symboles au curseur
  document.querySelectorAll('.symbol-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const symbol = btn.dataset.symbol;
      const start = body.selectionStart || 0;
      const end = body.selectionEnd || 0;
      const value = body.value;
      body.value = value.slice(0, start) + symbol + value.slice(end);
      const newPos = start + symbol.length;
      body.setSelectionRange(newPos, newPos);
      body.focus();
      updateReady();
    });
  });

  submitBtn.addEventListener('click', async () => {
    const rawInput = body.value.trim();
    if (rawInput.length < MIN_CONTENT_LENGTH) {
      showToast(`Contenu trop court (min ${MIN_CONTENT_LENGTH} caractères)`, 'error');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    try {
      const result = await callApi('createSection', { subject, chapterId, rawInput });
      showToast('Section analysée', 'success');
      delete state.cache.chapter[`${subject}/${chapterId}`];
      closeModal();
      applyRoute({ view: 'section', params: { subject, chapterId, sectionId: result.sectionId } });
    } catch (e) {
      if (e.code === 'FREE_SECTION_LIMIT') showToast('Limite gratuite atteinte.', 'error', 5000);
      else showToast('Erreur : ' + e.message, 'error', 5000);
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
    }
  });

  setTimeout(() => body.focus(), 200);
}

function isUserPremium(data) {
  if (!data) return false;
  const active = data.premium === true || data.isUnlocked === true || data.hasDeposited === true;
  if (!active) return false;
  const end = data.subscriptionEndDate?.toDate?.() ||
    (data.subscriptionEndDate?.seconds ? new Date(data.subscriptionEndDate.seconds * 1000) : null);
  return !end || end.getTime() > Date.now();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  state.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      state.userData = snap.data();
      state.isPremium = isUserPremium(state.userData);
    }
  } catch (_) {}

  applyRoute(routeFromHash());

  if (!window.location.hash) {
    window.history.replaceState(null, '', '#/notebooks');
  }
});
