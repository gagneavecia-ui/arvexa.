<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARV-PROGRESS — Apprends, mémorise, teste ton niveau">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="katex-utils.js" defer></script>
  <script src="register-sw.js" defer></script>

  <style>
    /* ═══════════════════════════════════════════════════════════
       ROOT — Design tokens ARVEXA
       ═══════════════════════════════════════════════════════════ */
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --accent-dim: rgba(184, 134, 11, 0.08);

      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #B85C3A;
      --danger-light: #E07A5F;
      --warning: #D4A017;
      --warning-light: #E8C158;
      --info: #4AAFE0;
      --purple: #9B59B6;

      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --bg-input: rgba(0, 0, 0, 0.3);

      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --text-body: #cfd0cc;

      --border-soft: rgba(255, 255, 255, 0.05);
      --border-strong: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(184, 134, 11, 0.15);

      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-fast: all 0.15s ease;

      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 20px;

      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);

      --font-body: 'Inter', system-ui, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html {
      background: var(--bg-dark);
      color-scheme: dark;
      min-width: 320px;
      width: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      color: var(--text-light);
      font: 15px/1.6 var(--font-body);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    /* ═══════════════════════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════════════════════ */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + var(--safe-top)) 16px 12px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-soft);
      gap: 12px;
      min-height: 60px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
      font-size: 15px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .back-btn:hover {
      border-color: rgba(184, 134, 11, 0.3);
      color: var(--accent-bright);
    }
    .page-title {
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-serif);
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-title i { color: var(--accent-bright); font-size: 14px; }

    .header-right { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      border-color: rgba(184, 134, 11, 0.3);
      color: var(--accent-bright);
    }

    /* ═══════════════════════════════════════════════════════════
       CONTAINER
       ═══════════════════════════════════════════════════════════ */
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px 100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ═══════════════════════════════════════════════════════════
       HERO CARD — Streak + CTA
       ═══════════════════════════════════════════════════════════ */
    .hero-card {
      padding: 24px 22px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(224, 184, 74, 0.08), rgba(26, 58, 42, 0.06));
      border: 1px solid rgba(184, 134, 11, 0.18);
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .hero-greeting {
      flex: 1;
      min-width: 0;
    }
    .hero-greeting h1 {
      font-family: var(--font-serif);
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
      color: var(--text-light);
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .hero-greeting h1 em {
      color: var(--accent-bright);
      font-style: italic;
    }
    .hero-greeting p {
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.6;
    }

    .streak-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(224, 184, 74, 0.2);
      flex-shrink: 0;
      min-width: 90px;
    }
    .streak-badge .streak-icon { font-size: 22px; line-height: 1; }
    .streak-badge .streak-value {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-bright);
      line-height: 1;
    }
    .streak-badge .streak-label {
      font-size: 9.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      margin-top: 2px;
    }

    .hero-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 22px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-weight: 800;
      font-size: 15px;
      border: none;
      transition: var(--transition);
      box-shadow: 0 6px 20px rgba(184, 134, 11, 0.25);
      font-family: inherit;
    }
    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(184, 134, 11, 0.4);
    }
    .hero-cta i { font-size: 14px; }

    /* ═══════════════════════════════════════════════════════════
       STATS GRID
       ═══════════════════════════════════════════════════════════ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 520px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    }

    .stat-card {
      padding: 14px 12px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      text-align: center;
      transition: var(--transition);
    }
    .stat-card:hover {
      border-color: rgba(224, 184, 74, 0.2);
      transform: translateY(-2px);
    }
    .stat-icon {
      font-size: 18px;
      margin-bottom: 4px;
      line-height: 1;
    }
    .stat-icon.green { color: var(--success-light); }
    .stat-icon.gold { color: var(--accent-bright); }
    .stat-icon.blue { color: var(--info); }
    .stat-icon.purple { color: #b07cd0; }

    .stat-value {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-light);
      line-height: 1.1;
      margin-bottom: 2px;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    /* ═══════════════════════════════════════════════════════════
       SECTION TITLE
       ═══════════════════════════════════════════════════════════ */
    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      color: var(--text-light);
      margin-top: 6px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }
    .section-label::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0;
      width: 40px;
      height: 2px;
      background: var(--accent-bright);
    }
    .section-label i { color: var(--accent-bright); font-size: 15px; }
    .section-label .count {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      margin-left: auto;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ═══════════════════════════════════════════════════════════
       À FAIRE MAINTENANT
       ═══════════════════════════════════════════════════════════ */
    .todo-list { display: flex; flex-direction: column; gap: 10px; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .todo-item:hover {
      border-color: rgba(224, 184, 74, 0.3);
      transform: translateX(3px);
    }
    .todo-item.surprise {
      background: linear-gradient(135deg, rgba(224, 184, 74, 0.1), rgba(224, 184, 74, 0.03));
      border-color: rgba(224, 184, 74, 0.25);
    }
    .todo-item.surprise::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent-bright), var(--accent));
    }

    .todo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: rgba(224, 184, 74, 0.1);
      color: var(--accent-bright);
      border: 1px solid rgba(224, 184, 74, 0.15);
    }
    .todo-icon.maths { background: rgba(224, 184, 74, 0.12); color: #E0B84A; }
    .todo-icon.physique { background: rgba(74, 175, 224, 0.12); color: #4AAFE0; }
    .todo-icon.chimie { background: rgba(224, 122, 74, 0.12); color: #E07A4A; }
    .todo-icon.svt { background: rgba(122, 224, 74, 0.12); color: #7AE04A; }
    .todo-icon.surprise { background: rgba(184, 134, 11, 0.15); color: var(--accent-bright); }

    .todo-content { flex: 1; min-width: 0; }
    .todo-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .todo-meta {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .todo-meta .duration {
      color: var(--accent-bright);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .todo-arrow {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: var(--transition);
    }
    .todo-item:hover .todo-arrow {
      color: var(--accent-bright);
      background: rgba(184, 134, 11, 0.08);
      transform: translateX(2px);
    }

    /* ═══════════════════════════════════════════════════════════
       COURS RÉCENTS
       ═══════════════════════════════════════════════════════════ */
    .courses-list { display: flex; flex-direction: column; gap: 10px; }

    .course-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      cursor: pointer;
      transition: var(--transition);
    }
    .course-item:hover {
      border-color: rgba(224, 184, 74, 0.3);
      transform: translateX(3px);
    }

    .course-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(224, 184, 74, 0.1);
      color: var(--accent-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .course-body { flex: 1; min-width: 0; }
    .course-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .course-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .course-progress {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
      min-width: 60px;
    }
    .course-percent {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-bright);
      line-height: 1;
    }
    .course-progress-bar {
      width: 60px;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .course-progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      transition: width 1s ease;
    }
    .course-progress-fill.high { background: linear-gradient(90deg, #45b47d, #6fd99a); }
    .course-progress-fill.medium { background: linear-gradient(90deg, #E0B84A, #F0CC65); }
    .course-progress-fill.low { background: linear-gradient(90deg, #d7654a, #e88a72); }

    /* ═══════════════════════════════════════════════════════════
       PROGRESSION PAR MATIÈRE
       ═══════════════════════════════════════════════════════════ */
    .subjects-list { display: flex; flex-direction: column; gap: 10px; }

    .subject-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
    }
    .subject-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .subject-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subject-name i { color: var(--accent-bright); font-size: 13px; width: 16px; }
    .subject-percent {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-bright);
    }
    .subject-bar {
      height: 5px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 5px;
      overflow: hidden;
    }
    .subject-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 1s cubic-bezier(0.25, 1, 0.5, 1);
      width: 0%;
    }

    /* ═══════════════════════════════════════════════════════════
       LACUNES
       ═══════════════════════════════════════════════════════════ */
    .weakness-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(184, 92, 58, 0.06);
      border: 1px solid rgba(184, 92, 58, 0.2);
      margin-bottom: 8px;
    }
    .weakness-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(184, 92, 58, 0.12);
      color: #ff9a84;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .weakness-body { flex: 1; min-width: 0; }
    .weakness-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .weakness-message {
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.55;
      overflow-wrap: break-word;
    }

    /* ═══════════════════════════════════════════════════════════
       EMPTY STATE
       ═══════════════════════════════════════════════════════════ */
    .empty-state {
      text-align: center;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .empty-state .icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(224, 184, 74, 0.06);
      border: 1px solid rgba(224, 184, 74, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--accent-bright);
    }
    .empty-state h3 {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      color: var(--text-light);
    }
    .empty-state p {
      font-size: 13.5px;
      color: var(--text-dim);
      max-width: 320px;
      line-height: 1.6;
    }

    /* ═══════════════════════════════════════════════════════════
       MODAL
       ═══════════════════════════════════════════════════════════ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .modal-backdrop.show { display: flex; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-strong);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px;
      padding-bottom: calc(24px + var(--safe-bottom));
      overflow-y: auto;
      position: relative;
      animation: slideUp 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 24px 24px 0 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 auto 16px;
      cursor: grab;
    }

    .modal-header {
      text-align: center;
      margin-bottom: 22px;
      padding: 0 20px;
    }
    .modal-header h2 {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .modal-header p {
      font-size: 13.5px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: var(--transition);
      z-index: 5;
    }
    .modal-close:hover {
      color: var(--text-light);
      border-color: rgba(224, 184, 74, 0.3);
    }

    /* Capture modes (Texte / Voix) */
    .capture-modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .capture-mode {
      padding: 18px 12px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      transition: var(--transition);
      font-family: inherit;
      color: inherit;
    }
    .capture-mode:hover {
      border-color: rgba(224, 184, 74, 0.3);
      background: rgba(224, 184, 74, 0.04);
      transform: translateY(-2px);
    }
    .capture-mode.active {
      border-color: var(--accent-bright);
      background: rgba(224, 184, 74, 0.1);
    }
    .capture-mode .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(224, 184, 74, 0.1);
      color: var(--accent-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .capture-mode .label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-light);
    }
    .capture-mode .sub {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Form */
    .form-field { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .form-label i { color: var(--accent-bright); margin-right: 5px; }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: var(--bg-input);
      color: var(--text-light);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: var(--transition-fast);
      resize: vertical;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: rgba(224, 184, 74, 0.4);
      box-shadow: 0 0 0 3px rgba(224, 184, 74, 0.08);
      background: rgba(184, 134, 11, 0.02);
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
    .form-textarea { min-height: 160px; line-height: 1.6; }

    .char-counter {
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .char-counter.warning { color: var(--warning); }
    .char-counter.danger { color: #ff9a84; }

    /* Voice zone */
    .voice-zone {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      text-align: center;
    }
    .voice-zone.active { display: flex; }

    .voice-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-size: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      box-shadow: 0 8px 30px rgba(184, 134, 11, 0.3);
    }
    .voice-btn:hover { transform: scale(1.05); }
    .voice-btn.recording {
      background: linear-gradient(135deg, #E74C3C, #B85C3A);
      animation: pulseRec 1.5s ease-in-out infinite;
    }
    @keyframes pulseRec {
      0%, 100% { box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4), 0 0 0 0 rgba(231, 76, 60, 0.4); }
      50% { box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4), 0 0 0 20px rgba(231, 76, 60, 0); }
    }

    .voice-status {
      font-size: 13.5px;
      color: var(--text-dim);
      min-height: 20px;
      font-weight: 500;
      line-height: 1.5;
    }
    .voice-status.recording { color: #ff9a84; font-weight: 700; }

    .voice-transcript {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      font-size: 13.5px;
      color: var(--text-light);
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .voice-transcript:empty::before {
      content: 'Ta dictée apparaîtra ici...';
      color: var(--text-muted);
    }

    .voice-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.55;
      max-width: 340px;
    }
    .voice-hint em {
      color: var(--accent-bright);
      font-style: normal;
      font-weight: 600;
    }

    /* Buttons */
    .btn-full {
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      border-radius: 30px;
      border: none;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      cursor: pointer;
    }
    .btn-full.primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      box-shadow: 0 4px 16px rgba(184, 134, 11, 0.25);
    }
    .btn-full.primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(184, 134, 11, 0.4);
    }
    .btn-full.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-full .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(10, 10, 10, 0.25);
      border-top-color: #0A0A0A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-full.loading .spinner { display: block; }
    .btn-full.loading .btn-text,
    .btn-full.loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Quota info */
    .quota-note {
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(224, 184, 74, 0.06);
      border: 1px solid rgba(224, 184, 74, 0.15);
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .quota-note i { color: var(--accent-bright); margin-top: 2px; flex-shrink: 0; }

    /* ═══════════════════════════════════════════════════════════
       TOAST
       ═══════════════════════════════════════════════════════════ */
    .toast-container {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: calc(100% - 32px);
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(20, 22, 20, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-soft);
      color: var(--text-light);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: toastIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: auto;
    }
    .toast.success { border-color: rgba(58, 182, 126, 0.5); }
    .toast.error { border-color: rgba(231, 76, 60, 0.5); }
    .toast.info { border-color: rgba(224, 184, 74, 0.5); }
    .toast i { font-size: 15px; flex-shrink: 0; }
    .toast.success i { color: var(--success-light); }
    .toast.error i { color: #ff9a84; }
    .toast.info i { color: var(--accent-bright); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════════════════════════
       LOADING
       ═══════════════════════════════════════════════════════════ */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 60px 20px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(224, 184, 74, 0.15);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-state p {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* ═══════════════════════════════════════════════════════════
       KATEX
       ═══════════════════════════════════════════════════════════ */
    .katex { color: inherit; font-size: 1.05em; }
    .katex-display {
      margin: 10px 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════════════════ */
    @media (max-width: 520px) {
      .container { padding: 16px 12px 90px; gap: 14px; }
      .hero-card { padding: 20px 18px; }
      .hero-greeting h1 { font-size: 20px; }
      .streak-badge { padding: 10px 14px; min-width: 80px; }
      .streak-badge .streak-value { font-size: 20px; }
      .hero-cta { font-size: 14px; padding: 13px 18px; }
      .stat-card { padding: 12px 8px; }
      .stat-value { font-size: 18px; }
      .stat-label { font-size: 9px; }
      .section-label { font-size: 15px; }
      .todo-item { padding: 14px; }
      .todo-icon { width: 40px; height: 40px; font-size: 16px; }
      .todo-title { font-size: 13.5px; }
      .course-percent { font-size: 16px; }
      .course-progress-bar { width: 50px; }
      .modal { padding: 20px 16px; padding-bottom: calc(20px + var(--safe-bottom)); }
      .modal-header h2 { font-size: 18px; }
      .voice-btn { width: 70px; height: 70px; font-size: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(184, 134, 11, 0.25);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <a href="outils.html" class="back-btn" aria-label="Retour">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h1 class="page-title"><i class="fas fa-graduation-cap"></i> ARV-PROGRESS</h1>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="refreshBtn" title="Rafraîchir">
        <i class="fas fa-rotate"></i>
      </button>
    </div>
  </header>

  <!-- CONTAINER -->
  <main class="container" id="mainContainer">

    <!-- Loading initial -->
    <div class="loading-state" id="initialLoading">
      <div class="loading-spinner"></div>
      <p>Chargement de ton parcours...</p>
    </div>

    <!-- Contenu -->
    <div id="contentWrapper" style="display:none;"></div>

  </main>

  <!-- ═══════════════════════════════════════════════════════════
       MODAL AJOUT COURS
       ═══════════════════════════════════════════════════════════ -->
  <div class="modal-backdrop" id="captureModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <button class="modal-close" id="captureClose" aria-label="Fermer">
        <i class="fas fa-xmark"></i>
      </button>

      <div class="modal-header">
        <h2>📚 Ajouter mon cours</h2>
        <p>Choisis comment ajouter ton contenu : tape-le ou dicte-le.</p>
      </div>

      <!-- Modes -->
      <div class="capture-modes">
        <button class="capture-mode active" data-mode="text" type="button">
          <div class="icon"><i class="fas fa-keyboard"></i></div>
          <div class="label">Écrire</div>
          <div class="sub">Saisie directe</div>
        </button>
        <button class="capture-mode" data-mode="voice" type="button">
          <div class="icon"><i class="fas fa-microphone"></i></div>
          <div class="label">Dicter</div>
          <div class="sub">Voix → texte</div>
        </button>
      </div>

      <!-- Métadonnées communes -->
      <div class="form-field">
        <label class="form-label"><i class="fas fa-bookmark"></i> Matière</label>
        <select class="form-select" id="captureSubject">
          <option value="mathematiques">📐 Mathématiques</option>
          <option value="physique">⚡ Physique</option>
          <option value="chimie">🧪 Chimie</option>
          <option value="svt">🧬 SVT</option>
        </select>
      </div>

      <div class="form-field">
        <label class="form-label"><i class="fas fa-heading"></i> Titre du cours (optionnel)</label>
        <input type="text" class="form-input" id="captureTitle" placeholder="Ex : Dérivation, Dynamique..." maxlength="100">
      </div>

      <!-- ZONE TEXTE -->
      <div class="capture-zone" id="zoneText" style="display:block;">
        <div class="form-field">
          <label class="form-label"><i class="fas fa-align-left"></i> Contenu du cours</label>
          <textarea
            class="form-textarea"
            id="captureBody"
            placeholder="Colle ici ton cours, tes notes, tes définitions, tes formules..."
            maxlength="15000"></textarea>
          <div class="char-counter" id="charCounter">0 / 15000</div>
        </div>
      </div>

      <!-- ZONE VOIX -->
      <div class="voice-zone" id="zoneVoice">
        <div class="voice-status" id="voiceStatus">Appuie pour commencer à dicter</div>
        <button class="voice-btn" id="voiceBtn" type="button">
          <i class="fas fa-microphone"></i>
        </button>
        <div class="voice-transcript" id="voiceTranscript"></div>
        <div class="voice-hint">
          Parle naturellement. Tu peux dire : <em>« x au carré plus deux x »</em> qui sera converti en formule.
        </div>
      </div>

      <!-- Quota info -->
      <div class="quota-note" id="quotaNote" style="display:none;"></div>

      <!-- Actions -->
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:18px;">
        <button class="btn-full primary" id="captureSubmit" disabled>
          <span class="btn-icon"><i class="fas fa-wand-magic-sparkles"></i></span>
          <span class="btn-text">Analyser mon cours</span>
          <span class="spinner"></span>
        </button>
        <button class="btn-full" id="captureCancel" style="background:transparent; color:var(--text-muted); border:1px solid var(--border-soft);">
          Annuler
        </button>
      </div>
    </div>
  </div>

  <!-- TOASTS -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- SCRIPTS                                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ═══════════════════════════════════════════════════════════════
  // ARV-PROGRESS v2 — Apprentissage actif
  // ═══════════════════════════════════════════════════════════════

  import { initializeApp } from "firebase/app";
  import { getAuth, onAuthStateChanged, getIdToken } from "firebase/auth";
  import {
    getFirestore, doc, getDoc
  } from "firebase/firestore";

  // ────────────────────────────────────────────────────────────────
  // CONFIG
  // ────────────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
    authDomain: "arvexa-fbf10.firebaseapp.com",
    projectId: "arvexa-fbf10",
    storageBucket: "arvexa-fbf10.firebasestorage.app",
    messagingSenderId: "920108330053",
    appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const MAX_CONTENT_LENGTH = 15000;
  const MIN_CONTENT_LENGTH = 100;

  // ────────────────────────────────────────────────────────────────
  // ÉTAT
  // ────────────────────────────────────────────────────────────────
  const state = {
    user: null,
    userData: null,
    isPremium: false,
    dashboard: null,
    captureMode: 'text',
    voiceRecognition: null,
    voiceTranscriptText: '',
    isRecording: false,
    submitting: false
  };

  // ────────────────────────────────────────────────────────────────
  // DOM
  // ────────────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);

  const mainContainer = $('mainContainer');
  const initialLoading = $('initialLoading');
  const contentWrapper = $('contentWrapper');

  const captureModal = $('captureModal');
  const captureClose = $('captureClose');
  const captureCancel = $('captureCancel');
  const captureSubmit = $('captureSubmit');
  const captureSubject = $('captureSubject');
  const captureTitle = $('captureTitle');
  const captureBody = $('captureBody');
  const charCounter = $('charCounter');
  const zoneText = $('zoneText');
  const zoneVoice = $('zoneVoice');
  const voiceBtn = $('voiceBtn');
  const voiceStatus = $('voiceStatus');
  const voiceTranscript = $('voiceTranscript');
  const quotaNote = $('quotaNote');

  const toastContainer = $('toastContainer');

  // ────────────────────────────────────────────────────────────────
  // UTILITAIRES
  // ────────────────────────────────────────────────────────────────
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = String(text || '');
    return div.innerHTML;
  }

  function safeText(text) {
    return String(text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showToast(message, type = 'info', duration = 3200) {
    const icons = {
      success: 'fa-check-circle',
      error: 'fa-exclamation-circle',
      info: 'fa-info-circle'
    };
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(message)}</span>`;
    toastContainer.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-10px)';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  function renderKaTeX(root) {
    if (!root || typeof renderMathInElement !== 'function') return;
    try {
      renderMathInElement(root, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false,
        errorColor: '#ff9a84',
        strict: false,
        trust: true
      });
    } catch (_) {}
  }

  // ────────────────────────────────────────────────────────────────
  // API
  // ────────────────────────────────────────────────────────────────
  async function callApi(action, params = {}) {
    if (!state.user) throw new Error('Non authentifié.');
    const token = await getIdToken(state.user);
    const response = await fetch('/api/progress', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ action, ...params })
    });
    const data = await response.json().catch(() => null);
    if (!response.ok || !data?.success) {
      const err = new Error(data?.error || `Erreur ${response.status}`);
      err.code = data?.code;
      err.status = response.status;
      throw err;
    }
    return data;
  }

  // ────────────────────────────────────────────────────────────────
  // RENDU DASHBOARD
  // ────────────────────────────────────────────────────────────────
  function renderDashboard(data) {
    const summary = data.summary || {};
    const streak = data.streak || { current: 0, best: 0 };
    const todayPlan = data.todayPlan || [];
    const subjectProgress = data.subjectProgress || [];
    const recentCourses = data.recentCourses || [];
    const activeWeaknesses = data.activeWeaknesses || [];

    let html = '';

    // ═══ HERO ═══
    html += `
      <div class="hero-card">
        <div class="hero-top">
          <div class="hero-greeting">
            <h1>${getGreeting()}, <em>${escapeHtml(getFirstName())}</em></h1>
            <p>${getMotivationalMessage(streak.current)}</p>
          </div>
          <div class="streak-badge">
            <div class="streak-icon">🔥</div>
            <div class="streak-value">${streak.current}</div>
            <div class="streak-label">Jour${streak.current > 1 ? 's' : ''}</div>
          </div>
        </div>
        <button class="hero-cta" id="addCourseBtn">
          <i class="fas fa-plus"></i>
          Ajouter un cours
        </button>
      </div>
    `;

    // ═══ STATS ═══
    html += `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon gold">📚</div>
          <div class="stat-value">${summary.totalNotions || 0}</div>
          <div class="stat-label">Notions</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">✅</div>
          <div class="stat-value">${summary.mastered || 0}</div>
          <div class="stat-label">Maîtrisées</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">📊</div>
          <div class="stat-value">${summary.percentUpToDate || 0}%</div>
          <div class="stat-label">Global</div>
        </div>
      </div>
    `;

    // ═══ À FAIRE MAINTENANT ═══
    if (todayPlan.length > 0) {
      html += `
        <div class="section-label">
          <i class="fas fa-fire"></i> À faire maintenant
          <span class="count">${todayPlan.length} action${todayPlan.length > 1 ? 's' : ''}</span>
        </div>
        <div class="todo-list">
          ${todayPlan.map((item) => renderTodoItem(item)).join('')}
        </div>
      `;
    } else if (recentCourses.length === 0) {
      html += `
        <div class="empty-state" style="padding:20px;">
          <div class="icon"><i class="fas fa-rocket"></i></div>
          <h3>Commence ton parcours</h3>
          <p>Ajoute ton premier cours — l'IA va créer une fiche, des flashcards et un quiz.</p>
        </div>
      `;
    } else {
      html += `
        <div class="section-label">
          <i class="fas fa-fire"></i> À faire maintenant
        </div>
        <div class="todo-list">
          <div class="empty-state" style="padding:16px; text-align:center;">
            <p style="font-size:13.5px; color:var(--text-dim);">✨ Rien à réviser pour l'instant. Ajoute un cours ou reviens plus tard !</p>
          </div>
        </div>
      `;
    }

    // ═══ LACUNES ACTIVES ═══
    if (activeWeaknesses.length > 0) {
      html += `
        <div class="section-label">
          <i class="fas fa-triangle-exclamation"></i> Points à renforcer
        </div>
        <div>
          ${activeWeaknesses.map((w) => `
            <div class="weakness-item">
              <div class="weakness-icon"><i class="fas fa-circle-exclamation"></i></div>
              <div class="weakness-body">
                <div class="weakness-title">${escapeHtml(w.label)}</div>
                <div class="weakness-message">${escapeHtml(w.suggestedFix || 'Retravaille cette notion avec des exercices.')}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ═══ COURS RÉCENTS ═══
    if (recentCourses.length > 0) {
      html += `
        <div class="section-label">
          <i class="fas fa-book-open"></i> Mes cours récents
          <span class="count">${recentCourses.length}</span>
        </div>
        <div class="courses-list">
          ${recentCourses.map((c) => renderCourseItem(c)).join('')}
        </div>
      `;
    }

    // ═══ PROGRESSION PAR MATIÈRE ═══
    if (subjectProgress.length > 0) {
      html += `
        <div class="section-label">
          <i class="fas fa-chart-simple"></i> Progression par matière
        </div>
        <div class="subjects-list">
          ${subjectProgress.map((s) => renderSubjectItem(s)).join('')}
        </div>
      `;
    }

    contentWrapper.innerHTML = html;
    contentWrapper.style.display = 'block';
    initialLoading.style.display = 'none';

    renderKaTeX(contentWrapper);

    // Events
    const addBtn = $('addCourseBtn');
    if (addBtn) addBtn.addEventListener('click', openCaptureModal);

    contentWrapper.querySelectorAll('.todo-item').forEach((el) => {
      el.addEventListener('click', () => {
        const kind = el.dataset.kind;
        if (kind === 'revision') {
          showToast('Session de révision disponible bientôt', 'info');
        } else if (kind === 'surprise_test') {
          showToast('Test surprise disponible bientôt', 'info');
        }
      });
    });

contentWrapper.querySelectorAll('.course-item').forEach((el) => {
  el.addEventListener('click', () => {
    const courseId = el.dataset.courseId;
    if (courseId) {
      window.location.href = `progress-course.html?course=${courseId}`;
    }
  });
});
  }

  function renderTodoItem(item) {
    const isSurprise = item.kind === 'surprise_test';
    const subjectClass = item.subject || 'default';
    const iconClass = isSurprise ? 'surprise' : subjectClass;
    const iconFa = isSurprise ? 'fa-bullseye' : (item.icon || 'fa-book');

    return `
      <div class="todo-item ${isSurprise ? 'surprise' : ''}" data-kind="${escapeHtml(item.kind || 'revision')}" data-notion="${escapeHtml(item.notionId || '')}">
        <div class="todo-icon ${iconClass}">
          <i class="fas ${iconFa}"></i>
        </div>
        <div class="todo-content">
          <div class="todo-title">${escapeHtml(isSurprise ? '🎯 Test surprise' : (item.title || 'Notion'))}</div>
          <div class="todo-meta">
            ${item.subjectLabel ? `<span>${escapeHtml(item.subjectLabel)}</span>` : ''}
            <span class="duration"><i class="fas fa-clock"></i> ${item.duration || 8} min</span>
            <span>→ ${escapeHtml(item.task || 'Réviser')}</span>
          </div>
        </div>
        <div class="todo-arrow"><i class="fas fa-chevron-right"></i></div>
      </div>
    `;
  }

  function renderCourseItem(course) {
    const percent = Number(course.masteryPercent) || 0;
    let fillClass = 'low';
    if (percent >= 75) fillClass = 'high';
    else if (percent >= 40) fillClass = 'medium';

    return `
      <div class="course-item" data-course-id="${escapeHtml(course.id)}">
        <div class="course-icon"><i class="fas ${escapeHtml(course.icon || 'fa-book')}"></i></div>
        <div class="course-body">
          <div class="course-title">${escapeHtml(course.title || 'Cours')}</div>
          <div class="course-meta">
            <span>${escapeHtml(course.subjectLabel || '')}</span>
            <span>·</span>
            <span>${course.masteredCount || 0}/${course.notionsCount || 0} notions maîtrisées</span>
          </div>
        </div>
        <div class="course-progress">
          <div class="course-percent">${percent}%</div>
          <div class="course-progress-bar">
            <div class="course-progress-fill ${fillClass}" style="width:${percent}%"></div>
          </div>
        </div>
      </div>
    `;
  }

  function renderSubjectItem(subject) {
    const percent = Number(subject.percent) || 0;
    let color = 'linear-gradient(90deg, #d7654a, #e88a72)';
    if (percent >= 75) color = 'linear-gradient(90deg, #45b47d, #6fd99a)';
    else if (percent >= 40) color = 'linear-gradient(90deg, #E0B84A, #F0CC65)';

    return `
      <div class="subject-item">
        <div class="subject-head">
          <div class="subject-name">
            <i class="fas ${escapeHtml(subject.icon || 'fa-book')}"></i>
            <span>${escapeHtml(subject.label || subject.key)}</span>
          </div>
          <div class="subject-percent">${percent}%</div>
        </div>
        <div class="subject-bar">
          <div class="subject-bar-fill" style="width:${percent}%; background:${color}"></div>
        </div>
      </div>
    `;
  }

  function getGreeting() {
    const h = new Date().getHours();
    if (h >= 5 && h < 12) return 'Bonjour';
    if (h >= 12 && h < 18) return 'Bon après-midi';
    return 'Bonsoir';
  }

  function getFirstName() {
    return state.userData?.firstName || 'Élève';
  }

  function getMotivationalMessage(streak) {
    if (streak === 0) return 'Prêt à démarrer ton parcours ?';
    if (streak === 1) return 'C\'est reparti ! Continue comme ça.';
    if (streak < 5) return `Tu es en feu ! ${streak} jours d'affilée.`;
    if (streak < 10) return `Incroyable ! ${streak} jours consécutifs.`;
    return `${streak} jours — tu es inarrêtable !`;
  }

  // ────────────────────────────────────────────────────────────────
  // CHARGEMENT
  // ────────────────────────────────────────────────────────────────
  async function loadDashboard() {
    try {
      const data = await callApi('getDashboard');
      state.dashboard = data;
      renderDashboard(data);
    } catch (e) {
      console.error('loadDashboard error:', e);
      initialLoading.innerHTML = `
        <div class="empty-state" style="border-color:rgba(231,76,60,0.3)">
          <div class="icon" style="background:rgba(231,76,60,0.1); color:#ff9a84;">
            <i class="fas fa-exclamation-triangle"></i>
          </div>
          <h3>Impossible de charger</h3>
          <p>${escapeHtml(e.message || 'Erreur inconnue')}</p>
          <button class="btn-full primary" onclick="location.reload()" style="max-width:200px; margin-top:8px;">
            <i class="fas fa-rotate"></i> Réessayer
          </button>
        </div>
      `;
    }
  }

  // ────────────────────────────────────────────────────────────────
  // MODAL CAPTURE
  // ────────────────────────────────────────────────────────────────
  function openCaptureModal() {
    resetCaptureForm();
    captureModal.classList.add('show');
    document.body.style.overflow = 'hidden';
    updateQuotaNote();
    updateSubmitState();
  }

  function closeCaptureModal() {
    captureModal.classList.remove('show');
    document.body.style.overflow = '';
    stopVoiceRecognition();
  }

  function resetCaptureForm() {
    captureMode('text');
    captureTitle.value = '';
    captureBody.value = '';
    voiceTranscript.textContent = '';
    voiceStatus.textContent = 'Appuie pour commencer à dicter';
    voiceStatus.className = 'voice-status';
    voiceBtn.classList.remove('recording');
    updateCharCounter();
  }

  function captureMode(mode) {
    state.captureMode = mode;
    document.querySelectorAll('.capture-mode').forEach((el) => {
      el.classList.toggle('active', el.dataset.mode === mode);
    });
    zoneText.style.display = mode === 'text' ? 'block' : 'none';
    zoneVoice.classList.toggle('active', mode === 'voice');
    updateSubmitState();
  }

  function updateCharCounter() {
    const len = captureBody.value.length;
    charCounter.textContent = `${len} / ${MAX_CONTENT_LENGTH}`;
    charCounter.classList.remove('warning', 'danger');
    if (len > 12000) charCounter.classList.add('danger');
    else if (len > 10000) charCounter.classList.add('warning');
  }

  function updateQuotaNote() {
    if (state.isPremium) {
      quotaNote.style.display = 'none';
      return;
    }
    quotaNote.style.display = 'flex';
    quotaNote.innerHTML = `
      <i class="fas fa-info-circle"></i>
      <span>Compte gratuit : <strong>3 cours par mois</strong>. Passe à Premium pour un accès illimité.</span>
    `;
  }

  function updateSubmitState() {
    let ready = false;
    if (state.captureMode === 'text') {
      ready = captureBody.value.trim().length >= MIN_CONTENT_LENGTH;
    } else if (state.captureMode === 'voice') {
      ready = state.voiceTranscriptText.trim().length >= MIN_CONTENT_LENGTH;
    }
    captureSubmit.disabled = !ready;
  }

  // ────────────────────────────────────────────────────────────────
  // VOIX — Web Speech API
  // ────────────────────────────────────────────────────────────────
  function initVoiceRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showToast('La dictée n\'est pas supportée sur ce navigateur. Utilise Chrome.', 'error');
      return null;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    return recognition;
  }

  function startVoiceRecognition() {
    if (state.isRecording) {
      stopVoiceRecognition();
      return;
    }
    if (!state.voiceRecognition) {
      state.voiceRecognition = initVoiceRecognition();
      if (!state.voiceRecognition) return;
    }

    const recognition = state.voiceRecognition;

    recognition.onstart = () => {
      state.isRecording = true;
      voiceBtn.classList.add('recording');
      voiceStatus.textContent = '🔴 Enregistrement... Parle maintenant';
      voiceStatus.className = 'voice-status recording';
    };

    recognition.onresult = (event) => {
      let finalText = '';
      let interimText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += transcript + ' ';
        else interimText += transcript;
      }
      if (finalText) {
        state.voiceTranscriptText += finalText;
      }
      voiceTranscript.textContent = state.voiceTranscriptText + interimText;
      updateSubmitState();
    };

    recognition.onerror = (e) => {
      console.warn('Speech error:', e.error);
      if (e.error === 'not-allowed') {
        showToast('Micro non autorisé. Autorise dans les paramètres.', 'error', 5000);
      }
      stopVoiceRecognition();
    };

    recognition.onend = () => {
      state.isRecording = false;
      voiceBtn.classList.remove('recording');
      voiceStatus.textContent = 'Appuie pour reprendre ou termine';
      voiceStatus.className = 'voice-status';
    };

    try {
      recognition.start();
    } catch (e) {
      console.warn('Start error:', e);
      showToast('Impossible de démarrer. Réessaie.', 'error');
    }
  }

  function stopVoiceRecognition() {
    if (state.voiceRecognition && state.isRecording) {
      try { state.voiceRecognition.stop(); } catch (e) {}
    }
    state.isRecording = false;
    voiceBtn?.classList.remove('recording');
  }

  // ────────────────────────────────────────────────────────────────
  // SUBMIT CAPTURE
  // ────────────────────────────────────────────────────────────────
  async function submitCapture() {
    if (state.submitting) return;

    const subject = captureSubject.value;
    const title = captureTitle.value.trim();
    const mode = state.captureMode;

    let content = '';
    if (mode === 'text') content = captureBody.value.trim();
    else if (mode === 'voice') content = state.voiceTranscriptText.trim();

    if (content.length < MIN_CONTENT_LENGTH) {
      showToast(`Contenu trop court (min ${MIN_CONTENT_LENGTH} caractères)`, 'error');
      return;
    }
    if (content.length > MAX_CONTENT_LENGTH) {
      content = content.slice(0, MAX_CONTENT_LENGTH);
    }

    stopVoiceRecognition();

    state.submitting = true;
    captureSubmit.disabled = true;
    captureSubmit.classList.add('loading');

    try {
      const result = await callApi('analyzeCourse', { subject, title, content, mode });

      showToast(`✅ ${result.notionsCount || 0} notions extraites`, 'success', 4000);
      closeCaptureModal();

      setTimeout(() => loadDashboard(), 400);

    } catch (e) {
      console.error('submitCapture error:', e);

      if (e.code === 'FREE_CAPTURE_LIMIT') {
        showToast('Limite gratuite atteinte. Passe à Premium.', 'error', 5000);
      } else {
        showToast('Erreur : ' + e.message, 'error', 5000);
      }

      captureSubmit.disabled = false;
      captureSubmit.classList.remove('loading');
    } finally {
      state.submitting = false;
    }
  }

  // ────────────────────────────────────────────────────────────────
  // ÉVÉNEMENTS
  // ────────────────────────────────────────────────────────────────
  document.querySelectorAll('.capture-mode').forEach((el) => {
    el.addEventListener('click', () => captureMode(el.dataset.mode));
  });

  captureBody.addEventListener('input', () => {
    updateCharCounter();
    updateSubmitState();
  });

  voiceBtn.addEventListener('click', startVoiceRecognition);
  captureSubmit.addEventListener('click', submitCapture);
  captureClose.addEventListener('click', closeCaptureModal);
  captureCancel.addEventListener('click', closeCaptureModal);

  captureModal.addEventListener('click', (e) => {
    if (e.target === captureModal) closeCaptureModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && captureModal.classList.contains('show')) {
      closeCaptureModal();
    }
  });

  $('refreshBtn').addEventListener('click', () => {
    const icon = $('refreshBtn').querySelector('i');
    icon.style.transform = 'rotate(360deg)';
    setTimeout(() => icon.style.transform = '', 600);
    loadDashboard();
  });

  // ────────────────────────────────────────────────────────────────
  // AUTH
  // ────────────────────────────────────────────────────────────────
  function isUserPremium(data) {
    if (!data) return false;
    const active = data.premium === true || data.isUnlocked === true || data.hasDeposited === true;
    if (!active) return false;
    const end = data.subscriptionEndDate?.toDate?.() ||
      (data.subscriptionEndDate?.seconds ? new Date(data.subscriptionEndDate.seconds * 1000) : null);
    return !end || end.getTime() > Date.now();
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.replace('login.html');
      return;
    }

    state.user = user;

    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) {
        state.userData = snap.data();
        state.isPremium = isUserPremium(state.userData);
      }
    } catch (_) {}

    loadDashboard();
  });

  console.log('🚀 ARV-PROGRESS v2 — prêt');
  </script>
</body>
</html>
