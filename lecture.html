  <link rel="stylesheet" href="arvexa-ui.css">
  <style>
    /* ============================================================
       TOKENS — Identité ARVEXA School
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #B85C3A;
      --danger-light: #f87171;
      --warning: #D4A017;
      --warning-bright: #fbbf24;

      --bg-dark: #0A0A0A;
      --bg-surface: #131311;
      --bg-card: rgba(255, 255, 255, 0.025);
      --bg-elev: rgba(19, 19, 17, 0.9);

      --text-light: #F5F0E8;
      --text-body: #C9CBC0;
      --text-dim: #8A8A7A;
      --text-muted: #5C5C4E;

      --border-soft: rgba(255, 255, 255, 0.065);
      --border-gold: rgba(224, 184, 74, 0.14);
      --card-border: rgba(184, 134, 11, 0.11);

      --tint-gold: rgba(224, 184, 74, 0.05);
      --tint-red: rgba(248, 113, 113, 0.05);
      --tint-warn: rgba(251, 191, 36, 0.055);

      --shadow-soft: 0 10px 34px rgba(0, 0, 0, 0.35);

      --transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      --radius: 16px;
      --radius-lg: 18px;
      --content-max: 780px;
      --header-h: 56px;

      --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-mono: 'SF Mono', 'Monaco', 'Consolas', 'Courier New', monospace;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html[data-theme="light"] {
      --bg-dark: #FAF7F0;
      --bg-surface: #FFFFFF;
      --bg-card: rgba(255, 255, 255, 0.8);
      --bg-elev: rgba(255, 255, 255, 0.96);

      --text-light: #1C1B17;
      --text-body: #33322C;
      --text-dim: #5A594F;
      --text-muted: #8B897C;

      --border-soft: rgba(var(--rgb-card), 0.09);
      --border-gold: rgba(184, 134, 11, 0.2);
      --card-border: rgba(184, 134, 11, 0.18);

      --accent: #96650A;
      --accent-bright: #B8860B;
      --success: #1E6B47;
      --danger-light: #dc2626;
      --warning: #B37D00;
      --warning-bright: #B37D00;

      --tint-gold: rgba(184, 134, 11, 0.08);
      --tint-red: rgba(220, 38, 38, 0.06);
      --tint-warn: rgba(217, 119, 6, 0.08);

      --shadow-soft: 0 10px 30px rgba(80, 60, 10, 0.1);
    }

    /* ============================================================
       BASE
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; width: 100%; -webkit-text-size-adjust: 100%; overflow-x: hidden; }

    body {
      font-family: var(--font-body);
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 16px;
      line-height: 1.8;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::selection { background: rgba(224, 184, 74, 0.28); }

    /* ============================================================
       FOND DÉCORATIF
       ============================================================ */
    .gradient-bg {
      position: fixed; inset: 0; z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 42% 30% at 24% 10%, rgba(184, 134, 11,  0.22) 0%, transparent 62%),
        radial-gradient(ellipse 36% 26% at 82% 88%, rgba(184, 134, 11, 0.06) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-deep) 100%);
      transition: opacity 0.3s ease;
    }
    html[data-theme="light"] .gradient-bg {
      background:
        radial-gradient(ellipse 42% 30% at 24% 10%, rgba(184, 134, 11, 0.07) 0%, transparent 62%),
        radial-gradient(ellipse 36% 26% at 82% 88%, rgba(184, 134, 11,  0.05) 0%, transparent 60%),
        linear-gradient(180deg, #FAF7F0 0%, #F1EBDD 100%);
    }

    /* ============================================================
       PROGRESSION DE LECTURE (barre supérieure)
       ============================================================ */
    .read-progress {
      position: fixed; top: 0; left: 0; right: 0;
      height: 3px; z-index: 300; pointer-events: none;
      background: transparent;
    }
    .read-progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      box-shadow: 0 0 10px rgba(224, 184, 74, 0.55);
      transition: width 0.12s ease-out;
    }

    /* ============================================================
       EN-TÊTE — compact, clair, organisé
       ============================================================ */
    .header {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      padding: calc(6px + var(--safe-top)) 14px 6px;
      min-height: calc(var(--header-h) + var(--safe-top));
      background: rgba(var(--rgb-veil), 0.78);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      border-bottom: 1px solid rgba(184, 134, 11, 0.08);
      transition: background-color 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    html[data-theme="light"] .header {
      background: rgba(250, 247, 240, 0.85);
      border-bottom-color: rgba(184, 134, 11, 0.14);
    }
    .header.scrolled {
      background: rgba(var(--rgb-veil), 0.93);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    html[data-theme="light"] .header.scrolled {
      background: rgba(250, 247, 240, 0.97);
      box-shadow: 0 8px 24px rgba(80, 60, 10, 0.09);
    }

    .header-left {
      display: flex; align-items: center; gap: 10px;
      min-width: 0; flex: 1;
    }

    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-dim); cursor: pointer;
      transition: var(--transition); font-size: 14px;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      border-color: rgba(224, 184, 74, 0.28);
      color: var(--accent-bright);
      background: rgba(224, 184, 74, 0.05);
    }
    .icon-btn:active { transform: scale(0.94); }

    .header-title {
      min-width: 0;
      display: flex; flex-direction: column; gap: 1px;
    }
    .ht-overline {
      font-size: 9px; font-weight: 700;
      letter-spacing: 2.2px; text-transform: uppercase;
      color: var(--accent); line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ht-main {
      font-size: 13.5px; font-weight: 600;
      color: var(--text-light); line-height: 1.35;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .header-right {
      display: flex; align-items: center; gap: 7px;
      flex-shrink: 0;
    }

    .tts-btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 13px; border-radius: 999px;
      border: 1px solid rgba(224, 184, 74, 0.2);
      background: rgba(224, 184, 74, 0.07);
      color: var(--accent-bright); font-size: 11.5px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
      flex-shrink: 0; white-space: nowrap;
    }
    .tts-btn i { font-size: 12px; }
    .tts-btn:hover { background: rgba(224, 184, 74, 0.14); }
    .tts-btn:active { transform: scale(0.95); }
    .tts-btn.speaking {
      border-color: rgba(224, 184, 74, 0.45);
      background: rgba(224, 184, 74, 0.16);
    }
    .tts-btn.speaking i { animation: ttsPulse 1.2s ease-in-out infinite; }
    .tts-btn.paused {
      border-color: rgba(224, 184, 74, 0.35);
      background: rgba(224, 184, 74, 0.1);
      color: var(--accent-bright);
    }
    @keyframes ttsPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .notes-btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 13px; border-radius: 999px;
      border: 1px solid rgba(224, 184, 74, 0.2);
      background: rgba(224, 184, 74, 0.07);
      color: var(--accent-bright); font-size: 11.5px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
      flex-shrink: 0; white-space: nowrap;
      position: relative;
    }
    .notes-btn i { font-size: 12px; }
    .notes-btn:hover { background: rgba(224, 184, 74, 0.14); }
    .notes-btn:active { transform: scale(0.95); }
    .notes-btn .dot {
      position: absolute; top: 5px; right: 5px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--success-light);
      box-shadow: 0 0 6px rgba(58, 182, 126, 0.8);
      display: none;
    }
    .notes-btn .dot.show { display: block; }

    /* ============================================================
       CONTENEUR DE LECTURE — largeur adaptée
       ============================================================ */
    .content-wrapper {
      width: 100%; max-width: var(--content-max);
      margin: 0 auto; min-width: 0;
      padding: 28px 20px 36px;
    }

    #contentBody {
      min-width: 0; max-width: 100%;
      font-size: 16.5px;
      line-height: 1.85;
      color: var(--text-body);
      letter-spacing: 0.005em;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }
    #contentBody [id] { scroll-margin-top: calc(var(--header-h) + 20px); }
    #contentBody > div:empty,
    #contentBody > p:empty,
    #contentBody > br:last-child { display: none; }

    /* ============================================================
       ÉTATS — chargement
       ============================================================ */
    .loading-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 90px 20px; gap: 16px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(224, 184, 74, 0.15);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p {
      font-size: 13px; color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* ============================================================
       SABLIER ANIMÉ — Contenu en préparation
       ============================================================ */
    .hourglass-wrap {
      position: relative;
      width: 100px; height: 100px;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .hourglass-wrap::before {
      content: '';
      position: absolute; inset: -20%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(224, 184, 74, 0.25) 0%,
        rgba(224, 184, 74, 0.08) 40%,
        transparent 70%
      );
      animation: hourglassHalo 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes hourglassHalo {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .hourglass-svg {
      width: 72px; height: 72px;
      position: relative; z-index: 1;
      animation: hourglassTilt 6s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(224, 184, 74, 0.4));
    }
    @keyframes hourglassTilt {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .hourglass-svg .frame {
      stroke: var(--accent-bright); stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .hourglass-svg .glass {
      fill: rgba(224, 184, 74, 0.08);
      stroke: rgba(224, 184, 74, 0.4); stroke-width: 1.5;
    }
    .hourglass-svg .sand-top {
      fill: var(--accent-bright);
      animation: sandTopDrain 4s ease-in-out infinite;
      transform-origin: center top;
    }
    @keyframes sandTopDrain {
      0%, 10% { transform: scaleY(1); opacity: 1; }
      80%, 90% { transform: scaleY(0.05); opacity: 0.9; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    .hourglass-svg .sand-stream {
      fill: var(--accent-bright);
      animation: sandStream 4s ease-in-out infinite;
    }
    @keyframes sandStream {
      0%, 15% { opacity: 0.9; }
      75%, 85% { opacity: 0.9; }
      95%, 100% { opacity: 0; }
    }
    .hourglass-svg .sand-bottom {
      fill: var(--accent-bright);
      animation: sandBottomFill 4s ease-in-out infinite;
      transform-origin: center bottom;
    }
    @keyframes sandBottomFill {
      0%, 10% { transform: scaleY(0.1); opacity: 0.8; }
      80%, 90% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(0.1); opacity: 0.8; }
    }
    .hourglass-particle {
      position: absolute;
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 6px var(--accent-bright);
      opacity: 0; pointer-events: none;
    }
    .hourglass-particle:nth-child(1) { left: 50%; top: 35%; animation: particleDrop 2.5s ease-in 0s infinite; }
    .hourglass-particle:nth-child(2) { left: 48%; top: 35%; animation: particleDrop 2.5s ease-in 0.6s infinite; }
    .hourglass-particle:nth-child(3) { left: 52%; top: 35%; animation: particleDrop 2.5s ease-in 1.2s infinite; }
    .hourglass-particle:nth-child(4) { left: 50%; top: 35%; animation: particleDrop 2.5s ease-in 1.8s infinite; }
    @keyframes particleDrop {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      10% { opacity: 1; transform: translateY(0) scale(1); }
      80% { opacity: 1; transform: translateY(28px) scale(1); }
      100% { opacity: 0; transform: translateY(35px) scale(0.4); }
    }
    html[data-theme="light"] .hourglass-wrap::before {
      background: radial-gradient(
        circle,
        rgba(184, 134, 11, 0.3) 0%,
        rgba(184, 134, 11, 0.1) 40%,
        transparent 70%
      );
    }
    html[data-theme="light"] .hourglass-svg {
      filter: drop-shadow(0 0 12px rgba(184, 134, 11, 0.5));
    }

    /* ============================================================
       CONTENU INDISPONIBLE
       ============================================================ */
    .content-unavailable {
      text-align: center; padding: 56px 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      min-height: 300px; justify-content: center;
    }
    .content-unavailable h2 {
      font-family: var(--font-serif);
      font-size: 22px; font-weight: 700;
      color: var(--text-light); margin: 0;
    }
    .content-unavailable p {
      font-size: 14px; color: var(--text-dim);
      max-width: 380px; line-height: 1.7; margin: 0;
    }
    .content-unavailable .cu-actions {
      display: flex; gap: 10px; margin-top: 10px;
      flex-wrap: wrap; justify-content: center;
    }
    .content-unavailable .cu-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px; border-radius: 100px;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-light); text-decoration: none;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
    }
    .content-unavailable .cu-btn:hover {
      border-color: rgba(224, 184, 74, 0.3);
      background: rgba(224, 184, 74, 0.08);
      color: var(--accent-bright);
    }
    .content-unavailable .cu-btn.primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: var(--bg-dark); border-color: transparent;
    }
    .content-unavailable .cu-btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(184, 134, 11, 0.3);
      color: var(--bg-dark);
    }

    /* ============================================================
       NAVIGATION BAS DE PAGE
       ============================================================ */
    .nav-bar {
      margin-top: 64px; padding-top: 20px;
      border-top: 1px solid var(--border-gold);
      position: relative;
    }
    .nav-bar::before {
      content: ''; position: absolute;
      top: -1px; left: 0; width: 46px; height: 2px;
      background: linear-gradient(90deg, var(--accent-bright), transparent);
    }
    .nav-progress {
      display: flex; flex-wrap: wrap; gap: 6px;
      justify-content: center; margin-bottom: 18px;
    }
    .nav-progress[hidden] { display: none; }
    .pdot {
      width: 6px; height: 6px; border-radius: 999px;
      background: rgba(var(--rgb-soft), 0.12);
      transition: var(--transition);
    }
    html[data-theme="light"] .pdot { background: rgba(0, 0, 0, 0.14); }
    .pdot.done { background: rgba(224, 184, 74, 0.4); }
    .pdot.active {
      width: 22px; background: var(--accent-bright);
      box-shadow: 0 0 8px rgba(224, 184, 74, 0.5);
    }
    .nav-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px; border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-dim); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body); text-decoration: none;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: rgba(224, 184, 74, 0.3);
      color: var(--text-light);
      transform: translateY(-1px);
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-btn i { font-size: 11px; }
    .nav-btn.primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: var(--bg-dark); border-color: transparent; font-weight: 700;
    }
    .nav-btn.primary:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(184, 134, 11, 0.35);
      color: var(--bg-dark);
    }
    .nav-counter {
      font-size: 12px; color: var(--text-muted);
      font-weight: 600; letter-spacing: 0.06em;
      padding: 0 4px; flex-shrink: 0;
    }

    /* ============================================================
       MODAL NOTES
       ============================================================ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999; display: none;
      align-items: center; justify-content: center;
      padding: 20px; animation: fadeIn 0.25s ease;
    }
    .modal-overlay.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px 20px; max-width: 480px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.3s ease; position: relative;
      box-shadow: var(--shadow-soft);
    }
    @keyframes slideUp {
      from { transform: translateY(28px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal .modal-close {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; border-radius: 10px;
      background: transparent; border: 1px solid transparent;
      color: var(--text-muted); font-size: 15px;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
    }
    .modal .modal-close:hover {
      color: var(--text-light);
      background: rgba(var(--rgb-soft), 0.05);
      border-color: var(--border-soft);
    }
    .modal .modal-title {
      font-size: 19px; font-weight: 700;
      font-family: var(--font-serif);
      color: var(--text-light);
      margin-bottom: 4px; padding-right: 30px;
    }
    .modal .modal-title span { color: var(--accent-bright); }
    .modal .modal-sub {
      font-size: 12px; color: var(--text-dim);
      margin-bottom: 16px;
    }
    .modal textarea {
      width: 100%; min-height: 180px; max-height: 400px;
      padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(var(--rgb-soft), 0.02);
      color: var(--text-light); font-size: 14px;
      font-family: var(--font-body);
      resize: vertical; outline: none;
      transition: var(--transition); line-height: 1.7;
    }
    html[data-theme="light"] .modal textarea { background: rgba(0, 0, 0, 0.02); }
    .modal textarea:focus { border-color: rgba(224, 184, 74, 0.35); }
    .modal textarea::placeholder { color: var(--text-muted); }
    .modal .modal-actions {
      display: flex; gap: 10px; margin-top: 14px;
    }
    .modal .modal-actions button {
      flex: 1; padding: 11px; border-radius: 100px;
      border: none; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
    }
    .modal .modal-actions .btn-save {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: var(--bg-dark);
    }
    .modal .modal-actions .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(184, 134, 11, 0.25);
    }
    .modal .modal-actions .btn-cancel {
      background: rgba(var(--rgb-soft), 0.04);
      color: var(--text-dim);
      border: 1px solid var(--border-soft);
    }
    html[data-theme="light"] .modal .modal-actions .btn-cancel {
      background: rgba(0, 0, 0, 0.04);
    }
    .modal .modal-actions .btn-cancel:hover {
      background: rgba(var(--rgb-soft), 0.08);
      color: var(--text-light);
    }
    .modal .note-saved {
      font-size: 12px; color: var(--success-light);
      margin-top: 10px; display: none;
      align-items: center; gap: 6px;
    }
    .modal .note-saved.show { display: flex; }

    .tts-progress {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 3px; background: rgba(224, 184, 74, 0.1);
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .tts-progress.active { opacity: 1; }
    .tts-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      width: 0%; transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(224, 184, 74, 0.5);
    }
    /* ============================================================
       TYPOGRAPHIE GÉNÉRALE DU CONTENU
       ============================================================ */
    #contentBody h1,
    #contentBody h2,
    #contentBody h3,
    #contentBody h4,
    #contentBody h5,
    #contentBody h6 {
      font-family: var(--font-serif);
      color: var(--text-light);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.015em;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    #contentBody h1 {
      font-size: clamp(26px, 3.5vw, 34px);
      margin: 0 0 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-gold);
      position: relative;
    }
    #contentBody h1::after {
      content: ''; position: absolute; bottom: -1px; left: 0;
      width: 50px; height: 2px;
      background: linear-gradient(90deg, var(--accent-bright), transparent);
    }

    #contentBody h2 {
      font-size: clamp(22px, 3vw, 28px);
      margin: 44px 0 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }
    #contentBody h2::after {
      content: ''; position: absolute; bottom: -1px; left: 0;
      width: 36px; height: 2px;
      background: var(--accent-bright);
    }

    #contentBody h3 {
      font-size: clamp(19px, 2.5vw, 22px);
      margin: 32px 0 14px;
    }
    #contentBody h4 {
      font-family: var(--font-body);
      font-size: clamp(16px, 2vw, 18px);
      font-weight: 600;
      margin: 26px 0 12px;
    }
    #contentBody h5 {
      font-family: var(--font-body);
      font-size: 15px; font-weight: 700;
      margin: 22px 0 10px;
      color: var(--accent-bright);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #contentBody h6 {
      font-family: var(--font-body);
      font-size: 13px; font-weight: 700;
      margin: 18px 0 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    #contentBody p {
      margin: 0 0 18px;
      color: var(--text-body);
      overflow-wrap: break-word;
      word-wrap: break-word;
    }
    #contentBody p:last-child { margin-bottom: 0; }

    #contentBody strong { color: var(--text-light); font-weight: 600; }
    #contentBody em { color: var(--accent-bright); font-style: italic; font-weight: 500; }
    #contentBody del { color: var(--text-muted); text-decoration: line-through; }
    #contentBody mark {
      background: rgba(224, 184, 74, 0.2);
      color: var(--text-light);
      padding: 1px 4px; border-radius: 8px;
    }

    #contentBody a {
      color: var(--accent-bright);
      text-decoration: none;
      border-bottom: 1px solid rgba(224, 184, 74, 0.3);
      transition: var(--transition);
      overflow-wrap: break-word;
      word-break: break-word;
    }
    #contentBody a:hover {
      border-bottom-color: var(--accent-bright);
      background: rgba(224, 184, 74, 0.06);
      padding: 0 2px;
    }

    #contentBody ul,
    #contentBody ol {
      margin: 16px 0 20px;
      padding-left: 26px;
    }
    #contentBody li {
      margin: 6px 0; line-height: 1.8;
      overflow-wrap: break-word;
    }

    sup {
      font-size: 0.68em;
      vertical-align: super;
      line-height: 0;
      font-family: var(--font-serif);
      font-weight: 600;
      margin-left: 1px;
    }
    sub {
      font-size: 0.68em;
      vertical-align: sub;
      line-height: 0;
      font-family: var(--font-serif);
      font-weight: 600;
      margin-left: 1px;
    }

    #contentBody pre {
      margin: 20px 0; padding: 16px 18px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-soft);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      font-family: var(--font-mono);
      font-size: 13px; line-height: 1.6;
      color: var(--text-body);
    }
    html[data-theme="light"] #contentBody pre { background: rgba(0, 0, 0, 0.04); }
    #contentBody code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: rgba(224, 184, 74, 0.1);
      color: var(--accent-bright);
      padding: 2px 7px; border-radius: 8px;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    #contentBody pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    #contentBody blockquote {
      margin: 22px 0;
      padding: 4px 0 4px 20px;
      border-left: 3px solid var(--accent-bright);
      color: var(--text-dim);
      font-style: italic;
      font-size: 15.5px; line-height: 1.8;
    }
    #contentBody blockquote strong { color: var(--text-light); font-style: normal; }

    #contentBody hr {
      margin: 36px 0; border: none; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
    }

    #contentBody img {
      max-width: 100%; height: auto;
      border-radius: 10px; margin: 16px 0;
      display: block;
    }
    #contentBody svg {
      max-width: 100%; height: auto;
      display: block; margin: 16px auto;
    }

    #contentBody table {
      width: 100%; border-collapse: collapse;
      margin: 22px 0; font-size: 14px;
      border: 1px solid var(--border-soft);
      border-radius: 10px; overflow: hidden;
      word-break: break-word;
    }
    #contentBody th,
    #contentBody td {
      padding: 11px 14px; text-align: left;
      border-bottom: 1px solid var(--border-soft);
      overflow-wrap: break-word;
      word-break: break-word;
      min-width: 0; vertical-align: top;
    }
    #contentBody thead th {
      background: rgba(224, 184, 74, 0.06);
      color: var(--accent-bright);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #contentBody tbody tr:last-child td { border-bottom: none; }
    #contentBody tbody tr:hover { background: rgba(224, 184, 74, 0.03); }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 22px 0; border-radius: 10px;
      border: 1px solid var(--border-soft);
    }
    .table-wrap table { margin: 0; border: none; border-radius: 0; min-width: 100%; }

    /* ============================================================
       FORMULES MATHÉMATIQUES — lisibles, sans débordement
       ============================================================ */
    #contentBody .math { color: var(--text-light); }

    /* v4.30 — formule « posée » : le client met en page sans toucher au
       contenu. Chaque formule/comparaison extraite d'une phrase tient sur
       SA propre ligne (nowrap + scroll horizontal si vraiment longue),
       comme un calcul au tableau. Thème clair/sombre via variables. */
    #contentBody .math-line {
      display: block;
      margin: 10px 0;
      padding: 7px 12px;
      text-align: left;
      font-size: 1.05em;
      line-height: 1.65;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    html[data-theme="light"] #contentBody .math-line { color: var(--text-light); }

    .katex { font-size: 1.06em; color: var(--text-light); }
    .katex-display {
      margin: 22px 0; padding: 2px 6px;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      text-align: center;
    }
    .katex-display > .katex {
      font-size: 1.15em; white-space: normal;
    }
    .katex .mathnormal,
    .katex .mathit {
      font-style: italic;
      color: var(--text-light);
    }
    .katex .mop,
    .katex .mord.text {
      font-family: 'KaTeX_Main', 'Times New Roman', serif;
      font-style: normal;
      color: var(--text-light);
    }
    .katex .mbin,
    .katex .mrel { color: var(--text-body); }
    .katex .frac-line { border-bottom-color: var(--text-light); }
    .katex .sqrt > .root { color: var(--accent-bright); }

    /* ============================================================
       COMPOSANTS PÉDAGOGIQUES DU COURS
       ============================================================ */
    .lecture-container {
      min-width: 0; max-width: 100%;
    }

    /* ---- HERO ---- */
    .lecture-hero {
      margin: 0 0 40px; padding: 0 0 28px;
      border-bottom: 1px solid var(--border-gold);
      position: relative; min-width: 0;
    }
    .lecture-hero::after {
      content: ''; position: absolute;
      bottom: -1px; left: 0;
      width: 56px; height: 2px;
      background: linear-gradient(90deg, var(--accent-bright), transparent);
    }
    .lecture-hero-badge {
      display: inline-flex; align-items: center;
      gap: 8px; margin-bottom: 18px;
      padding: 6px 14px; border-radius: 999px;
      background: var(--tint-gold);
      border: 1px solid var(--border-gold);
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--accent-bright);
    }
    .lecture-hero-icon { font-size: 13px; }
    .lecture-hero-label { color: var(--accent-bright); }
    .lecture-hero-title {
      font-family: var(--font-serif);
      font-size: clamp(27px, 4.2vw, 40px);
      font-weight: 700; line-height: 1.15;
      color: var(--text-light);
      margin: 0 0 16px;
      letter-spacing: -0.025em;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .lecture-hero-title em {
      color: var(--accent-bright);
      font-style: italic; font-weight: 500;
    }
    .lecture-hero-intro {
      font-size: clamp(15px, 1.7vw, 17px);
      line-height: 1.75; color: var(--text-dim);
      margin: 0 0 22px; max-width: 640px;
      font-weight: 300;
      overflow-wrap: break-word;
    }
    .lecture-hero-meta {
      display: flex; flex-wrap: wrap;
      gap: 8px; font-size: 12px;
      color: var(--text-dim);
    }
    .lecture-hero-meta-item {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 12px; border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      letter-spacing: 0.03em;
    }
    .lecture-hero-meta-item i {
      color: var(--accent); font-size: 11px;
    }

    /* ---- SOMMAIRE ---- */
    .lecture-toc {
      margin: 0 0 48px; padding: 0; min-width: 0;
    }
    .lecture-toc-header {
      display: flex; justify-content: space-between;
      align-items: baseline;
      padding-bottom: 10px; margin-bottom: 4px;
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent); gap: 12px; flex-wrap: wrap;
    }
    .lecture-toc-count {
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 1.5px;
    }
    .lecture-toc-list {
      list-style: none; padding: 0; margin: 0;
    }
    .lecture-toc-list li {
      border-bottom: 1px solid var(--border-soft);
      margin: 0;
    }
    .lecture-toc-list li:last-child { border-bottom: none; }
    .lecture-toc-list a {
      display: flex; align-items: baseline;
      gap: 20px; padding: 12px 4px;
      color: var(--text-dim); text-decoration: none;
      font-size: 14.5px; line-height: 1.6;
      transition: color 0.2s, padding-left 0.25s, background 0.2s;
      border-bottom: none;
      border-radius: 8px;
    }
    .lecture-toc-list a:hover {
      color: var(--accent-bright);
      padding-left: 8px; background: transparent;
    }
    .lecture-toc-list a.toc-active {
      color: var(--accent-bright);
    }
    .lecture-toc-list a.toc-active .toc-num { color: var(--accent-bright); }
    .toc-num {
      font-family: var(--font-serif);
      font-size: 11px; font-weight: 700;
      color: var(--accent); letter-spacing: 1px;
      flex-shrink: 0; min-width: 22px;
    }

    /* ---- SECTIONS ---- */
    .lecture-section {
      margin: 0 0 72px;
      min-width: 0;
    }
    #contentBody .lecture-section:last-child { margin-bottom: 0; }
    .lecture-section-header {
      display: flex; align-items: baseline;
      gap: 22px; margin-bottom: 26px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-soft);
      position: relative; flex-wrap: wrap;
    }
    .lecture-section-header::after {
      content: ''; position: absolute;
      bottom: -1px; left: 0;
      width: 36px; height: 2px;
      background: var(--accent-bright);
    }
    .lecture-section-num {
      font-family: var(--font-serif);
      font-size: clamp(30px, 4vw, 40px);
      font-weight: 700; color: var(--accent);
      opacity: 0.45; line-height: 1;
      flex-shrink: 0;
      letter-spacing: -0.03em;
    }
    .lecture-section-heading { flex: 1; min-width: 0; }
    .lecture-section-eyebrow {
      display: block; font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: var(--accent); margin-bottom: 6px;
    }
    .lecture-section-title {
      font-family: var(--font-serif);
      font-size: clamp(20px, 2.8vw, 26px);
      font-weight: 700; color: var(--text-light);
      margin: 0; line-height: 1.2;
      letter-spacing: -0.02em;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .lecture-section-body { min-width: 0; }
    .lecture-section-sub { margin: 34px 0 20px; min-width: 0; }
    .lecture-subtitle {
      font-family: var(--font-serif);
      font-size: clamp(17px, 2vw, 19px);
      font-weight: 700; color: var(--text-light);
      margin: 0 0 14px;
      letter-spacing: -0.01em;
      padding-left: 14px;
      border-left: 3px solid var(--accent-bright);
      line-height: 1.4;
      overflow-wrap: break-word;
    }

    /* ---- TEXTE & LISTES ---- */
    .lecture-text {
      font-size: 16px; line-height: 1.85;
      color: var(--text-body);
      margin: 0 0 18px;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }
    .lecture-text strong { color: var(--text-light); font-weight: 600; }

    .lecture-list {
      list-style: none; padding: 0; margin: 18px 0 22px;
    }
    .lecture-list li {
      position: relative;
      padding: 7px 0 7px 24px;
      color: var(--text-body);
      font-size: 15.5px; line-height: 1.8;
      overflow-wrap: break-word;
      word-break: break-word; margin: 0;
    }
    .lecture-list li::before {
      content: '—'; position: absolute;
      left: 0; top: 7px;
      color: var(--accent); font-weight: 700;
      font-size: 14px;
    }
    .lecture-list li strong { color: var(--text-light); font-weight: 600; }

    .lecture-list-elegant li {
      display: flex; gap: 18px;
      padding: 12px 0 12px 24px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }
    .lecture-list-elegant li:last-child { border-bottom: none; }
    .lecture-list-elegant li strong {
      min-width: 80px;
      font-family: var(--font-serif);
      color: var(--accent-bright);
      font-size: 14.5px; flex-shrink: 0;
    }
    .lecture-list-elegant li span {
      color: var(--text-dim);
      font-size: 15px; line-height: 1.75;
      flex: 1; min-width: 0;
    }

    /* ---- CALLOUTS (définitions, astuces, erreurs) ---- */
    .lecture-callout {
      margin: 26px 0;
      padding: 16px 18px 16px 20px;
      border-left: 3px solid var(--accent-bright);
      background: var(--tint-gold);
      border-radius: 0 12px 12px 0;
      min-width: 0;
    }
    .lecture-callout-body,
    .lecture-callout-content { flex: 1; min-width: 0; }
    .lecture-callout-title,
    .lecture-callout-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-bottom: 10px;
    }
    .lecture-callout-body p,
    .lecture-callout-content p,
    .lecture-callout p {
      margin: 0 0 10px;
      font-size: 15.5px;
      line-height: 1.85;
      color: var(--text-body);
      overflow-wrap: break-word;
    }
    .lecture-callout-body p:last-child,
    .lecture-callout-content p:last-child,
    .lecture-callout p:last-child { margin-bottom: 0; }
    .lecture-callout-body strong,
    .lecture-callout-content strong { color: var(--text-light); }

    .lecture-callout-gold {
      border-left-color: var(--accent-bright);
      background: var(--tint-gold);
    }
    .lecture-callout-gold .lecture-callout-title { color: var(--accent-bright); }

    .lecture-callout-key {
      border-left-color: var(--accent-bright);
      background: var(--tint-gold);
    }
    .lecture-callout-key .lecture-callout-title { color: var(--accent-bright); }

    .lecture-callout-warning {
      border-left-color: var(--warning-bright);
      background: var(--tint-warn);
    }
    .lecture-callout-warning .lecture-callout-title { color: var(--warning-bright); }

    .lecture-callout-danger {
      border-left-color: var(--danger-light);
      background: var(--tint-red);
    }
    .lecture-callout-danger .lecture-callout-title { color: var(--danger-light); }

    /* ---- ENCADRÉS HISTOIRE / CULTURE ---- */
    .lecture-aside {
      margin: 28px 0;
      padding: 14px 18px 14px 20px;
      border-left: 3px solid var(--border-soft);
      background: rgba(139, 115, 85, 0.05);
      border-radius: 0 12px 12px 0;
      min-width: 0;
    }
    .lecture-aside-content { flex: 1; min-width: 0; }
    .lecture-aside-label {
      display: block; font-size: 10.5px;
      font-weight: 700; letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--accent); margin-bottom: 10px;
    }
    .lecture-aside-content p {
      margin: 0; font-size: 15px;
      line-height: 1.85; color: var(--text-dim);
      font-style: italic;
    }

    /* ---- FORMULES MISES EN VALEUR ---- */
    .lecture-formula-hero {
      margin: 40px 0; padding: 32px 22px 30px;
      text-align: center; position: relative;
      min-width: 0;
      background: linear-gradient(180deg, rgba(224, 184, 74, 0.05), rgba(224, 184, 74, 0.012));
      border-radius: 8px;
    }
    .lecture-formula-hero::before,
    .lecture-formula-hero::after {
      content: ''; position: absolute;
      left: 50%; transform: translateX(-50%);
      width: 60px; height: 1px;
      background: rgba(224, 184, 74, 0.35);
    }
    .lecture-formula-hero::before { top: 0; }
    .lecture-formula-hero::after { bottom: 0; }
    .lecture-formula-hero-label {
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent); margin-bottom: 18px;
    }
    .lecture-formula-hero-main {
      font-family: var(--font-serif);
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700; color: var(--text-light);
      line-height: 1.25;
      letter-spacing: -0.02em;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .lecture-formula-hero-desc {
      font-size: 13.5px; color: var(--text-dim);
      margin-top: 14px; font-style: italic;
      letter-spacing: 0.02em;
      line-height: 1.7;
    }

    .lecture-formula-box {
      margin: 24px 0; padding: 18px 22px;
      border: 1px solid rgba(224, 184, 74, 0.13);
      border-left: 3px solid var(--accent-bright);
      background: linear-gradient(135deg, rgba(224, 184, 74, 0.055), rgba(224, 184, 74, 0.015));
      border-radius: 0 12px 12px 0;
      text-align: center; min-width: 0;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .lecture-formula-main {
      font-family: var(--font-serif);
      font-size: 19px; font-weight: 600;
      color: var(--text-light);
      line-height: 1.55;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .lecture-formula-desc {
      font-size: 13px; color: var(--text-dim);
      margin-top: 8px; line-height: 1.65;
      font-style: italic;
    }

    /* ---- RÈGLES FONDAMENTALES ---- */
    .lecture-rule {
      margin: 32px 0; padding: 26px 20px;
      text-align: center;
      border-top: 1px solid var(--border-gold);
      border-bottom: 1px solid var(--border-gold);
      background: linear-gradient(180deg, rgba(224, 184, 74, 0.03), transparent);
      min-width: 0;
    }
    .lecture-rule-label {
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-bottom: 16px;
    }
    .lecture-rule-body {
      font-family: var(--font-serif);
      font-size: 18px; color: var(--text-light);
      line-height: 2; display: flex;
      align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 12px;
      overflow-wrap: anywhere;
    }
    .lecture-rule-iff {
      color: var(--accent-bright); font-size: 20px;
    }
    .lecture-rule-and {
      font-family: var(--font-body);
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--accent);
      padding: 4px 12px;
      border: 1px solid rgba(224, 184, 74, 0.25);
      border-radius: 100px;
    }

    /* ---- EXEMPLES ---- */
    .lecture-example {
      margin: 26px 0; padding: 2px 0 2px 18px;
      border-left: 2px solid rgba(224, 184, 74, 0.35);
      min-width: 0;
    }
    .lecture-example-label {
      display: block; font-size: 10.5px;
      font-weight: 700; letter-spacing: 2.6px;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-bottom: 12px;
    }
    .lecture-example-content {
      color: var(--text-body);
      font-size: 15.5px; line-height: 1.85;
    }
    .lecture-example-content p {
      margin: 0 0 10px;
      color: var(--text-body);
      overflow-wrap: break-word;
    }
    .lecture-example-content p:last-child { margin-bottom: 0; }
    .lecture-example-featured {
      border-left: none;
      padding: 20px 22px;
      background: var(--tint-gold);
      border: 1px solid rgba(224, 184, 74, 0.14);
      border-left: 3px solid var(--accent-bright);
      border-radius: 12px;
    }
    .lecture-example-featured .lecture-example-label {
      color: var(--accent-bright);
    }

    /* ---- ÉTAPES NUMÉROTÉES ---- */
    .lecture-steps { margin: 24px 0; }
    .lecture-step {
      display: flex; gap: 16px;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-soft);
      min-width: 0;
    }
    .lecture-step:last-child { border-bottom: none; }
    .lecture-step-number {
      flex-shrink: 0;
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif);
      font-size: 15px; font-weight: 700;
      color: var(--accent-bright);
      border: 1px solid rgba(224, 184, 74, 0.3);
      background: rgba(224, 184, 74, 0.06);
      line-height: 1;
    }
    .lecture-step-content {
      flex: 1; min-width: 0;
      overflow-wrap: break-word;
      padding-top: 4px;
    }
    /* v4.30 — strong redevient inline : « Titre : texte » reste UNE phrase,
       le deux-points ne se retrouve plus orphelin en début de ligne.
       Les titres seuls (<p><strong>Titre</strong></p>) gardent leur ligne. */
    .lecture-step-content strong {
      display: inline; color: var(--text-light);
      font-size: inherit; font-weight: 700;
      line-height: 1.75;
    }
    .lecture-step-content p {
      margin: 0; font-size: 14.5px;
      line-height: 1.75; color: var(--text-dim);
      overflow-wrap: break-word;
    }

    /* ---- CHAÎNES / CYCLES / VOCABULAIRE ---- */
    .lecture-chain {
      display: flex; align-items: center;
      justify-content: center; flex-wrap: wrap;
      gap: 10px; padding: 28px 12px;
      margin: 28px 0;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
    }
    .chain-item {
      font-family: var(--font-serif);
      font-size: 22px; font-weight: 700;
      color: var(--text-muted);
      padding: 4px 10px;
      transition: color 0.25s;
    }
    .chain-item.active { color: var(--accent-bright); }
    .chain-arrow {
      color: var(--text-muted); font-size: 11px;
    }

    .lecture-powers-cycle {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0; margin: 28px 0;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
    }
    .power-box {
      padding: 22px 10px; text-align: center;
      border-right: 1px solid var(--border-soft);
      min-width: 0;
    }
    .power-box:last-child { border-right: none; }
    .power-expo {
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 2px; color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .power-value {
      font-family: var(--font-serif);
      font-size: 26px; font-weight: 700;
      color: var(--text-light); line-height: 1;
    }

    .lecture-vocab-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0; margin: 24px 0;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
    }
    .vocab-card {
      padding: 20px 18px;
      border-right: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      min-width: 0;
    }
    .vocab-card:nth-child(2n) { border-right: none; }
    .vocab-card:nth-last-child(-n+2) { border-bottom: none; }
    .vocab-symbol {
      font-family: var(--font-serif);
      font-size: 26px; font-weight: 700;
      color: var(--accent-bright);
      line-height: 1; margin-bottom: 10px;
    }
    .vocab-name {
      font-size: 12.5px; font-weight: 600;
      color: var(--text-light); margin-bottom: 5px;
    }
    .vocab-notation {
      font-size: 12px; color: var(--text-dim);
      font-family: var(--font-serif);
    }
    .vocab-card-success .vocab-symbol { color: var(--success-light); }
    .vocab-card-info .vocab-symbol { color: var(--info); }

    .lecture-plane-visual {
      position: relative; height: 260px;
      margin: 28px 0;
      border: 1px solid var(--border-soft);
      border-radius: 8px; overflow: hidden;
    }

    /* ---- RÉCAPITULATIF ---- */
    .lecture-recap {
      margin: 56px 0 24px;
      padding: 28px 0 0;
      border-top: 1px solid var(--border-gold);
      position: relative; min-width: 0;
    }
    .lecture-recap::before {
      content: ''; position: absolute;
      top: -1px; left: 0;
      width: 60px; height: 2px;
      background: var(--accent-bright);
    }
    .lecture-recap-title {
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-bottom: 18px;
    }
    .lecture-recap-list {
      list-style: none; padding: 0; margin: 0;
    }
    .lecture-recap-list li {
      position: relative;
      padding: 10px 0 10px 28px;
      color: var(--text-body);
      font-size: 15.5px; line-height: 1.8;
      border-bottom: 1px solid var(--border-soft);
      overflow-wrap: break-word;
      word-break: break-word; margin: 0;
    }
    .lecture-recap-list li:last-child { border-bottom: none; }
    .lecture-recap-list li::before {
      content: '✓'; position: absolute;
      left: 0; top: 10px;
      color: var(--accent-bright); font-size: 14px;
      font-weight: 700;
    }

    /* ---- FIN DE PARTIE ---- */
    .lecture-end {
      text-align: center;
      margin: 56px 0 0;
      padding: 32px 16px 16px;
      border-top: 1px solid var(--border-gold);
    }
    .lecture-end-icon {
      display: block; font-size: 28px;
      margin-bottom: 14px; opacity: 0.75;
    }
    .lecture-end-text {
      font-family: var(--font-serif);
      font-size: 21px; font-weight: 700;
      font-style: italic;
      color: var(--accent-bright);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .lecture-end-sub {
      font-size: 13.5px; color: var(--text-dim);
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }
    .lecture-end-divider {
      width: 44px; height: 1px;
      margin: 0 auto;
      background: rgba(224, 184, 74, 0.4);
    }

    /* ---- QCM / QUIZ ---- */
    .lecture-quiz {
      display: flex; flex-direction: column;
      gap: 12px; margin: 20px 0;
    }
    .lecture-quiz-item {
      background: var(--bg-card);
      border: 1px solid rgba(224, 184, 74, 0.14);
      border-radius: 12px;
      padding: 16px 18px;
      transition: var(--transition);
    }
    html[data-theme="light"] .lecture-quiz-item {
      background: rgba(255, 255, 255, 0.7);
    }
    .lecture-quiz-item:hover {
      border-color: rgba(224, 184, 74, 0.25);
    }
    .lecture-quiz-q {
      font-weight: 600; color: var(--text-light);
      margin-bottom: 10px;
      font-size: 15px; line-height: 1.6;
    }
    .lecture-quiz-options {
      display: grid; gap: 6px; margin: 10px 0;
    }
    .lecture-quiz-options span {
      color: var(--text-dim);
      font-size: 14.5px; padding: 2px 0;
      line-height: 1.6;
    }
    .lecture-quiz-answer {
      margin-top: 12px;
      background: rgba(58, 182, 126, 0.08);
      border-left: 3px solid var(--success-light);
      padding: 12px 16px;
      border-radius: 0 10px 10px 0;
      color: var(--text-body);
      font-size: 14.5px; line-height: 1.75;
    }
    .lecture-quiz-answer p {
      margin: 0 0 8px;
      color: var(--text-body);
      overflow-wrap: break-word;
    }
    .lecture-quiz-answer p:last-child { margin-bottom: 0; }
    .lecture-quiz-answer strong { color: var(--success-light); }

    /* ---- EXERCICES ---- */
    .lecture-exercise {
      background: var(--tint-gold);
      border: 1px solid rgba(224, 184, 74, 0.16);
      border-left: 3px solid rgba(224, 184, 74, 0.55);
      border-radius: 12px;
      padding: 18px 20px; margin: 24px 0;
      transition: var(--transition);
    }
    html[data-theme="light"] .lecture-exercise {
      background: rgba(184, 134, 11, 0.06);
    }
    .lecture-exercise:hover {
      border-color: rgba(224, 184, 74, 0.28);
      border-left-color: var(--accent-bright);
    }
    .lecture-exercise-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--accent-bright); margin-bottom: 12px;
      line-height: 1.6;
    }
    .lecture-exercise .lecture-text {
      margin-bottom: 12px; font-size: 15px;
    }
    .lecture-exercise .lecture-text:last-of-type { margin-bottom: 0; }

    /* ---- SOLUTIONS DÉPLIABLES ---- */
    #contentBody details {
      margin-top: 14px;
      padding-top: 2px;
    }
    #contentBody details > summary {
      cursor: pointer;
      color: var(--accent-bright);
      font-weight: 600; font-size: 13px;
      user-select: none;
      list-style: none;
      display: inline-flex; align-items: center;
      gap: 8px; padding: 8px 16px;
      border-radius: 100px;
      background: rgba(224, 184, 74, 0.08);
      border: 1px solid rgba(224, 184, 74, 0.2);
      transition: var(--transition);
      -webkit-tap-highlight-color: transparent;
      line-height: 1.4;
    }
    #contentBody details > summary::-webkit-details-marker { display: none; }
    #contentBody details > summary::before {
      content: '▶'; font-size: 9px;
      transition: transform 0.25s ease;
      display: inline-block;
    }
    #contentBody details[open] > summary::before {
      transform: rotate(90deg);
    }
    #contentBody details > summary:hover {
      background: rgba(224, 184, 74, 0.15);
      border-color: rgba(224, 184, 74, 0.3);
    }
    #contentBody details[open] > summary {
      margin-bottom: 10px;
    }

    /* ---- FIGURES / SCHÉMAS ---- */
    .lecture-figure {
      margin: 30px auto; padding: 0;
      max-width: 560px; width: 100%;
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; min-width: 0;
    }
    .lecture-figure svg {
      display: block; width: 100%;
      max-width: 100%; height: auto;
      background: rgba(var(--rgb-soft), 0.02);
      border: 1px solid var(--border-soft);
      border-radius: 12px; padding: 10px;
      box-sizing: border-box;
    }
    html[data-theme="light"] .lecture-figure svg {
      background: rgba(255, 255, 255, 0.6);
    }
    .lecture-figure-caption {
      margin-top: 12px; font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.6; text-align: center;
      max-width: 100%;
      overflow-wrap: break-word;
    }
    #contentBody figure {
      margin: 24px 0; padding: 0;
      display: flex; flex-direction: column;
      align-items: center; min-width: 0;
    }
    #contentBody figure img,
    #contentBody figure svg {
      max-width: 100%; height: auto;
      background: rgba(var(--rgb-soft), 0.02);
      border: 1px solid var(--border-soft);
      border-radius: 12px; padding: 8px;
      box-sizing: border-box;
    }
    #contentBody figcaption {
      margin-top: 12px; font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
      text-align: center;
      line-height: 1.6; max-width: 100%;
      overflow-wrap: break-word;
    }

    #contentBody * { box-sizing: border-box; min-width: 0; }
    #contentBody > * {
      overflow-wrap: break-word;
      word-wrap: break-word;
    }
    /* ============================================================
       LECTEUR PDF ARVEXA PERSONNALISÉ (v5.1)
       Visionneuse canvas maison (pdf.js embarqué) — zéro dépendance
       au lecteur PDF du système/navigateur. Feuilles A4 empilées dans
       le flux, rendu paresseux (IntersectionObserver), zoom, 100 %
       hors-ligne (SW). Fonctionne identiquement desktop et mobile.
       ============================================================ */
    .arv-pdf { width: 100%; max-width: var(--content-max); margin: 0 auto; }
    .arv-pdf-toolbar {
      position: sticky;
      top: calc(var(--header-h) + var(--safe-top) + 10px);
      z-index: 40;
      display: flex; align-items: center; justify-content: center;
      gap: 2px;
      padding: 7px 10px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.16);
      margin-bottom: 16px;
    }
    .arv-pdf-tbtn {
      width: 36px; height: 36px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 10px;
      background: transparent; color: var(--text-body);
      font-size: 14px; cursor: pointer; text-decoration: none;
      transition: var(--transition);
    }
    .arv-pdf-tbtn:active { transform: scale(0.94); }
    .arv-pdf-tbtn[disabled] { opacity: 0.32; pointer-events: none; }
    .arv-pdf-tbtn.gold { color: var(--accent-bright); }
    .arv-pdf-count {
      min-width: 62px; text-align: center; flex-shrink: 0;
      font-size: 12.5px; font-weight: 700; color: var(--text-body);
      font-variant-numeric: tabular-nums;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .arv-pdf-sep { width: 1px; height: 20px; background: var(--card-border); flex-shrink: 0; margin: 0 4px; }
    .arv-pdf-viewport { overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
    .arv-pdf-pages { display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 0; }
    .arv-pdf-page {
      position: relative; flex-shrink: 0;
      background: #FFFFFF;
      border-radius: 4px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }
    .arv-pdf-page canvas { display: block; }
    .arv-pdf-page .arv-pdf-ph {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      color: var(--text-muted); font-size: 12px; font-weight: 600;
      background: var(--bg-surface);
    }
    .arv-pdf-page.rendered .arv-pdf-ph { display: none; }
    .arv-pdf-status {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center;
      min-height: 300px; padding: 40px 20px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      color: var(--text-body); font-size: 14px;
    }
    .arv-pdf-status .spinner { width: 34px; height: 34px; }
    .arv-pdf-status h3 { font-size: 16px; font-weight: 700; color: var(--text-light); }
    .arv-pdf-status p { font-size: 13px; color: var(--text-dim); max-width: 360px; line-height: 1.6; }
    .arv-pdf-status-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .arv-pdf-status-btn {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border-gold);
      background: var(--tint-gold);
      color: var(--accent-bright);
      border-radius: 999px; padding: 9px 20px;
      font-size: 13px; font-weight: 700;
      cursor: pointer; text-decoration: none;
      transition: var(--transition);
    }
    .arv-pdf-status-btn:active { transform: scale(0.97); }
    /* ✅ v5.3 — SKELETON de chargement du cours : 3 feuilles A4 scintillantes
       à la place du simple spinner (l'utilisateur voit la forme de ce qui
       arrive, plus aucun « panneau vide »). */
    .arv-pdf-skel {
      display: flex; gap: 12px;
      align-items: center; justify-content: center;
    }
    .arv-pdf-skel-page {
      position: relative; width: 88px; height: 118px;
      border-radius: 6px; overflow: hidden;
      background: var(--bg-surface);
      border: 1px solid var(--card-border);
    }
    .arv-pdf-skel-page:nth-child(2) { transform: scale(1.14); }
    .arv-pdf-skel-page::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 32%, rgba(224, 184, 74, 0.14) 50%, transparent 68%);
      transform: translateX(-100%);
      animation: arvSkelShimmer 1.5s ease-in-out infinite;
    }
    .arv-pdf-skel-page:nth-child(2)::after { animation-delay: 0.18s; }
    .arv-pdf-skel-page:nth-child(3)::after { animation-delay: 0.36s; }
    @keyframes arvSkelShimmer { to { transform: translateX(100%); } }
    .arv-pdf-skel-line {
      position: absolute; left: 11px; right: 11px; height: 6px;
      border-radius: 3px; background: var(--card-border);
    }
    .arv-pdf-skel-line.t { top: 13px; left: 11px; right: auto; width: 52%; height: 8px; background: var(--border-gold); opacity: 0.75; }
    .arv-pdf-skel-line.l1 { top: 33px; }
    .arv-pdf-skel-line.l2 { top: 47px; right: 24px; }
    .arv-pdf-skel-line.l3 { top: 61px; }
    .arv-pdf-skel-line.l4 { top: 75px; right: 19px; }
    .arv-pdf-skel-line.l5 { top: 89px; }
    @media (prefers-reduced-motion: reduce) {
      .arv-pdf-skel-page::after { animation: none; }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      :root { --content-max: 100%; }
      .content-wrapper { padding: 20px 16px 30px; }
    }

    @media (max-width: 600px) {
      .content-wrapper { padding: 16px 14px 28px; }
      #contentBody { font-size: 15.5px; line-height: 1.8; }

      .header { padding-left: 10px; padding-right: 10px; gap: 8px; }
      .ht-main { font-size: 12.5px; }
      .tts-btn, .notes-btn { width: 34px; padding: 0; justify-content: center; }
      .tts-btn span, .notes-btn span { display: none; }
      .icon-btn { width: 34px; height: 34px; }

      #contentBody h1 { font-size: 24px; }
      #contentBody h2 { font-size: 20px; }
      #contentBody h3 { font-size: 17px; }
      #contentBody p { font-size: 15px; }

      .lecture-hero { margin-bottom: 32px; padding-bottom: 22px; }
      .lecture-hero-title { font-size: 26px; }
      .lecture-hero-intro { font-size: 15px; }
      .lecture-hero-meta { gap: 6px; }
      .lecture-section { margin-bottom: 52px; }
      .lecture-section-header { gap: 14px; margin-bottom: 20px; padding-bottom: 12px; }
      .lecture-section-num { font-size: 30px; }
      .lecture-section-title { font-size: 20px; }
      .lecture-subtitle { font-size: 16px; padding-left: 12px; }
      .lecture-text { font-size: 15px; }
      .lecture-toc { margin-bottom: 38px; }

      .lecture-formula-hero { padding: 26px 14px; margin: 32px 0; }
      .lecture-formula-hero-main { font-size: 28px; }
      .lecture-formula-box { padding: 14px 16px; }
      .lecture-formula-main { font-size: 17px; }

      .lecture-powers-cycle { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .power-box { padding: 18px 8px; border-right: none; border-bottom: 1px solid var(--border-soft); }
      .power-box:nth-child(odd) { border-right: 1px solid var(--border-soft); }
      .power-box:nth-last-child(-n+2) { border-bottom: none; }

      .chain-item { font-size: 19px; }
      .lecture-quiz-item { padding: 14px 15px; }
      .lecture-exercise { padding: 15px 16px; }
      .lecture-example-featured { padding: 16px 16px; }
      .lecture-callout { padding: 13px 14px 13px 16px; }
      .lecture-figure { max-width: 100%; }

      .katex { font-size: 1em; }
      .katex-display { margin: 18px 0; }

      .nav-btn { font-size: 12px; padding: 10px 16px; }
      .nav-bar { margin-top: 48px; }
    }

    @media (max-width: 380px) {
      .content-wrapper { padding: 14px 12px 26px; }

function toDate(value) {
  if (!value) return null;
  if (typeof value.toDate === 'function') return value.toDate();
  if (value.seconds !== undefined) return new Date(value.seconds * 1000);
  const date = value instanceof Date ? value : new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

  const endDate = toDate(userData.subscriptionEndDate);

  return endDate.getTime() > Date.now();

let tocObserver = null;

function initTocSpy() {
  if (tocObserver) {
    try { tocObserver.disconnect(); } catch (e) {}
    tocObserver = null;
  }
  const tocLinks = contentBody.querySelectorAll('.lecture-toc-list a[href^="#"]');
  if (!tocLinks.length || !('IntersectionObserver' in window)) return;

  const map = new Map();
  tocLinks.forEach(a => {
    const href = a.getAttribute('href') || '';
    if (href.length < 2) return;
    const id = decodeURIComponent(href.slice(1));
    const target = document.getElementById(id);
    if (target) map.set(target, a);
  });
  if (!map.size) return;

  tocObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const link = map.get(en.target);
      if (!link) return;
      if (en.isIntersecting) {
        tocLinks.forEach(l => l.classList.remove('toc-active'));
        link.classList.add('toc-active');
      }
    });
  }, { rootMargin: '-12% 0px -70% 0px', threshold: 0 });

  map.forEach((_, target) => {
    try { tocObserver.observe(target); } catch (e) {}
  });
}

// v4.30 — MISE EN PAGE DES FORMULES (présentation seulement, le
// contenu des cours n'est PAS modifié) : une formule de calcul
// (=, ≈, →, ≥…) noyée dans une phrase passe sur SA propre ligne,
// comme un calcul posé au tableau. Fini les formules coupées en
// deux par le retour à la ligne du téléphone.
// ================================================================
function promoteMathLines(root) {
  try {
    if (!root) return;
    const spans = root.querySelectorAll('p > .math, li > .math');
    spans.forEach((sp) => {
      if (sp.classList.contains('math-line')) return;
      if (sp.closest('.lecture-formula-hero, .lecture-formula-box, .katex, .lecture-table')) return;
      const txt = (sp.textContent || '').trim();
      if (!txt) return;
      const hasRel = /[=≈≠→⇔≥≤±]/.test(txt);
      if (!(hasRel ? txt.length >= 8 : txt.length >= 14)) return;
      const parent = sp.parentElement;
      if (!parent) return;

      // contexte texte AVANT / APRÈS la formule
      let before = '', after = '';
      let n = sp.previousSibling;
      while (n && n.nodeType === 3) { before = n.textContent + before; n = n.previousSibling; }
      n = sp.nextSibling;
      while (n && n.nodeType === 3) { after += n.textContent; n = n.nextSibling; }
      // formule serrée dans une parenthèse de la phrase → on ne touche pas
      if (/\(\s*$/.test(before) || /^\s*\)/.test(after)) return;

      // déjà seule dans son paragraphe → rien à faire
      const others = Array.from(parent.childNodes).filter((c) =>
        c !== sp && !(c.nodeType === 3 && !c.textContent.trim()));
      if (!others.length) return;

      // ponctuation de fin de phrase collée au span → suit la formule
      // v5.2 : tolère l'espace avant la ponctuation (« 2i = 0 + 2i » + « : »)
      // → le « : » est collé à la formule (fini le « : » orphelin) ;
      // espace insécable avant : et ; (typographie FR)
      const nx = sp.nextSibling;
      if (nx && nx.nodeType === 3) {
        const m = nx.textContent.match(/^[ \t\u00a0]*([:;,….]+)/);
        if (m) {
          const glue = (m[1] === ':' || m[1] === ';') ? '\u00a0' : '';
          sp.appendChild(document.createTextNode(glue + m[1]));
          nx.textContent = nx.textContent.slice(m[0].length);
        }
      }
      sp.classList.add('math-line');
    });
  } catch (e) {}
}

function enhanceContent() {
  try { promoteMathLines(contentBody); } catch (e) {}
  try {
    contentBody.querySelectorAll('table').forEach(tbl => {
      const parent = tbl.parentElement;
      if (parent && parent.classList.contains('table-wrap')) return;
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      tbl.parentNode.insertBefore(wrap, tbl);
      wrap.appendChild(tbl);
    });
  } catch (e) {}

  try {
    contentBody.querySelectorAll('img').forEach(img => {
      if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
    });
  } catch (e) {}

  try { initTocSpy(); } catch (e) {}
}

function updatePartDots() {
  if (!partDots) return;
  if (!parts.length || parts.length > 20) {
    partDots.hidden = true;
    return;
  }
  if (partDots.hidden) partDots.hidden = false;
  if (partDots.childElementCount !== parts.length) {
    partDots.innerHTML = parts.map(() => '<span class="pdot"></span>').join('');
  }
  Array.from(partDots.children).forEach((d, i) => {
    d.classList.toggle('active', i === currentIndex);
    d.classList.toggle('done', i < currentIndex);
  });
}

// ================================================================
// CHARGEMENT
// ================================================================
function loadContent() {
  // ✅ SEC — verrou Premium sur l'onglet Corrections
  if (tab === 'corrections' && !getPremiumNow()) {
    premiumGateShown = true;
    showPremiumPaywall();
    return;
  }

  const manifestPath = `cours/${subject}.json`;

  contentBody.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Chargement du contenu...</p>
    </div>
  `;

  fetch(manifestPath)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(data => {
      const ch = (data.chapters || []).find(c => c.number === chapter);
      if (!ch) { showContentUnavailable(); return; }

      const tabKey = tab === 'cours' ? 'cours'
                   : tab === 'exercices' ? 'exercices'
                   : 'corrections';

      parts = (ch[tabKey] || []).map(p => ({
        title: p.title || `Partie ${p.part}`,
        file: p.file || '',
        part: p.part,
        duration: p.duration || 0
      }));

      parts = parts.filter(p => p.file);

      if (parts.length === 0) {
        showContentUnavailable();
        return;
      }

      if (currentIndex >= parts.length) currentIndex = 0;
      // ✅ v5.8 — préchauffage des AUTRES parties du chapitre SANS AFFAMER
      // le PDF en cours (cause racine des « 4 minutes » : 3 PDF de plus
      // (~4 Mo) téléchargés en parallèle de celui qu'on essaie d'ouvrir).
      // DÉSORMAIS :
      //   1. démarrage APRÈS le téléchargement complet du PDF affiché
      //      (événement 'arvexa-pdf-ready' envoyé par openArvPdf) — ou 20 s
      //      de garde-fou pour les parties HTML ;
      //   2. connexion lente (2G / slow-2g / économiseur de données) → pas
      //      de préchauffage du tout : la 1ʳᵉ lecture prime ;
      //   3. fichiers déjà en cache sautés (CHECK_CACHED, zéro réseau) ;
      //   4. UN SEUL fichier à la fois, et mis en pause si l'élève ouvre
      //      entre-temps un autre PDF (__arvPdfLoading).
      // ⚠ on attend toujours que le SW CONTRÔLE la page (v4.31) : avant
      // clients.claim() (premier chargement), les fetch contournent le SW
      // et ne cachent rien (constaté en test réel hors-ligne v4.30).
      const prefetchParts = () => {
        const key = subject + '/' + chapter + '/' + tab;
        if (window.__arvPrefetchKey === key) return;
        window.__arvPrefetchKey = key;
        const current = parts[currentIndex] ? parts[currentIndex].file : '';
        const others = parts.map((p) => p.file).filter((f) => f && f !== current);
        if (!others.length) return;
        const conn = navigator.connection || {};
        if (conn.saveData || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g') return;
        if (!navigator.onLine) return;
        let cachedSet = new Set();
        const run = async () => {
          for (const f of others) {
            if (cachedSet.has(f)) continue;           // déjà sur l'appareil
            if (window.__arvPrefetchKey !== key) return; // chapitre changé
            while (window.__arvPdfLoading && window.__arvPrefetchKey === key) {
              await new Promise((r) => setTimeout(r, 900)); // une lecture prime
            }
            if (window.__arvPrefetchKey !== key) return;
            try { await fetch(f, { cache: 'reload' }); } catch (e) {}
            await new Promise((r) => setTimeout(r, 400)); // respiration réseau
          }
        };
        const curIsPdf = /\.pdf$/i.test(current);
        if (curIsPdf) {
          let kicked = false;
          const kick = () => { if (kicked) return; kicked = true; run(); };
          window.addEventListener('arvexa-pdf-ready', kick, { once: true });
          setTimeout(kick, 20000); // garde-fou (partie HTML, erreur réseau…)
          // ✅ v5.8 — PDF déjà chargé (ouverture < 1,2 s) : l'événement a pu
          // être émis AVANT l'inscription de ce listener → on démarre tout de suite.
          if (!window.__arvPdfLoading && document.querySelector('.arv-pdf-page.rendered')) kick();
        } else {
          setTimeout(run, 5000);
        }
        // Liste des fichiers déjà en cache (réponse du SW, zéro réseau)
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            const ch = new MessageChannel();
            ch.port1.onmessage = (e) => {
              if (e.data && e.data.type === 'CHECK_CACHED_RESULT' && Array.isArray(e.data.cached)) {
                cachedSet = new Set(e.data.cached);
              }
            };
            navigator.serviceWorker.controller.postMessage({ type: 'CHECK_CACHED', files: others }, [ch.port2]);
          }
        } catch (e) {}
      };
      if (!navigator.serviceWorker) {
        setTimeout(prefetchParts, 1200);
      } else if (navigator.serviceWorker.controller) {
        setTimeout(prefetchParts, 1200);
      } else {
        let prefetchStarted = false;
        const startPrefetchOnce = () => {
          if (prefetchStarted) return;
          prefetchStarted = true;
          setTimeout(prefetchParts, 600);
        };
        try {
          navigator.serviceWorker.addEventListener('controllerchange', startPrefetchOnce, { once: true });
          navigator.serviceWorker.ready.then(() => setTimeout(startPrefetchOnce, 800)).catch(() => startPrefetchOnce());
        } catch (e) { startPrefetchOnce(); }
      }
      renderPart();
    })
    .catch(() => {
      showContentUnavailable();
    });
}

function renderPart() {
  if (!parts || parts.length === 0) {
    showContentUnavailable();
    return;
  }
  if (currentIndex >= parts.length || currentIndex < 0) currentIndex = 0;

  const part = parts[currentIndex];
  if (!part) {
    showContentUnavailable();
    return;
  }

  // ✅ v4.30 — les écrans d'erreur masquent la navigation : on la remontre
  [prevBtn, nextBtn, partCounter, notesBtn].forEach((el) => { el.style.display = ''; });
  if (partDots) partDots.style.display = '';
  if (ttsBtn) ttsBtn.style.display = '';

  stopTTS();

  pageTitle.textContent = part.title || 'Partie ' + (currentIndex + 1);
  document.title = 'ARVEXA - ' + (part.title || 'Lecture');

  partCounter.textContent = `${currentIndex + 1} / ${parts.length}`;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex >= parts.length - 1;
  modalSub.textContent = part.title || 'Partie ' + (currentIndex + 1);

  const prevPart = parts[currentIndex - 1];
  const nextPart = parts[currentIndex + 1];
  prevBtn.title = prevPart ? prevPart.title : '';
  nextBtn.title = nextPart ? nextPart.title : '';
  updatePartDots();

  const filePath = part.file;

  contentBody.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Chargement...</p>
    </div>
  `;

  // ✅ v5-PDF — ouverture locale du PDF de la partie quand il existe
  // (formules, schémas et tableaux mis en page A4), repli automatique sur le
  // rendu HTML sinon (zéro régression). Verrou premium conservé sur les
  // corrections : pas de PDF sans abonnement.
  const pdfPath = toLocalPdfPath(filePath);
  if (pdfPath && (tab !== 'corrections' || getPremiumNow())) {
    // ✅ v5.3 — pdf.js se PRÉCHARGE pendant la sonde HEAD (avant : chargé
    // après, en série → 0,3 à 1 s perdus à chaque ouverture froide)
    loadArvPdfJs().catch(() => {});
    probeLocalPdf(pdfPath)
      .then((available) => {
        if (available) renderPdfReader(pdfPath);
        else loadPartHtml(filePath);
      })
      .catch(() => loadPartHtml(filePath));
  } else {
    loadPartHtml(filePath);
  }
}

// ================================================================
// ✅ v5-PDF — LECTEUR PDF LOCAL
// ================================================================
function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function toLocalPdfPath(htmlPath) {
  try {
    if (typeof htmlPath !== 'string' || !/\.html$/i.test(htmlPath)) return null;
    const pdf = htmlPath.replace(/\.html$/i, '.pdf');
    // garde-fou : même arborescence cours/<matiere>/<chapitre>/ que le HTML
    // d'origine (aucun caractère dangereux possible dans les attributs)
    if (!/^cours\/[a-z0-9_]+\/[a-z0-9_]+\/[A-Za-z0-9_-]+\.pdf$/.test(pdf)) return null;
    return pdf;
  } catch (e) { return null; }
}

function probeLocalPdf(url) {
  // ✅ v5.8 — le CACHE D'ABORD : un PDF déjà consulté/téléchargé est
  // détecté immédiatement (0 aller-retour réseau), même hors ligne —
  // l'ouverture d'un cours déjà vu ne dépend plus de la latence réseau.
  // La sonde HEAD réseau ne sert que si le PDF n'est pas en cache.
  // (Le SW n'intercepte pas les HEAD — garde method !== 'GET' — d'où la
  // lecture directe du Cache Storage depuis la page.)
  const fromCache = (window.caches && typeof caches.match === 'function')
    ? caches.match(url, { ignoreSearch: true }).then((hit) => !!hit).catch(() => false)
    : Promise.resolve(false);
  return fromCache.then((hit) => {
    if (hit) return true;
    return fetch(url, { method: 'HEAD' })
      .then((r) => !!r && r.ok)
      .catch(() => false);
  });
}

function renderPdfReader(pdfPath) {
  const part = parts[currentIndex];
  const rawTitle = (part && part.title) || pageTitle.textContent || 'Partie';
  const safeTitle = escapeAttr(rawTitle);

  // TTS impossible sur un PDF → bouton masqué (renderPart le remonte en HTML)
  if (ttsBtn) ttsBtn.style.display = 'none';

  contentBody.innerHTML = `
    <div class="arv-pdf">
      <div class="arv-pdf-toolbar" id="arvPdfToolbar">
        <button class="arv-pdf-tbtn" id="arvPdfPrev" aria-label="Page précédente" title="Page précédente">
          <i class="fas fa-chevron-up"></i>
        </button>
        <span class="arv-pdf-count" id="arvPdfCount">… / …</span>
        <button class="arv-pdf-tbtn" id="arvPdfNext" aria-label="Page suivante" title="Page suivante">
          <i class="fas fa-chevron-down"></i>
        </button>
        <span class="arv-pdf-sep"></span>

        <div class="arv-pdf-pages" id="arvPdfPages">
          <div class="arv-pdf-status" id="arvPdfStatus">
            <div class="arv-pdf-skel" aria-hidden="true">
              <div class="arv-pdf-skel-page"><span class="arv-pdf-skel-line t"></span><span class="arv-pdf-skel-line l1"></span><span class="arv-pdf-skel-line l3"></span><span class="arv-pdf-skel-line l5"></span></div>
              <div class="arv-pdf-skel-page"><span class="arv-pdf-skel-line t"></span><span class="arv-pdf-skel-line l1"></span><span class="arv-pdf-skel-line l2"></span><span class="arv-pdf-skel-line l4"></span><span class="arv-pdf-skel-line l5"></span></div>
              <div class="arv-pdf-skel-page"><span class="arv-pdf-skel-line t"></span><span class="arv-pdf-skel-line l2"></span><span class="arv-pdf-skel-line l3"></span><span class="arv-pdf-skel-line l5"></span></div>
            </div>

  markPartAsRead();

  // préchauffage hors-ligne : le PDF consulté est mis en cache par le SW.
